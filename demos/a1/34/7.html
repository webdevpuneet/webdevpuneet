<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Nav-dot indicator driven by snap">

<script type="text/plain" id="cdn">
https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js
https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>nav-dot indicator driven by snap</h1>
    <p class="hint">Scroll through the five sections, or click a dot to jump straight to one. The dot rail always reflects the section snap actually settled on &mdash; the same pattern real one-page sites use for their side nav.</p>
  </header>
  <div class="spacer">Scroll &darr;</div>
  <div class="pinSection">
    <nav class="dotRail" id="dotRail">
      <button class="dot active" data-i="0" aria-label="Section 1"></button>
      <button class="dot" data-i="1" aria-label="Section 2"></button>
      <button class="dot" data-i="2" aria-label="Section 3"></button>
      <button class="dot" data-i="3" aria-label="Section 4"></button>
      <button class="dot" data-i="4" aria-label="Section 5"></button>
    </nav>
    <div class="card" id="card">
      <div class="name" id="name">Overview</div>
    </div>
  </div>
  <div class="spacer end">Released &mdash; keep scrolling</div>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .spacer { height: 220px; display: flex; align-items: center; justify-content: center; color: var(--sub); font: 700 12px system-ui, sans-serif; text-transform: uppercase; letter-spacing: 0.05em; }
  .spacer.end { height: 320px; }
  .pinSection { position: relative; display: flex; align-items: center; justify-content: center; height: 220px; }
  .dotRail { position: absolute; right: 24px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 10px; padding: 0; margin: 0; border: 0; background: none; }
  .dot { width: 9px; height: 9px; padding: 0; border-radius: 50%; border: 2px solid #c7cad2; background: #fff; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.15s; }
  .dot.active { background: #db2777; border-color: #db2777; transform: scale(1.3); }
  .card {
    width: 240px;
    padding: 30px 22px;
    text-align: center;
    background: #db2777;
    color: #fff;
    border-radius: 14px;
    box-shadow: 0 14px 34px rgba(219,39,119,0.32);
  }
  .name { font: 800 20px system-ui, sans-serif; }
</script>

<script type="text/plain" id="js">
  gsap.registerPlugin(ScrollTrigger);

  var NAMES = ['Overview', 'Features', 'Pricing', 'Reviews', 'Contact'];
  var STOPS = 5;
  var dots = document.querySelectorAll('.dot');
  var name = document.getElementById('name');

  var st = ScrollTrigger.create({
    trigger: '.pinSection',
    start: 'top top',
    end: '+=1500',
    pin: true,
    scrub: 1,
    snap: 1 / (STOPS - 1),
    onUpdate: function (self) {
      var idx = Math.round(self.progress * (STOPS - 1));
      name.textContent = NAMES[idx];
      dots.forEach(function (d, i) { d.classList.toggle('active', i === idx); });
    }
  });

  // Clicking a dot scrolls straight to that section's own snap point —
  // the same jump-to-section a real nav rail gives visitors.
  dots.forEach(function (d) {
    d.addEventListener('click', function () {
      var i = Number(d.getAttribute('data-i'));
      var y = st.start + (i / (STOPS - 1)) * (st.end - st.start);
      window.scrollTo({ top: y, behavior: 'smooth' });
    });
  });
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
