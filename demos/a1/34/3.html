<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="snap.duration and snap.ease">

<script type="text/plain" id="cdn">
https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js
https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>snap.duration and snap.ease</h1>
    <p class="hint">Release mid-drag in each zone. Zone A snaps into place almost instantly; Zone B eases into place slowly with an overshoot &mdash; same snap mechanism, different <code>duration</code>/<code>ease</code>.</p>
  </header>
  <div class="spacer">Scroll &darr;</div>
  <div class="pinSection zoneA">
    <div class="zoneLabel">Zone A &mdash; duration: 0.15, ease: power4</div>
    <div class="card" id="cardA">
      <div class="num" id="numA">1 / 2</div>
    </div>
  </div>
  <div class="mid">Zone A released &mdash; scroll on to Zone B</div>
  <div class="pinSection zoneB">
    <div class="zoneLabel">Zone B &mdash; duration: 1.1, ease: elastic.out(1, 0.4)</div>
    <div class="card cardB" id="cardB">
      <div class="num" id="numB">1 / 2</div>
    </div>
  </div>
  <div class="spacer end">Released &mdash; keep scrolling</div>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .hint code { background: #eceef2; padding: 1px 5px; border-radius: 4px; font-size: 11.5px; }
  .spacer { height: 200px; display: flex; align-items: center; justify-content: center; color: var(--sub); font: 700 12px system-ui, sans-serif; text-transform: uppercase; letter-spacing: 0.05em; }
  .spacer.end { height: 260px; }
  .mid { height: 120px; display: flex; align-items: center; justify-content: center; color: var(--sub); font: 700 11px system-ui, sans-serif; text-transform: uppercase; letter-spacing: 0.05em; }
  .pinSection { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; height: 220px; }
  .zoneLabel { font: 700 11px ui-monospace, monospace; color: var(--sub); }
  .card {
    width: 220px;
    padding: 24px;
    text-align: center;
    background: #0891b2;
    color: #fff;
    border-radius: 14px;
    box-shadow: 0 14px 34px rgba(8,145,178,0.32);
  }
  .cardB { background: #be185d; box-shadow: 0 14px 34px rgba(190,24,93,0.32); }
  .num { font: 800 26px system-ui, sans-serif; }
</script>

<script type="text/plain" id="js">
  gsap.registerPlugin(ScrollTrigger);

  var numA = document.getElementById('numA');
  var numB = document.getElementById('numB');

  ScrollTrigger.create({
    trigger: '.zoneA',
    start: 'top top',
    end: '+=700',
    pin: true,
    scrub: 1,
    snap: {
      snapTo: [0, 1],
      duration: 0.15,   // snaps into place almost instantly
      ease: 'power4.out'
    },
    onUpdate: function (self) {
      numA.textContent = (self.progress < 0.5 ? 1 : 2) + ' / 2';
    }
  });

  ScrollTrigger.create({
    trigger: '.zoneB',
    start: 'top top',
    end: '+=700',
    pin: true,
    scrub: 1,
    snap: {
      snapTo: [0, 1],
      duration: 1.1,    // slow, visibly eased settle
      ease: 'elastic.out(1, 0.4)'
    },
    onUpdate: function (self) {
      numB.textContent = (self.progress < 0.5 ? 1 : 2) + ' / 2';
    }
  });
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
