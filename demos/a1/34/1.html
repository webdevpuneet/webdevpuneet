<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="snap: 1 / (sections - 1)">

<script type="text/plain" id="cdn">
https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js
https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>snap locks onto the nearest section</h1>
    <p class="hint">Scroll down, then let go partway between two colors. Don't scroll to a clean stop &mdash; release mid-drag and watch it finish the trip on its own.</p>
  </header>
  <div class="spacer">Scroll &darr;</div>
  <div class="pinSection">
    <div class="dotRail" id="dotRail">
      <div class="dot active"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <div class="card" id="card">
      <div class="num" id="num">1 / 4</div>
      <div class="label">section</div>
    </div>
  </div>
  <div class="spacer end">Released &mdash; keep scrolling</div>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .spacer { height: 220px; display: flex; align-items: center; justify-content: center; color: var(--sub); font: 700 12px system-ui, sans-serif; text-transform: uppercase; letter-spacing: 0.05em; }
  .spacer.end { height: 320px; }
  .pinSection { position: relative; display: flex; align-items: center; justify-content: center; height: 220px; }
  .dotRail { position: absolute; right: 26px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 10px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #d5d8e0; transition: background 0.2s, transform 0.2s; }
  .dot.active { background: #7c3aed; transform: scale(1.35); }
  .card {
    width: 240px;
    padding: 30px 22px;
    text-align: center;
    background: #7c3aed;
    color: #fff;
    border-radius: 14px;
    box-shadow: 0 14px 34px rgba(124,58,237,0.35);
  }
  .num { font: 800 34px system-ui, sans-serif; }
  .label { margin-top: 4px; font: 700 11px system-ui, sans-serif; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.85; }
</script>

<script type="text/plain" id="js">
  gsap.registerPlugin(ScrollTrigger);

  var SECTIONS = 4;
  var num = document.getElementById('num');
  var dots = document.querySelectorAll('.dot');

  var tl = gsap.timeline({
    scrollTrigger: {
      trigger: '.pinSection',
      start: 'top top',
      end: '+=1200',
      pin: true,
      scrub: 1,
      snap: 1 / (SECTIONS - 1), // 4 stops: 0, 1/3, 2/3, 1
      onUpdate: function (self) {
        var idx = Math.round(self.progress * (SECTIONS - 1));
        num.textContent = (idx + 1) + ' / ' + SECTIONS;
        dots.forEach(function (d, i) { d.classList.toggle('active', i === idx); });
      }
    }
  });

  tl.to('#card', { backgroundColor: '#6366f1', duration: 1 })
    .to('#card', { backgroundColor: '#0ea5e9', duration: 1 })
    .to('#card', { backgroundColor: '#16a34a', duration: 1 });
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
