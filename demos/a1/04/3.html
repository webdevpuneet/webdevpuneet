<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Grid's Second Axis — Click Any Cell">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Grid's Second Axis — Click Any Cell</h1>
    <p class="hint">Click any cell — Grid knows exactly which row <em>and</em> column it's in at once. Flexbox only ever tracks position along a single line.</p>
  </header>
  <main class="stageWrap">
    <div class="gridBox" id="gridBox"></div>
    <div class="readout">
      <span>Clicked cell: <strong id="readoutValue">&mdash;</strong></span>
    </div>
    <pre class="ruleTag">.gridBox {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: repeat(3, 60px);
}</pre>
  </main>
</script>

<script type="text/plain" id="css">
  :root {
    --ink: #14161c;
    --sub: #6b7080;
    --line: #e3e5ea;
    --accent: #6366f1;
  }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 14px 16px 26px; }
  .readout {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px 16px;
    font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--sub);
  }
  .readout strong { color: var(--accent); font-weight: 700; }
  .ruleTag {
    font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #3f4252;
    background: #eceef3;
    padding: 8px 14px;
    border-radius: 10px;
    max-width: 100%;
    overflow-x: auto;
    white-space: pre;
  }

  /* The rule this demo is about — one declaration places items on both axes at once. */
  .gridBox {
    width: 100%;
    max-width: 460px;
    box-sizing: border-box;
    padding: 10px;
    border: 1.5px dashed var(--line);
    border-radius: 12px;
    background: #fff;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(3, 60px);
    gap: 8px;
  }
  .cell {
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    background: #eceef3;
    color: var(--sub);
    font: 700 11px ui-monospace, monospace;
    cursor: pointer;
    transition: background .12s, color .12s;
  }
  .cell:hover { background: #dfe1f7; }
  .cellActive, .cellActive:hover {
    background: var(--accent);
    color: #fff;
  }
</script>

<script type="text/plain" id="js">
  var box = document.getElementById('gridBox');
  var out = document.getElementById('readoutValue');
  var COLS = 4, ROWS = 3;

  for (var r = 1; r <= ROWS; r++) {
    for (var c = 1; c <= COLS; c++) {
      var cell = document.createElement('div');
      cell.className = 'cell';
      cell.textContent = 'r' + r + ' c' + c;
      cell.setAttribute('data-row', r);
      cell.setAttribute('data-col', c);
      box.appendChild(cell);
    }
  }

  box.addEventListener('click', function (e) {
    var cell = e.target.closest('.cell');
    if (!cell) return;
    document.querySelectorAll('.cell').forEach(function (c) { c.classList.remove('cellActive'); });
    cell.classList.add('cellActive');
    out.textContent = 'row ' + cell.getAttribute('data-row') + ', column ' + cell.getAttribute('data-col');
  });
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
