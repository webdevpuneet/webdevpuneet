<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Flexbox Wrap — One Dimension at a Time">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Flexbox Wrap — One Dimension at a Time</h1>
    <p class="hint">Drag the handle — tags flow left to right and wrap to a new line when they run out of room, exactly like text. Flexbox never thinks about the next line while placing this one.</p>
  </header>
  <main class="stageWrap">
    <div class="resizeBox" id="rzBox" style="width:420px">
      <div class="tagRow" id="tagRow">
        <span class="tag">design-systems</span>
        <span class="tag">accessibility</span>
        <span class="tag">performance</span>
        <span class="tag">css</span>
        <span class="tag">javascript</span>
        <span class="tag">react</span>
        <span class="tag">animation</span>
        <span class="tag">typography</span>
      </div>
      <div class="resizeHandle" id="rzHandle" aria-hidden="true"></div>
    </div>
    <div class="readout">
      <span>Box width: <strong id="readoutValue">420px</strong></span>
      <span>Lines used: <strong id="readoutLines">&mdash;</strong></span>
    </div>
    <pre class="ruleTag">.tagRow {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}</pre>
  </main>
</script>

<script type="text/plain" id="css">
  :root {
    --ink: #14161c;
    --sub: #6b7080;
    --line: #e3e5ea;
    --accent: #6366f1;
  }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 14px 16px 26px; }
  .readout {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px 16px;
    font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--sub);
  }
  .readout strong { color: var(--accent); font-weight: 700; }
  .ruleTag {
    font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #3f4252;
    background: #eceef3;
    padding: 8px 14px;
    border-radius: 10px;
    max-width: 100%;
    overflow-x: auto;
    white-space: pre;
  }

  .resizeBox {
    position: relative;
    max-width: 100%;
    min-width: 140px;
    box-sizing: border-box;
    border: 1.5px dashed var(--line);
    border-radius: 12px;
    padding: 14px 20px 14px 14px;
    background: #fff;
  }
  .resizeHandle {
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 16px;
    cursor: ew-resize;
    background: repeating-linear-gradient(90deg, var(--line) 0 2px, transparent 2px 6px);
    border-left: 1px solid var(--line);
    touch-action: none;
  }
  .resizeHandle:hover { background-color: #eef0ff; }

  /* The rule this demo is about — a single-axis flow that wraps like text. */
  .tagRow {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .tag {
    padding: 7px 12px;
    border-radius: 20px;
    background: #eef0ff;
    color: var(--accent);
    font: 700 11.5px ui-monospace, monospace;
    white-space: nowrap;
  }
</script>

<script type="text/plain" id="js">
  var box = document.getElementById('rzBox');
  var handle = document.getElementById('rzHandle');
  var row = document.getElementById('tagRow');
  var outWidth = document.getElementById('readoutValue');
  var outLines = document.getElementById('readoutLines');
  var startX = 0, startWidth = 0, dragging = false;

  function report() {
    var w = Math.round(box.getBoundingClientRect().width);
    outWidth.textContent = w + 'px';
    var tops = {};
    Array.prototype.forEach.call(row.children, function (tag) {
      tops[Math.round(tag.getBoundingClientRect().top)] = true;
    });
    outLines.textContent = Object.keys(tops).length;
  }

  function onMove(e) {
    if (!dragging) return;
    var x = e.touches ? e.touches[0].clientX : e.clientX;
    var next = Math.max(140, Math.min(520, startWidth + (x - startX)));
    box.style.width = next + 'px';
    report();
  }
  function onUp() {
    dragging = false;
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
  }
  handle.addEventListener('pointerdown', function (e) {
    dragging = true;
    startX = e.clientX;
    startWidth = box.getBoundingClientRect().width;
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    e.preventDefault();
  });

  report();
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
