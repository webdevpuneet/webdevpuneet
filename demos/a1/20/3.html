<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Shimmer Sweep Effect">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Shimmer sweep effect</h1>
    <p class="hint">Click "Simulate load" — a light band sweeps left to right across the placeholder blocks, a step up from a flat pulsing gray.</p>
  </header>
  <main class="stageWrap">
    <div class="card" id="card">
      <div class="shimmer block w100 tall"></div>
      <div class="shimmer block w80"></div>
      <div class="shimmer block w60"></div>
    </div>
    <button type="button" class="triggerBtn" id="triggerBtn">Simulate load</button>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 24px 16px 28px; }

  .card {
    width: 100%; max-width: 340px; background: #fff; border: 1px solid var(--line);
    border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px;
  }

  .shimmer.block {
    border-radius: 6px;
    background: linear-gradient(90deg, #e7e9ee 25%, #f4f5f8 37%, #e7e9ee 63%);
    background-size: 400% 100%;
    animation: shimmer 1.3s ease-in-out infinite;
  }
  @keyframes shimmer {
    0% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .tall { height: 90px; }
  .w100 { width: 100%; height: 12px; }
  .w80 { width: 80%; height: 12px; }
  .w60 { width: 60%; height: 12px; }

  .real { display: flex; flex-direction: column; gap: 10px; }
  .thumb {
    width: 100%; height: 90px; border-radius: 8px;
    background: linear-gradient(135deg, #6366f1, #22c55e);
  }
  .card h3 { margin: 0; font-size: 13.5px; }
  .card p { margin: 0; font-size: 12.5px; color: var(--sub); line-height: 1.5; }

  .triggerBtn {
    padding: 11px 22px; border-radius: 9px; border: none;
    background: var(--accent); color: #fff; font: 700 13.5px system-ui, sans-serif; cursor: pointer;
  }
  .triggerBtn:hover { background: #4f52d6; }
</script>

<script type="text/plain" id="js">
  var card = document.getElementById('card');
  var triggerBtn = document.getElementById('triggerBtn');
  var skeletonHTML = card.innerHTML;
  var realHTML =
    '<div class="real">' +
      '<div class="thumb"></div>' +
      '<h3>Deploy pipeline now 40% faster</h3>' +
      '<p>Parallelized the build step and cached dependencies between runs.</p>' +
    '</div>';
  var loaded = false;

  triggerBtn.addEventListener('click', function () {
    if (loaded) {
      card.innerHTML = skeletonHTML;
      triggerBtn.textContent = 'Simulate load';
      loaded = false;
      return;
    }
    triggerBtn.disabled = true;
    triggerBtn.textContent = 'Loading…';
    setTimeout(function () {
      card.innerHTML = realHTML;
      triggerBtn.textContent = 'Run again';
      triggerBtn.disabled = false;
      loaded = true;
    }, 1800);
  });
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
