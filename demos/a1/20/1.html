<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Classic Rotating Spinner">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Classic rotating spinner</h1>
    <p class="hint">Click "Simulate load" to trigger a ~2 second fake request and watch the spinner run, then resolve into a checkmark.</p>
  </header>
  <main class="stageWrap">
    <div class="stage" id="stage">
      <button type="button" class="triggerBtn" id="triggerBtn">Simulate load</button>
    </div>
    <button type="button" class="resetBtn" id="resetBtn" hidden>Run again</button>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; --green: #16a34a; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 30px 16px 28px; min-height: 220px; justify-content: center; }

  .stage { display: flex; align-items: center; justify-content: center; height: 90px; }

  .triggerBtn, .resetBtn {
    padding: 11px 22px; border-radius: 9px; border: none;
    background: var(--accent); color: #fff; font: 700 13.5px system-ui, sans-serif; cursor: pointer;
  }
  .triggerBtn:hover, .resetBtn:hover { background: #4f52d6; }
  .resetBtn { background: #fff; color: var(--accent); border: 1.5px solid var(--line); }
  .resetBtn:hover { background: #eef0ff; }

  .spinner {
    width: 44px; height: 44px;
    border: 4px solid var(--line);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .doneWrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .checkCircle {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--green); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 800;
    animation: pop 0.28s ease;
  }
  @keyframes pop { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .doneLabel { font-size: 12.5px; color: var(--sub); font-weight: 700; }
</script>

<script type="text/plain" id="js">
  var stage = document.getElementById('stage');
  var triggerBtn = document.getElementById('triggerBtn');
  var resetBtn = document.getElementById('resetBtn');

  function startLoad() {
    stage.innerHTML = '<div class="spinner"></div>';
    setTimeout(function () {
      stage.innerHTML = '<div class="doneWrap"><div class="checkCircle">&#10003;</div><div class="doneLabel">Loaded</div></div>';
      resetBtn.hidden = false;
    }, 1900);
  }

  triggerBtn.addEventListener('click', startLoad);
  resetBtn.addEventListener('click', function () {
    resetBtn.hidden = true;
    stage.innerHTML = '<button type="button" class="triggerBtn" id="triggerBtn2">Simulate load</button>';
    document.getElementById('triggerBtn2').addEventListener('click', startLoad);
  });
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
