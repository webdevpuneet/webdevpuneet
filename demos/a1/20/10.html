<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Staggered List Reveal">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Staggered list reveal</h1>
    <p class="hint">Click "Simulate load" — each row fades and slides in slightly after the one above it, instead of the whole list appearing at once.</p>
  </header>
  <main class="stageWrap">
    <ul class="list" id="list">
      <li class="row skel"><div class="dot"></div><div class="skelLine w70"></div></li>
      <li class="row skel"><div class="dot"></div><div class="skelLine w50"></div></li>
      <li class="row skel"><div class="dot"></div><div class="skelLine w60"></div></li>
      <li class="row skel"><div class="dot"></div><div class="skelLine w40"></div></li>
    </ul>
    <button type="button" class="triggerBtn" id="triggerBtn">Simulate load</button>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; --skel: #e7e9ee; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 24px 16px 28px; }

  .list { list-style: none; margin: 0; padding: 0; width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 8px; }
  .row {
    display: flex; align-items: center; gap: 10px;
    background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
    opacity: 1;
  }

  .dot { width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; background: var(--skel); }
  .skelLine { height: 10px; border-radius: 5px; background: var(--skel); animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  .w70 { width: 70%; } .w60 { width: 60%; } .w50 { width: 50%; } .w40 { width: 40%; }

  .row.real .dot { background: linear-gradient(135deg, #6366f1, #22c55e); }
  .row span.name { font-size: 12.5px; font-weight: 700; }
  .row span.meta { font-size: 11px; color: var(--sub); margin-left: auto; }

  .row.entering { opacity: 0; transform: translateY(6px); }
  .row.entered { opacity: 1; transform: translateY(0); transition: opacity 0.35s ease, transform 0.35s ease; }

  .triggerBtn {
    padding: 11px 22px; border-radius: 9px; border: none;
    background: var(--accent); color: #fff; font: 700 13.5px system-ui, sans-serif; cursor: pointer;
  }
  .triggerBtn:hover { background: #4f52d6; }
</script>

<script type="text/plain" id="js">
  var list = document.getElementById('list');
  var triggerBtn = document.getElementById('triggerBtn');

  var items = [
    { name: 'Ada Lovelace', meta: 'Online' },
    { name: 'Grace Hopper', meta: '2m ago' },
    { name: 'Alan Turing', meta: '1h ago' },
    { name: 'Barbara Liskov', meta: 'Offline' }
  ];

  var skeletonHTML = list.innerHTML;
  var loaded = false;

  function rowHTML(item) {
    return '<div class="dot"></div><span class="name">' + item.name + '</span><span class="meta">' + item.meta + '</span>';
  }

  triggerBtn.addEventListener('click', function () {
    if (loaded) {
      list.innerHTML = skeletonHTML;
      triggerBtn.textContent = 'Simulate load';
      loaded = false;
      return;
    }

    triggerBtn.disabled = true;
    triggerBtn.textContent = 'Loading…';

    setTimeout(function () {
      list.innerHTML = '';
      items.forEach(function (item, i) {
        var li = document.createElement('li');
        li.className = 'row real entering';
        li.innerHTML = rowHTML(item);
        list.appendChild(li);

        // Each row's entrance is offset from the one before it -- the
        // stagger is what reads as "the list is arriving," not a snap.
        setTimeout(function () {
          li.classList.remove('entering');
          li.classList.add('entered');
        }, i * 110);
      });

      triggerBtn.textContent = 'Run again';
      triggerBtn.disabled = false;
      loaded = true;
    }, 1100);
  });
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
