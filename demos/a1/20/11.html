<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Blur-Up Image Loading">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Blur-up image loading</h1>
    <p class="hint">Click "Simulate load" — a soft blurred placeholder (the image's real colors, just heavily blurred) sharpens into the finished image instead of showing a blank box.</p>
  </header>
  <main class="stageWrap">
    <div class="frame">
      <div class="ph" id="ph"></div>
    </div>
    <button type="button" class="triggerBtn" id="triggerBtn">Simulate load</button>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 24px 16px 28px; }

  .frame {
    width: 100%; max-width: 300px; height: 170px;
    border-radius: 12px; overflow: hidden; border: 1px solid var(--line);
  }

  /* Same gradient at both stages -- only the blur amount and scale change,
     which is what a real low-res-to-high-res image swap looks like. */
  .ph {
    width: 100%; height: 100%;
    background: linear-gradient(135deg, #6366f1 0%, #a855f7 45%, #f97316 100%);
    filter: blur(18px);
    transform: scale(1.15);
    transition: filter 0.6s ease, transform 0.6s ease;
  }
  .ph.sharp {
    filter: blur(0);
    transform: scale(1);
  }

  .triggerBtn {
    padding: 11px 22px; border-radius: 9px; border: none;
    background: var(--accent); color: #fff; font: 700 13.5px system-ui, sans-serif; cursor: pointer;
  }
  .triggerBtn:hover { background: #4f52d6; }
</script>

<script type="text/plain" id="js">
  var ph = document.getElementById('ph');
  var triggerBtn = document.getElementById('triggerBtn');
  var loaded = false;

  triggerBtn.addEventListener('click', function () {
    if (loaded) {
      ph.classList.remove('sharp');
      triggerBtn.textContent = 'Simulate load';
      loaded = false;
      return;
    }
    triggerBtn.disabled = true;
    triggerBtn.textContent = 'Loading…';
    // The blurred placeholder is visible immediately; only the sharpen
    // transition is delayed, standing in for the full-res image arriving.
    setTimeout(function () {
      ph.classList.add('sharp');
      triggerBtn.textContent = 'Run again';
      triggerBtn.disabled = false;
      loaded = true;
    }, 1500);
  });
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
