<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Skeleton Screen Placeholder">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Skeleton screen placeholder</h1>
    <p class="hint">Click "Simulate load" — the gray placeholder blocks pulse in the exact shape of the final card, then swap for the real content with no layout shift.</p>
  </header>
  <main class="stageWrap">
    <div class="card" id="card">
      <div class="row">
        <div class="skel avatar"></div>
        <div class="lines">
          <div class="skel line w60"></div>
          <div class="skel line w40"></div>
        </div>
      </div>
      <div class="skel line w100"></div>
      <div class="skel line w80"></div>
    </div>
    <button type="button" class="triggerBtn" id="triggerBtn">Simulate load</button>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; --skel: #e7e9ee; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 24px 16px 28px; }

  .card {
    width: 100%; max-width: 340px; background: #fff; border: 1px solid var(--line);
    border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px;
  }
  .row { display: flex; align-items: center; gap: 10px; }
  .lines { flex: 1; display: flex; flex-direction: column; gap: 6px; }

  .skel {
    background: var(--skel);
    border-radius: 6px;
    animation: pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
  .avatar { width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0; }
  .line { height: 11px; }
  .w100 { width: 100%; }
  .w80 { width: 80%; }
  .w60 { width: 60%; }
  .w40 { width: 40%; }

  .real { display: flex; flex-direction: column; gap: 10px; }
  .realRow { display: flex; align-items: center; gap: 10px; }
  .realAvatar {
    width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, #6366f1, #a855f7);
  }
  .realNames h3 { margin: 0; font-size: 13.5px; }
  .realNames p { margin: 2px 0 0; font-size: 11.5px; color: var(--sub); }
  .card p.body { margin: 0; font-size: 12.5px; color: var(--sub); line-height: 1.55; }

  .triggerBtn {
    padding: 11px 22px; border-radius: 9px; border: none;
    background: var(--accent); color: #fff; font: 700 13.5px system-ui, sans-serif; cursor: pointer;
  }
  .triggerBtn:hover { background: #4f52d6; }
</script>

<script type="text/plain" id="js">
  var card = document.getElementById('card');
  var triggerBtn = document.getElementById('triggerBtn');

  var skeletonHTML = card.innerHTML;
  var realHTML =
    '<div class="real">' +
      '<div class="realRow">' +
        '<div class="realAvatar"></div>' +
        '<div class="realNames"><h3>Priya Nair</h3><p>Product designer</p></div>' +
      '</div>' +
      '<p class="body">Shipped the new onboarding flow this week — first-run completion is already up double digits.</p>' +
    '</div>';

  var loaded = false;

  triggerBtn.addEventListener('click', function () {
    if (loaded) {
      card.innerHTML = skeletonHTML;
      triggerBtn.textContent = 'Simulate load';
      loaded = false;
      return;
    }
    triggerBtn.disabled = true;
    triggerBtn.textContent = 'Loading…';
    setTimeout(function () {
      card.innerHTML = realHTML;
      triggerBtn.textContent = 'Run again';
      triggerBtn.disabled = false;
      loaded = true;
    }, 1700);
  });
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
