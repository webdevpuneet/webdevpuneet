<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Lazy-loading images">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Lazy-loading images</h1>
    <p class="hint">Every image below starts with an empty <code>src</code>. Scroll &mdash; each one's real <code>data-src</code> only gets assigned once it is about to enter view, and the counter above updates live.</p>
    <div class="counter">Loaded <strong id="count">0</strong> / <span id="total">6</span></div>
  </header>
  <main class="stage">
    <div class="grid">
      <img class="lazy" data-src="https://picsum.photos/seed/io1/480/300" alt="Lazy photo 1">
      <img class="lazy" data-src="https://picsum.photos/seed/io2/480/300" alt="Lazy photo 2">
      <img class="lazy" data-src="https://picsum.photos/seed/io3/480/300" alt="Lazy photo 3">
      <img class="lazy" data-src="https://picsum.photos/seed/io4/480/300" alt="Lazy photo 4">
      <img class="lazy" data-src="https://picsum.photos/seed/io5/480/300" alt="Lazy photo 5">
      <img class="lazy" data-src="https://picsum.photos/seed/io6/480/300" alt="Lazy photo 6">
    </div>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { position: sticky; top: 0; z-index: 2; padding: 16px 20px 12px; text-align: center; background: #f6f7f9; border-bottom: 1px solid var(--line); }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto 10px; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .hint code { background: #eceef3; padding: 1px 5px; border-radius: 4px; }
  .counter { font: 700 12px ui-monospace, monospace; color: var(--accent); }
  .stage { max-width: 480px; margin: 0 auto; padding: 16px 20px 60px; }
  .grid { display: flex; flex-direction: column; gap: 28px; }

  .lazy {
    width: 100%;
    height: 260px;
    display: block;
    background: repeating-linear-gradient(45deg, #eceef3, #eceef3 12px, #e3e5ea 12px, #e3e5ea 24px);
    border-radius: 10px;
    opacity: 0;
    transition: opacity 0.35s ease;
  }
  .lazy.loaded { opacity: 1; }
</script>

<script type="text/plain" id="js">
  var countEl = document.getElementById('count');
  var loaded = 0;

  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (!entry.isIntersecting) return;
      var img = entry.target;
      io.unobserve(img);
      img.src = img.dataset.src;   // the actual network request starts here
      img.addEventListener('load', function () {
        img.classList.add('loaded');
        loaded++;
        countEl.textContent = loaded;
      }, { once: true });
    });
  }, {
    root: null,
    rootMargin: '200px 0px', // start loading 200px before it's actually visible
    threshold: 0
  });

  document.querySelectorAll('.lazy').forEach(function (img) { io.observe(img); });
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
