<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Fade-in on scroll">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Fade-in on scroll</h1>
    <p class="hint">Scroll down inside this preview &mdash; each card fades and slides up the moment it enters view, once, and never re-triggers.</p>
  </header>
  <main class="stage">
    <div class="spacer">Scroll ↓</div>
    <div class="reveal card">1 &mdash; Observed the instant it enters</div>
    <div class="reveal card">2 &mdash; No scroll listener running</div>
    <div class="reveal card">3 &mdash; unobserve() fires right after</div>
    <div class="reveal card">4 &mdash; Same cost whether there are 4 of these or 4,000</div>
    <div class="spacer end">End</div>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .stage { max-width: 420px; margin: 0 auto; padding: 8px 20px 60px; }

  .spacer {
    height: 140px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--sub);
    font: 700 12px system-ui, sans-serif;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .spacer.end { height: 220px; }

  .reveal {
    opacity: 0;
    transform: translateY(28px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .reveal.in { opacity: 1; transform: translateY(0); }

  .card {
    margin: 18px 0;
    padding: 20px 18px;
    background: #fff;
    border: 1.5px solid var(--line);
    border-left: 4px solid var(--accent);
    border-radius: 10px;
    font: 600 13.5px/1.5 system-ui, sans-serif;
    box-shadow: 0 6px 18px rgba(15,23,42,0.06);
  }
</script>

<script type="text/plain" id="js">
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (!entry.isIntersecting) return;
      entry.target.classList.add('in');
      io.unobserve(entry.target); // animate once, then stop watching it
    });
  }, { threshold: 0.2 });

  document.querySelectorAll('.reveal').forEach(function (el) { io.observe(el); });
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
