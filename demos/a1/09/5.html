<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Count-up stats on scroll">

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Count-up stats on scroll</h1>
    <p class="hint">Scroll down to the stat row &mdash; each number counts up from zero the instant it comes into view, once, and never restarts if you scroll past it again.</p>
  </header>
  <div class="spacer">Scroll ↓</div>
  <main class="stats">
    <div class="stat"><div class="num" data-target="2400" data-suffix="+">0</div><div class="label">Snippets shipped</div></div>
    <div class="stat"><div class="num" data-target="99.9" data-decimals="1" data-suffix="%">0</div><div class="label">Uptime</div></div>
    <div class="stat"><div class="num" data-target="18" data-suffix="ms">0</div><div class="label">Median response</div></div>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }

  .spacer {
    height: 260px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--sub);
    font: 700 12px system-ui, sans-serif;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .stats {
    max-width: 460px;
    margin: 0 auto;
    padding: 0 20px 80px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    text-align: center;
  }
  .stat {
    padding: 22px 8px;
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 12px;
  }
  .num { font: 800 26px/1 ui-monospace, monospace; color: var(--accent); }
  .label { margin-top: 8px; font: 600 11px system-ui, sans-serif; color: var(--sub); }

  @media (max-width: 420px) {
    .stats { grid-template-columns: 1fr; }
  }
</script>

<script type="text/plain" id="js">
  function animateCount(el) {
    var target = parseFloat(el.dataset.target);
    var decimals = parseInt(el.dataset.decimals || '0', 10);
    var suffix = el.dataset.suffix || '';
    var duration = 1200;
    var start = null;

    function tick(ts) {
      if (start === null) start = ts;
      var p = Math.min(1, (ts - start) / duration);
      var eased = 1 - Math.pow(1 - p, 3); // ease-out cubic
      var value = target * eased;
      el.textContent = value.toFixed(decimals) + suffix;
      if (p < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (!entry.isIntersecting) return;
      animateCount(entry.target);
      io.unobserve(entry.target); // count up once — never restart on re-entry
    });
  }, { threshold: 0.6 });

  document.querySelectorAll('.num').forEach(function (el) { io.observe(el); });
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
