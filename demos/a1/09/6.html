<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Floating button on scroll">

<script type="text/plain" id="html">
  <main class="page">
    <section class="hero" id="hero">
      <h1>Scroll down</h1>
      <p>The "Back to top" button below is hidden right now, because this hero is still on screen.</p>
    </section>
    <section class="body">
      <p>Once the hero above scrolls out of view, a floating button fades in at the bottom-right corner &mdash; no scroll listener, no manual position math on every frame.</p>
      <p>Scroll back up past the hero and it disappears again, automatically.</p>
      <div class="filler"></div>
    </section>
  </main>
  <button class="topBtn" id="topBtn" aria-label="Back to top" hidden>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
  </button>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; }
  body { background: #f6f7f9; color: var(--ink); }

  .hero {
    height: 320px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 30px;
    background: linear-gradient(135deg, #6366f1, #818cf8);
    color: #fff;
  }
  .hero h1 { margin: 0 0 8px; font-size: 22px; }
  .hero p { margin: 0; max-width: 26em; font-size: 13px; opacity: 0.9; line-height: 1.6; }

  .body { max-width: 460px; margin: 0 auto; padding: 30px 22px; }
  .body p { font-size: 13.5px; line-height: 1.7; color: var(--sub); }
  .filler { height: 420px; }

  .topBtn {
    position: fixed;
    right: 18px;
    bottom: 18px;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(99,102,241,0.4);
    opacity: 0;
    transform: translateY(10px) scale(0.9);
    transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events: none;
  }
  .topBtn.show { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
  .topBtn:hover { background: #4f52d9; }
</script>

<script type="text/plain" id="js">
  var hero = document.getElementById('hero');
  var btn = document.getElementById('topBtn');
  btn.hidden = false; // was hidden only so it never flashes visible pre-JS

  var io = new IntersectionObserver(function (entries) {
    // isIntersecting is false the moment the hero has fully scrolled away —
    // that single boolean is the entire "should the button show" condition.
    btn.classList.toggle('show', !entries[0].isIntersecting);
  }, { threshold: 0 });

  io.observe(hero);

  btn.addEventListener('click', function () {
    hero.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
