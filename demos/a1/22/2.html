<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Insecure Context or a Sandboxed Iframe Blocks the Write Silently">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>An insecure context or a sandboxed iframe blocks the write silently</h1>
    <p class="hint">Click "Copy" in the fixed column below. This demo is running inside an embedded iframe on this very blog post, and it has honestly not been granted clipboard-write permission -- watch it report that fact instead of pretending to succeed.</p>
  </header>
  <main class="stageWrap">
    <div class="cols">
      <div class="col">
        <h2 class="colTitle bad">Broken</h2>
        <button type="button" class="btn" id="badBtn">Copy "Hello!"</button>
        <p class="status" id="badStatus">Never checks isSecureContext, never inspects the rejection.</p>
      </div>
      <div class="col">
        <h2 class="colTitle good">Fixed</h2>
        <button type="button" class="btn" id="goodBtn">Copy "Hello!"</button>
        <p class="status" id="goodStatus">Reports exactly why a write did or didn't succeed.</p>
      </div>
    </div>
    <p class="ctx" id="ctxLine"></p>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; --green: #16a34a; --red: #dc2626; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 56em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px 16px 28px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%; max-width: 480px; }
  .col { background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 14px; text-align: center; }
  .colTitle { margin: 0 0 10px; font: 700 12px ui-monospace, monospace; padding: 5px 8px; border-radius: 6px; display: inline-block; }
  .colTitle.bad { color: var(--red); background: #fdeaea; }
  .colTitle.good { color: var(--green); background: #e8f7ee; }
  .btn { padding: 9px 18px; border-radius: 8px; border: 1px solid var(--line); background: #fff; color: var(--ink); font: 700 12.5px system-ui, sans-serif; cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  .status { margin: 8px 0 0; font-size: 11.5px; color: var(--sub); line-height: 1.5; min-height: 3.6em; }
  .status.ok { color: var(--green); font-weight: 700; }
  .status.err { color: var(--red); font-weight: 700; }
  .ctx { font-size: 11px; color: var(--sub); font-family: ui-monospace, monospace; text-align: center; max-width: 480px; }
</script>

<script type="text/plain" id="js">
  function setupBad() {
    var btn = document.getElementById('badBtn');
    var status = document.getElementById('badStatus');

    btn.addEventListener('click', function () {
      // BROKEN: fires and forgets. Uses an empty catch so failures vanish.
      if (navigator.clipboard) {
        navigator.clipboard.writeText('Hello!').catch(function () {});
      }
      status.className = 'status';
      status.textContent = 'Ran the call. No idea if it worked -- the catch block is empty.';
    });
  }

  function setupGood() {
    var btn = document.getElementById('goodBtn');
    var status = document.getElementById('goodStatus');

    btn.addEventListener('click', function () {
      status.className = 'status';
      status.textContent = 'Attempting...';

      if (!navigator.clipboard) {
        status.className = 'status err';
        status.textContent = 'navigator.clipboard does not exist here at all.';
        return;
      }

      if (!window.isSecureContext) {
        status.className = 'status err';
        status.textContent = 'Blocked: this page is not a secure context (needs HTTPS or localhost).';
        return;
      }

      navigator.clipboard.writeText('Hello!').then(
        function () {
          status.className = 'status ok';
          status.textContent = 'Copied. This page/frame currently has clipboard-write permission.';
        },
        function (err) {
          status.className = 'status err';
          status.textContent = 'Blocked: ' + (err && err.name ? err.name : 'rejected') +
            ' -- most likely no clipboard-write permission was delegated to this iframe ' +
            '(this blog embed does not set allow="clipboard-write"). Try "Open full screen" above to see it succeed on its own page.';
        }
      );
    });
  }

  document.getElementById('ctxLine').textContent =
    'isSecureContext: ' + window.isSecureContext + ' | in an iframe: ' + (window.top !== window.self);

  setupBad();
  setupGood();
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
