<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Plain Text Loses Formatting That ClipboardItem Preserves">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Plain text loses formatting that ClipboardItem preserves</h1>
    <p class="hint">Each column copies the same bold, colored snippet. Paste each into a rich-text field afterward (or just compare the raw payload logged below) to see what actually made it across.</p>
  </header>
  <main class="stageWrap">
    <div class="cols">
      <div class="col">
        <h2 class="colTitle bad">Broken</h2>
        <p class="preview" id="badPreview"><b style="color:#dc2626">Important:</b> ship by Friday</p>
        <button type="button" class="btn" id="badBtn">Copy</button>
        <p class="status" id="badStatus">writeText() only, markup included as literal text.</p>
      </div>
      <div class="col">
        <h2 class="colTitle good">Fixed</h2>
        <p class="preview" id="goodPreview"><b style="color:#dc2626">Important:</b> ship by Friday</p>
        <button type="button" class="btn" id="goodBtn">Copy</button>
        <p class="status" id="goodStatus">ClipboardItem with text/html + text/plain.</p>
      </div>
    </div>
    <p class="paste">Paste target:</p>
    <div class="pasteBox" id="pasteBox" contenteditable="true">Click here, then paste (Ctrl+V / Cmd+V)</div>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; --green: #16a34a; --red: #dc2626; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 56em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 16px 16px 24px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%; max-width: 480px; }
  .col { background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 14px; text-align: center; }
  .colTitle { margin: 0 0 10px; font: 700 12px ui-monospace, monospace; padding: 5px 8px; border-radius: 6px; display: inline-block; }
  .colTitle.bad { color: var(--red); background: #fdeaea; }
  .colTitle.good { color: var(--green); background: #e8f7ee; }
  .preview { font-size: 13px; padding: 10px; background: #f9fafb; border: 1px solid var(--line); border-radius: 8px; margin: 0 0 10px; }
  .btn { padding: 9px 18px; border-radius: 8px; border: 1px solid var(--line); background: #fff; color: var(--ink); font: 700 12.5px system-ui, sans-serif; cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  .status { margin: 8px 0 0; font-size: 11.5px; color: var(--sub); line-height: 1.5; min-height: 3em; }
  .status.ok { color: var(--green); font-weight: 700; }
  .status.err { color: var(--red); font-weight: 700; }
  .paste { font-size: 11.5px; color: var(--sub); margin: 4px 0 0; }
  .pasteBox { width: 100%; max-width: 340px; min-height: 40px; box-sizing: border-box; padding: 8px 10px; border-radius: 8px; border: 1px dashed var(--line); background: #fff; font-size: 12.5px; text-align: left; }
</script>

<script type="text/plain" id="js">
  var html = '<b style="color:#dc2626">Important:</b> ship by Friday';
  var plain = 'Important: ship by Friday';

  function setupBad() {
    var btn = document.getElementById('badBtn');
    var status = document.getElementById('badStatus');

    btn.addEventListener('click', function () {
      // BROKEN: writeText() only understands text/plain, so the markup
      // itself gets copied as literal visible characters, not formatting.
      function copyPlainHtmlString() {
        var ta = document.createElement('textarea');
        ta.value = html;
        ta.style.position = 'fixed';
        ta.style.top = '0';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        var ok = false;
        try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
        document.body.removeChild(ta);
        return ok;
      }
      var ok = copyPlainHtmlString();
      status.className = ok ? 'status ok' : 'status err';
      status.textContent = ok
        ? 'Copied the literal string: ' + html + ' -- paste it below and you\'ll see the tags themselves, not bold red text.'
        : 'Copy failed.';
    });
  }

  function setupGood() {
    var btn = document.getElementById('goodBtn');
    var status = document.getElementById('goodStatus');

    btn.addEventListener('click', function () {
      if (!window.ClipboardItem) {
        status.className = 'status err';
        status.textContent = 'window.ClipboardItem is not defined in this browser -- fall back to plain text only.';
        return;
      }
      if (!(navigator.clipboard && navigator.clipboard.write && window.isSecureContext)) {
        status.className = 'status err';
        status.textContent = 'navigator.clipboard.write() unavailable or insecure context -- cannot demonstrate rich copy here.';
        return;
      }
      try {
        var item = new ClipboardItem({
          'text/html': new Blob([html], { type: 'text/html' }),
          'text/plain': new Blob([plain], { type: 'text/plain' })
        });
        navigator.clipboard.write([item]).then(
          function () {
            status.className = 'status ok';
            status.textContent = 'Copied both text/html and text/plain -- paste below to see the real bold red text render.';
          },
          function (err) {
            status.className = 'status err';
            status.textContent = 'Blocked: ' + (err && err.name ? err.name : 'rejected') +
              ' -- likely no clipboard-write permission in this embedded iframe. Try "Open full screen" above.';
          }
        );
      } catch (e) {
        status.className = 'status err';
        status.textContent = 'ClipboardItem construction failed: ' + e.message;
      }
    });
  }

  setupBad();
  setupGood();
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
