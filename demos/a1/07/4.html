<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Number Ranges: min, max, step">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Number Ranges &mdash; min, max, step</h1>
    <p class="hint">Try nudging the quantity above 10 or below 1 with the spinner arrows &mdash; it won't let you. Type a value outside the range by hand and submit to see the native out-of-range error.</p>
  </header>
  <main class="stageWrap">
    <form class="rangeForm" action="#" method="get" onsubmit="return false">
      <label class="field">
        <span class="fieldLabel">Quantity (1&ndash;10)</span>
        <input type="number" name="qty" min="1" max="10" step="1" value="1">
      </label>
      <label class="field">
        <span class="fieldLabel">Discount % (0&ndash;100, steps of 5)</span>
        <input type="range" name="discount" min="0" max="100" step="5" value="20">
      </label>
      <button type="submit" class="submitBtn">Add to cart</button>
    </form>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; --ok: #16a34a; --err: #dc2626; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 48em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; justify-content: center; padding: 14px 16px 32px; }

  .rangeForm {
    width: 100%;
    max-width: 320px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 14px;
    padding: 20px;
  }
  .field { display: flex; flex-direction: column; gap: 8px; }
  .fieldLabel { font: 700 12px system-ui, sans-serif; }

  .rangeForm input[type="number"] {
    padding: 10px 12px;
    font: 600 15px system-ui, sans-serif;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    outline: none;
  }
  .rangeForm input[type="number"]:focus { border-color: var(--accent); }
  /* :in-range / :out-of-range only apply to inputs with a min and/or max,
     and only after they hold a value — no JS needed to know which side
     of the boundary the current number sits on. */
  .rangeForm input[type="number"]:in-range { border-color: var(--ok); background: #f0fdf4; }
  .rangeForm input[type="number"]:out-of-range { border-color: var(--err); background: #fef2f2; }

  .rangeForm input[type="range"] { accent-color: var(--accent); width: 100%; }

  .submitBtn {
    padding: 11px 16px;
    font: 700 13px system-ui, sans-serif;
    border: none;
    border-radius: 9px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  .submitBtn:hover { background: #4f52d9; }
</script>

<script type="text/plain" id="js">
  /* No JavaScript — min, max and step alone constrain both the spinner
     arrows and what the form will accept on submit. */
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
