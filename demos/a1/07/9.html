<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Required Radio Groups">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Required Radio Groups</h1>
    <p class="hint">Click submit without picking a plan &mdash; the browser refuses and focuses the group, even though no single radio input is individually marked invalid on its own.</p>
  </header>
  <main class="stageWrap">
    <form class="planForm" action="#" method="get" onsubmit="return false">
      <fieldset class="planSet">
        <legend>Choose a plan</legend>
        <label class="planOpt">
          <input type="radio" name="plan" value="free" required>
          <span>Free</span>
        </label>
        <label class="planOpt">
          <input type="radio" name="plan" value="pro" required>
          <span>Pro &mdash; $12/mo</span>
        </label>
        <label class="planOpt">
          <input type="radio" name="plan" value="team" required>
          <span>Team &mdash; $29/mo</span>
        </label>
      </fieldset>
      <button type="submit" class="submitBtn">Continue</button>
    </form>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 48em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; justify-content: center; padding: 20px 16px 36px; }

  .planForm {
    width: 100%;
    max-width: 320px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .planSet {
    display: flex;
    flex-direction: column;
    gap: 8px;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    background: #fff;
  }
  .planSet legend {
    font: 700 12px system-ui, sans-serif;
    padding: 0 6px;
  }
  .planOpt {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    border: 1.5px solid var(--line);
    border-radius: 9px;
    font: 500 13px system-ui, sans-serif;
    cursor: pointer;
  }
  .planOpt:has(input:checked) {
    border-color: var(--accent);
    background: #eef0ff;
  }
  .planOpt input { accent-color: var(--accent); }

  .submitBtn {
    padding: 11px 16px;
    font: 700 13px system-ui, sans-serif;
    border: none;
    border-radius: 9px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  .submitBtn:hover { background: #4f52d9; }
</script>

<script type="text/plain" id="js">
  /* No JavaScript — required on every radio in a shared name group is
     enough for the browser to demand one selection from the whole group. */
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
