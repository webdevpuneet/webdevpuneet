<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Native Input Types">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Native Input Types</h1>
    <p class="hint">Each field below is a different <code>type</code> value. The browser enforces the right format on its own &mdash; try typing "not-an-email" in the email field, or letters in the phone field, then click submit.</p>
  </header>
  <main class="stageWrap">
    <form class="typeForm" action="#" method="get" onsubmit="return false">
      <label class="field">
        <span class="fieldLabel">Email &mdash; <code>type="email"</code></span>
        <input type="email" name="email" placeholder="you@example.com">
      </label>
      <label class="field">
        <span class="fieldLabel">Website &mdash; <code>type="url"</code></span>
        <input type="url" name="site" placeholder="https://example.com">
      </label>
      <label class="field">
        <span class="fieldLabel">Phone &mdash; <code>type="tel"</code></span>
        <input type="tel" name="phone" pattern="[0-9\-\+\s]{7,}" placeholder="555-0100">
      </label>
      <label class="field">
        <span class="fieldLabel">Age &mdash; <code>type="number"</code></span>
        <input type="number" name="age" min="0" max="120" placeholder="0&ndash;120">
      </label>
      <button type="submit" class="submitBtn">Check formats</button>
    </form>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; --ok: #16a34a; --err: #dc2626; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 48em; font-size: 12.5px; color: var(--sub); }
  .hint code { background: #eceef3; padding: 1px 5px; border-radius: 4px; }
  .stageWrap { display: flex; justify-content: center; padding: 14px 16px 32px; }

  .typeForm {
    width: 100%;
    max-width: 360px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 14px;
    padding: 20px;
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .fieldLabel { font: 700 12px system-ui, sans-serif; color: var(--ink); }
  .fieldLabel code { font: 600 11px ui-monospace, monospace; color: var(--accent); background: none; padding: 0; }

  .typeForm input {
    padding: 10px 12px;
    font: 500 14px system-ui, sans-serif;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    outline: none;
  }
  .typeForm input:focus { border-color: var(--accent); }
  .typeForm input:not(:placeholder-shown):invalid { border-color: var(--err); background: #fef2f2; }
  .typeForm input:not(:placeholder-shown):valid { border-color: var(--ok); background: #f0fdf4; }

  .submitBtn {
    margin-top: 4px;
    padding: 11px 16px;
    font: 700 13px system-ui, sans-serif;
    border: none;
    border-radius: 9px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  .submitBtn:hover { background: #4f52d9; }
</script>

<script type="text/plain" id="js">
  /* No JavaScript — each input's type attribute alone tells the browser
     which format to enforce and which on-screen keyboard/picker to show. */
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
