<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Gating Submit with :has()">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Graying Out Submit with :has()</h1>
    <p class="hint">Fill in both fields correctly and watch the button light up on its own &mdash; <code>form:has(:invalid)</code> reads the whole form's validity state and styles the button from outside it, no JavaScript watching either field.</p>
  </header>
  <main class="stageWrap">
    <form class="gateForm" action="#" method="get" onsubmit="return false">
      <label class="field">
        <span class="fieldLabel">Email</span>
        <input type="email" name="email" required placeholder=" ">
      </label>
      <label class="field">
        <span class="fieldLabel">Password (min 8 chars)</span>
        <input type="password" name="password" required minlength="8" placeholder=" ">
      </label>
      <button type="submit" class="submitBtn">Sign in</button>
    </form>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; --ok: #16a34a; --err: #dc2626; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 48em; font-size: 12.5px; color: var(--sub); }
  .hint code { background: #eceef3; padding: 1px 5px; border-radius: 4px; }
  .stageWrap { display: flex; justify-content: center; padding: 20px 16px 36px; }

  .gateForm {
    width: 100%;
    max-width: 320px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 14px;
    padding: 20px;
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .fieldLabel { font: 700 12px system-ui, sans-serif; }

  .gateForm input {
    padding: 10px 12px;
    font: 500 14px system-ui, sans-serif;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    outline: none;
  }
  .gateForm input:focus { border-color: var(--accent); }
  .gateForm input:not(:placeholder-shown):invalid { border-color: var(--err); background: #fef2f2; }
  .gateForm input:not(:placeholder-shown):valid { border-color: var(--ok); background: #f0fdf4; }

  .submitBtn {
    padding: 11px 16px;
    font: 700 13px system-ui, sans-serif;
    border: none;
    border-radius: 9px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    transition: opacity .15s, background .15s;
  }
  .submitBtn:hover { background: #4f52d9; }

  /* The form itself, not the button, is what :has() queries here — as
     long as any descendant input is currently :invalid, the button
     dims. Clicking it while dimmed still works, and still triggers the
     browser's own native validation bubbles on whichever field failed;
     this only supplies the visual cue, not the actual blocking logic. */
  .gateForm:has(input:invalid) .submitBtn {
    opacity: .45;
  }
</script>

<script type="text/plain" id="js">
  /* No JavaScript — form:has(input:invalid) alone drives the button's
     dimmed state, live, as either field's validity changes. */
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
