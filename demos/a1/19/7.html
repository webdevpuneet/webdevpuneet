<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Scroll progress bar">

<script type="text/plain" id="cdn">
https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js
https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js
</script>

<script type="text/plain" id="html">
  <div class="progressTrack"><div class="progressBar" id="progressBar"></div></div>
  <header class="bar">
    <h1>Scroll progress bar</h1>
    <p class="hint">Scroll down. The bar fills in exact proportion to how far through the whole preview you've scrolled &mdash; a classic reading-progress indicator.</p>
  </header>
  <div class="spacer">Section 1</div>
  <div class="spacer">Section 2</div>
  <div class="spacer">Section 3</div>
  <div class="spacer end">End of page</div>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #e11d48; }
  body { background: #f6f7f9; color: var(--ink); }
  .progressTrack { position: fixed; top: 0; left: 0; right: 0; height: 4px; background: var(--line); z-index: 10; }
  .progressBar { height: 100%; width: 0%; background: var(--accent); }
  .bar { padding: 22px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .spacer { height: 220px; display: flex; align-items: center; justify-content: center; color: var(--sub); font: 700 12px system-ui, sans-serif; text-transform: uppercase; letter-spacing: 0.05em; border-top: 1px dashed var(--line); }
  .spacer.end { height: 240px; }
</script>

<script type="text/plain" id="js">
  gsap.registerPlugin(ScrollTrigger);

  var progressBar = document.getElementById('progressBar');

  ScrollTrigger.create({
    trigger: document.body,
    start: 'top top',
    end: 'bottom bottom',
    onUpdate: function (self) {
      progressBar.style.width = (self.progress * 100) + '%';
    }
  });
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
