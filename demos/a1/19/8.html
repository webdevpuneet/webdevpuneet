<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Staggered card reveal">

<script type="text/plain" id="cdn">
https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js
https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Staggered card reveal</h1>
    <p class="hint">Scroll down. One <code>scrollTrigger</code> on the whole grid, one <code>stagger</code> value &mdash; six cards, six offset start times.</p>
  </header>
  <div class="spacer">Scroll ↓</div>
  <div class="cardGrid">
    <div class="card">1</div>
    <div class="card">2</div>
    <div class="card">3</div>
    <div class="card">4</div>
    <div class="card">5</div>
    <div class="card">6</div>
  </div>
  <div class="spacer end"></div>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #16a34a; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .hint code { background: #eceef3; padding: 1px 5px; border-radius: 4px; }
  .spacer { height: 220px; display: flex; align-items: center; justify-content: center; color: var(--sub); font: 700 12px system-ui, sans-serif; text-transform: uppercase; letter-spacing: 0.05em; }
  .spacer.end { height: 260px; }
  .cardGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 360px; margin: 0 auto; }
  .card {
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--accent);
    color: #fff;
    font: 800 20px system-ui, sans-serif;
    border-radius: 12px;
    box-shadow: 0 10px 24px rgba(22,163,74,0.3);
  }
</script>

<script type="text/plain" id="js">
  gsap.registerPlugin(ScrollTrigger);

  gsap.from('.card', {
    opacity: 0,
    y: 40,
    scale: 0.85,
    duration: 0.5,
    stagger: 0.12,
    ease: 'back.out(1.6)',
    scrollTrigger: {
      trigger: '.cardGrid',
      start: 'top 85%'
    }
  });
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
