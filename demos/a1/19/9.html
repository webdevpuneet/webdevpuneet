<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="ScrollTrigger.refresh()">

<script type="text/plain" id="cdn">
https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js
https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>ScrollTrigger.refresh()</h1>
    <p class="hint">1. Click "Insert block above". 2. Scroll down: the trigger fires too early. 3. Scroll up, click "ScrollTrigger.refresh()" and scroll again: now it fires on time.</p>
  </header>
  <div class="controls">
    <button id="expandBtn">Insert block above (240px)</button>
    <button id="refreshBtn">ScrollTrigger.refresh()</button>
  </div>
  <p class="readout" id="readout">saved start: — px</p>
  <div class="spacer fold">Scroll ↓</div>
  <div id="insertZone"></div>
  <div class="target" id="target">TARGET<small id="status">waiting…</small></div>
  <div class="spacer end"></div>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #b45309; --ok: #16a34a; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .controls { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; padding: 0 16px 6px; }
  .controls button {
    padding: 8px 12px;
    font: 700 11.5px system-ui, sans-serif;
    border: 1.5px solid var(--line);
    background: #fff;
    color: var(--ink);
    border-radius: 8px;
    cursor: pointer;
  }
  .controls button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .controls button:disabled { opacity: 0.45; cursor: default; }
  .readout { text-align: center; font: 700 11.5px ui-monospace, monospace; color: var(--sub); margin: 4px 16px 0; transition: color 0.2s, background 0.2s; padding: 4px; }
  .readout.stale { color: #b91c1c; background: #fee2e2; border-radius: 6px; }
  /* The target starts below the fold at any preview height, so its trigger start is a real scroll position */
  .spacer { height: 180px; display: flex; align-items: center; justify-content: center; color: var(--sub); font: 700 12px system-ui, sans-serif; text-transform: uppercase; letter-spacing: 0.05em; }
  .spacer.fold { height: 110vh; align-items: flex-start; padding-top: 24px; box-sizing: border-box; }
  .spacer.end { height: 120vh; }
  .insertedBlock { height: 240px; margin: 0 20px; display: flex; align-items: center; justify-content: center; background: #fee2e2; color: #b91c1c; font: 700 12px system-ui, sans-serif; border-radius: 10px; border: 1.5px dashed #f87171; }
  .target {
    max-width: 260px;
    margin: 0 auto;
    padding: 28px;
    text-align: center;
    background: var(--accent);
    color: #fff;
    font: 800 14px system-ui, sans-serif;
    border-radius: 14px;
    box-shadow: 0 14px 34px rgba(180,83,9,0.3);
    transition: background 0.25s;
  }
  .target small { display: block; margin-top: 6px; font: 600 11px system-ui, sans-serif; opacity: 0.9; }
  .target.hit { background: var(--ok); }
</script>

<script type="text/plain" id="js">
  gsap.registerPlugin(ScrollTrigger);

  var readout = document.getElementById('readout');
  var expandBtn = document.getElementById('expandBtn');
  var refreshBtn = document.getElementById('refreshBtn');
  var insertZone = document.getElementById('insertZone');
  var target = document.getElementById('target');
  var statusEl = document.getElementById('status');

  // markers: true draws the trigger's start / end lines on the page, at the positions
  // ScrollTrigger has SAVED. The target turns green while the trigger is active.
  var st = ScrollTrigger.create({
    trigger: '#target',
    start: 'top 80%',
    markers: true,
    onToggle: function (self) {
      target.classList.toggle('hit', self.isActive);
      statusEl.textContent = self.isActive ? 'trigger fired' : 'waiting…';
    }
  });

  // Where "top 80%" really is right now: the scroll position that puts the target's top at 80% of the viewport
  function realStart() {
    return Math.round(target.getBoundingClientRect().top + window.scrollY - 0.8 * window.innerHeight);
  }
  function updateReadout() {
    var saved = Math.round(st.start), real = realStart();
    var stale = Math.abs(saved - real) > 1;
    readout.textContent = 'saved start: ' + saved + 'px  ·  real start: ' + real + 'px' + (stale ? '  ·  STALE (' + (real - saved) + 'px early)' : '  ·  in sync');
    readout.classList.toggle('stale', stale);
  }
  updateReadout();

  expandBtn.addEventListener('click', function () {
    var block = document.createElement('div');
    block.className = 'insertedBlock';
    block.textContent = 'inserted 240px block';
    insertZone.appendChild(block);
    updateReadout();           // the page grew, but st.start did not
    expandBtn.disabled = true;
  });

  refreshBtn.addEventListener('click', function () {
    ScrollTrigger.refresh();   // re-measures every trigger against the current layout
    updateReadout();
  });
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
