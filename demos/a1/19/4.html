<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="toggleActions">

<script type="text/plain" id="cdn">
https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js
https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>toggleActions</h1>
    <p class="hint">Scroll the box past both edges of the preview, then scroll back up through it. Watch the log &mdash; play, pause, resume, reverse.</p>
  </header>
  <div class="log" id="log"></div>
  <div class="spacer">Scroll ↓</div>
  <div class="box" id="box">watching</div>
  <div class="spacer end"></div>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #db2777; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .log { position: fixed; top: 8px; left: 10px; right: 10px; z-index: 6; display: flex; gap: 6px; flex-wrap: wrap; pointer-events: none; }
  .log span { font: 700 10px ui-monospace, monospace; background: #14161c; color: #fbcfe8; padding: 3px 7px; border-radius: 5px; opacity: 0.9; }
  .spacer { height: 220px; display: flex; align-items: center; justify-content: center; color: var(--sub); font: 700 12px system-ui, sans-serif; text-transform: uppercase; letter-spacing: 0.05em; }
  .spacer.end { height: 260px; }
  .box {
    max-width: 280px;
    margin: 0 auto;
    padding: 30px;
    text-align: center;
    background: var(--accent);
    color: #fff;
    font: 800 14px system-ui, sans-serif;
    border-radius: 14px;
    box-shadow: 0 14px 34px rgba(219,39,119,0.3);
  }
</script>

<script type="text/plain" id="js">
  gsap.registerPlugin(ScrollTrigger);

  var log = document.getElementById('log');
  function note(text) {
    var span = document.createElement('span');
    span.textContent = text;
    log.appendChild(span);
    if (log.children.length > 4) log.removeChild(log.firstChild);
  }

  gsap.to('.box', {
    backgroundColor: '#7c3aed',
    scale: 1.15,
    duration: 0.6,
    scrollTrigger: {
      trigger: '.box',
      start: 'top 80%',
      end: 'bottom 20%',
      toggleActions: 'play pause resume reverse',
      onEnter: function () { note('onEnter → play'); },
      onLeave: function () { note('onLeave → pause'); },
      onEnterBack: function () { note('onEnterBack → resume'); },
      onLeaveBack: function () { note('onLeaveBack → reverse'); }
    }
  });
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
