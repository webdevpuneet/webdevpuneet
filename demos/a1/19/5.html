<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="pin: true">

<script type="text/plain" id="cdn">
https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js
https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>pin: true</h1>
    <p class="hint">Scroll down. The card locks in place and stays on screen while you keep scrolling past it &mdash; it only releases once the pinned distance is used up.</p>
  </header>
  <div class="spacer">Scroll ↓</div>
  <div class="pinSection">
    <div class="card">
      <div class="cardTitle">Pinned section</div>
      <div class="fill"><div class="fillBar" id="fillBar"></div></div>
      <div class="pct" id="pct">0%</div>
    </div>
  </div>
  <div class="spacer end">Released — keep scrolling</div>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #0891b2; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .spacer { height: 220px; display: flex; align-items: center; justify-content: center; color: var(--sub); font: 700 12px system-ui, sans-serif; text-transform: uppercase; letter-spacing: 0.05em; }
  .spacer.end { height: 280px; }
  .pinSection { display: flex; align-items: center; justify-content: center; height: 200px; }
  .card {
    width: 260px;
    padding: 22px;
    text-align: center;
    background: var(--accent);
    color: #fff;
    border-radius: 14px;
    box-shadow: 0 14px 34px rgba(8,145,178,0.35);
  }
  .cardTitle { font: 800 14px system-ui, sans-serif; margin-bottom: 12px; }
  .fill { height: 8px; background: rgba(255,255,255,0.25); border-radius: 5px; overflow: hidden; }
  .fillBar { height: 100%; width: 0%; background: #fff; }
  .pct { margin-top: 8px; font: 700 12px ui-monospace, monospace; }
</script>

<script type="text/plain" id="js">
  gsap.registerPlugin(ScrollTrigger);

  var fillBar = document.getElementById('fillBar');
  var pct = document.getElementById('pct');

  ScrollTrigger.create({
    trigger: '.pinSection',
    start: 'top top',
    end: '+=300',
    pin: true,
    scrub: true,
    onUpdate: function (self) {
      var p = Math.round(self.progress * 100);
      fillBar.style.width = p + '%';
      pct.textContent = p + '%';
    }
  });
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
