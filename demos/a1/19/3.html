<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="scrub: true">

<script type="text/plain" id="cdn">
https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js
https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>scrub: true</h1>
    <p class="hint">Scroll slowly, then scroll back up. The dot's position is tied directly to your scroll position &mdash; not a one-time playback.</p>
  </header>
  <div class="spacer">Scroll ↓</div>
  <div class="track">
    <div class="dot" id="dot"></div>
  </div>
  <div class="readout" id="readout">progress: 0.00</div>
  <div class="spacer end"></div>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #d97706; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .spacer { height: 220px; display: flex; align-items: center; justify-content: center; color: var(--sub); font: 700 12px system-ui, sans-serif; text-transform: uppercase; letter-spacing: 0.05em; }
  .spacer.end { height: 240px; }
  .track { position: relative; max-width: 320px; margin: 0 auto; height: 10px; background: var(--line); border-radius: 6px; }
  .dot { position: absolute; top: 50%; left: 0; width: 26px; height: 26px; margin-top: -13px; border-radius: 50%; background: var(--accent); box-shadow: 0 8px 18px rgba(217,119,6,0.4); }
  .readout { text-align: center; margin-top: 14px; font: 700 12px ui-monospace, monospace; color: var(--accent); }
</script>

<script type="text/plain" id="js">
  gsap.registerPlugin(ScrollTrigger);

  var readout = document.getElementById('readout');
  var trackWidth = document.querySelector('.track').clientWidth - 26;

  gsap.to('#dot', {
    x: trackWidth,
    ease: 'none',
    scrollTrigger: {
      trigger: '.track',
      start: 'top 80%',
      end: 'bottom 30%',
      scrub: true,
      onUpdate: function (self) {
        readout.textContent = 'progress: ' + self.progress.toFixed(2);
      }
    }
  });
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
