<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="ScrollTrigger — a first taste">

<script type="text/plain" id="cdn">
https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js
https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>ScrollTrigger — a first taste</h1>
    <p class="hint">Scroll down inside this preview. Same <code>gsap.from()</code> you already know — just handed a <code>scrollTrigger</code> option instead of firing on click.</p>
  </header>
  <div class="spacer">Scroll ↓</div>
  <div class="reveal card">No click. No hover. Just scroll.</div>
  <div class="spacer end"></div>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #16a34a; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .hint code { background: #eceef3; padding: 1px 5px; border-radius: 4px; }
  .spacer { height: 220px; display: flex; align-items: center; justify-content: center; color: var(--sub); font: 700 12px system-ui, sans-serif; text-transform: uppercase; letter-spacing: 0.05em; }
  .spacer.end { height: 260px; }
  .card {
    max-width: 320px;
    margin: 0 auto;
    padding: 24px;
    text-align: center;
    background: var(--accent);
    color: #fff;
    font: 700 15px system-ui, sans-serif;
    border-radius: 14px;
    box-shadow: 0 14px 34px rgba(22,163,74,0.3);
  }
</script>

<script type="text/plain" id="js">
  gsap.registerPlugin(ScrollTrigger);

  gsap.from('.reveal', {
    opacity: 0,
    y: 50,
    duration: 0.8,
    ease: 'power2.out',
    scrollTrigger: {
      trigger: '.reveal',
      start: 'top 80%'
    }
  });
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
