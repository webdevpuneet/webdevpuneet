<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Remembering the Previous Value">

<script type="text/plain" id="cdn">
https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js
https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>usePrevious, built from a ref</h1>
    <p class="hint">Drag the slider. The "previous" value is always one render behind — a ref updated inside an effect, after the render it's shown in.</p>
  </header>
  <main class="stageWrap">
    <div id="root"></div>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 20px 16px 30px; }
  .slider { width: 240px; accent-color: var(--accent); }
  .pair { display: flex; gap: 14px; }
  .box { width: 150px; padding: 16px; background: #fff; border: 1.5px dashed var(--line); border-radius: 12px; text-align: center; }
  .box h3 { margin: 0 0 8px; font-size: 12px; color: var(--sub); text-transform: uppercase; letter-spacing: .04em; }
  .box .val { font: 800 28px ui-monospace, monospace; color: var(--accent); }
</script>

<script type="text/plain" id="js">
  var e = React.createElement;
  var useState = React.useState;
  var useRef = React.useRef;
  var useEffect = React.useEffect;

  function usePrevious(value) {
    var ref = useRef();
    useEffect(function () {
      ref.current = value;
    });
    return ref.current;
  }

  function PreviousDemo() {
    var s = useState(50), value = s[0], setValue = s[1];
    var previous = usePrevious(value);

    return e('div', { className: 'stageWrap', style: { padding: 0 } },
      e('input', {
        type: 'range', min: 0, max: 100, value: value, className: 'slider',
        onChange: function (ev) { setValue(Number(ev.target.value)); }
      }),
      e('div', { className: 'pair' },
        e('div', { className: 'box' },
          e('h3', null, 'Current'),
          e('div', { className: 'val' }, value)
        ),
        e('div', { className: 'box' },
          e('h3', null, 'Previous'),
          e('div', { className: 'val' }, previous === undefined ? '—' : previous)
        )
      )
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(e(PreviousDemo));
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
