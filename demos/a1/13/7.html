<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Click-Outside Detection with a Ref">

<script type="text/plain" id="cdn">
https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js
https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Close a menu on outside click</h1>
    <p class="hint">Open the menu, then click anywhere outside it. A ref on the menu's own DOM node is how the outside-click check knows what "outside" even means.</p>
  </header>
  <main class="stageWrap">
    <div id="root"></div>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 48em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; justify-content: center; padding: 40px 16px 90px; }
  .menuWrap { position: relative; display: inline-block; }
  .menuBtn { padding: 10px 16px; font: 700 13px system-ui, sans-serif; color: #fff; background: var(--accent); border: none; border-radius: 8px; cursor: pointer; }
  .menu { position: absolute; top: calc(100% + 8px); left: 0; width: 170px; background: #fff; border: 1.5px solid var(--line); border-radius: 10px; box-shadow: 0 10px 24px rgba(20,22,28,.12); overflow: hidden; }
  .menuItem { padding: 10px 14px; font-size: 13px; cursor: pointer; }
  .menuItem:hover { background: #f1f1f5; }
</script>

<script type="text/plain" id="js">
  var e = React.createElement;
  var useState = React.useState;
  var useRef = React.useRef;
  var useEffect = React.useEffect;

  function OutsideClickMenu() {
    var openState = useState(false), open = openState[0], setOpen = openState[1];
    var menuRef = useRef(null);

    useEffect(function () {
      if (!open) return;
      function handlePointerDown(ev) {
        if (menuRef.current && !menuRef.current.contains(ev.target)) {
          setOpen(false);
        }
      }
      document.addEventListener('pointerdown', handlePointerDown);
      return function () { document.removeEventListener('pointerdown', handlePointerDown); };
    }, [open]);

    return e('div', { className: 'menuWrap', ref: menuRef },
      e('button', { className: 'menuBtn', onClick: function () { setOpen(!open); } }, open ? 'Menu open ▾' : 'Open menu ▾'),
      open && e('div', { className: 'menu' },
        e('div', { className: 'menuItem' }, 'Profile'),
        e('div', { className: 'menuItem' }, 'Settings'),
        e('div', { className: 'menuItem' }, 'Sign out')
      )
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(e(OutsideClickMenu));
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
