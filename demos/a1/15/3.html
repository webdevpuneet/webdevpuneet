<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="event.target vs event.currentTarget">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>event.target vs event.currentTarget</h1>
    <p class="hint">The listener is attached to the outer toolbar. Click the icon, the label, or the padding of any button and watch which element each one reports.</p>
  </header>
  <main class="stageWrap">
    <div class="toolbar" id="toolbar">
      <button class="btn"><span class="icon">&#9998;</span><span class="label">Edit</span></button>
      <button class="btn"><span class="icon">&#128203;</span><span class="label">Copy</span></button>
      <button class="btn"><span class="icon">&#128465;</span><span class="label">Delete</span></button>
    </div>
    <div class="readout">
      <p><strong>event.target</strong> — the exact element clicked: <code id="targetOut">—</code></p>
      <p><strong>event.currentTarget</strong> — the element the listener is attached to: <code id="currentOut">—</code></p>
    </div>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink:#14161c; --sub:#6b7080; --line:#e3e5ea; --accent:#6366f1; }
  body { background:#f6f7f9; color:var(--ink); }
  .bar { padding:18px 20px 8px; text-align:center; }
  .bar h1 { margin:0 0 4px; font-size:18px; letter-spacing:-0.01em; }
  .hint { margin:0 auto; max-width:52em; font-size:12.5px; color:var(--sub); }
  .stageWrap { display:flex; flex-direction:column; align-items:center; gap:16px; padding:16px 18px 28px; }

  .toolbar {
    display:flex; gap:10px; background:#e9ebf3; border-radius:12px; padding:14px;
    border:2px dashed #c3c7dc;
  }
  .btn {
    display:flex; align-items:center; gap:7px; padding:10px 16px;
    background:#fff; border:1px solid var(--line); border-radius:9px; cursor:pointer;
    font:600 13px system-ui, sans-serif; color:var(--ink);
  }
  .btn:hover { border-color:var(--accent); }
  .icon { font-size:15px; }

  .readout {
    background:#fff; border:1px solid var(--line); border-radius:10px;
    padding:12px 16px; width:100%; max-width:480px;
  }
  .readout p { margin:6px 0; font-size:12.5px; }
  .readout code {
    background:#f1f2f7; padding:2px 7px; border-radius:5px; color:var(--accent); font-weight:700;
  }
</script>

<script type="text/plain" id="js">
  var toolbar = document.getElementById('toolbar');
  var targetOut = document.getElementById('targetOut');
  var currentOut = document.getElementById('currentOut');

  function describe(el) {
    if (el.classList.contains('icon')) return '<span class="icon"> (the icon glyph)';
    if (el.classList.contains('label')) return '<span class="label"> (the text label)';
    if (el.classList.contains('btn')) return '<button class="btn"> itself';
    return el.tagName.toLowerCase();
  }

  // The listener lives on .toolbar. No matter which descendant is clicked,
  // currentTarget is always .toolbar — target is whatever was actually clicked.
  toolbar.addEventListener('click', function (e) {
    targetOut.textContent = describe(e.target);
    currentOut.textContent = '<div class="toolbar"> (where the listener lives)';
  });
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
