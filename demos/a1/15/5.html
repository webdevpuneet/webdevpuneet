<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Delegated Table Row Actions with data-action">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Routing multiple actions through one listener with data-action</h1>
    <p class="hint">Edit, duplicate and delete are three different behaviors on rows that get added at runtime. One click listener on the table body reads each button's <code>data-action</code> and routes accordingly.</p>
  </header>
  <main class="stageWrap">
    <button type="button" class="addBtn" id="addBtn">Add a row</button>
    <table class="tbl">
      <thead><tr><th>Task</th><th>Actions</th></tr></thead>
      <tbody id="tbody">
        <tr><td>Draft proposal</td><td class="acts">
          <button data-action="edit">Edit</button>
          <button data-action="duplicate">Duplicate</button>
          <button data-action="delete">Delete</button>
        </td></tr>
        <tr><td>Review pull request</td><td class="acts">
          <button data-action="edit">Edit</button>
          <button data-action="duplicate">Duplicate</button>
          <button data-action="delete">Delete</button>
        </td></tr>
      </tbody>
    </table>
    <p class="note" id="note">Try Duplicate, then Edit or Delete on the row you just created.</p>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink:#14161c; --sub:#6b7080; --line:#e3e5ea; --accent:#6366f1; }
  body { background:#f6f7f9; color:var(--ink); }
  .bar { padding:18px 20px 8px; text-align:center; }
  .bar h1 { margin:0 0 4px; font-size:17px; letter-spacing:-0.01em; }
  .hint { margin:0 auto; max-width:56em; font-size:12.5px; color:var(--sub); }
  .hint code { background:#eef0f5; padding:1px 5px; border-radius:4px; }
  .stageWrap { display:flex; flex-direction:column; align-items:center; gap:12px; padding:16px 18px 28px; width:100%; }

  .addBtn {
    font:700 12.5px system-ui, sans-serif; padding:8px 16px;
    border:1px solid var(--line); border-radius:7px; background:var(--accent); color:#fff; cursor:pointer;
  }

  .tbl { width:100%; max-width:480px; border-collapse:collapse; background:#fff; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .tbl th, .tbl td { text-align:left; padding:9px 12px; font-size:12.5px; border-bottom:1px solid var(--line); }
  .tbl th { background:#f6f7fb; font-size:11px; text-transform:uppercase; color:var(--sub); }
  .acts button {
    border:1px solid var(--line); background:#fff; border-radius:6px; padding:4px 8px;
    font-size:11px; cursor:pointer; margin-right:4px;
  }
  .acts button:hover { border-color:var(--accent); color:var(--accent); }
  tr.editing td:first-child { background:#eef0ff; font-style:italic; }
  .note { margin:0; font-size:12px; color:var(--sub); text-align:center; max-width:42em; }
</script>

<script type="text/plain" id="js">
  var tbody = document.getElementById('tbody');
  var note = document.getElementById('note');
  var addBtn = document.getElementById('addBtn');
  var counter = 3;

  function rowHTML(label) {
    return '<td>' + label + '</td><td class="acts">' +
      '<button data-action="edit">Edit</button>' +
      '<button data-action="duplicate">Duplicate</button>' +
      '<button data-action="delete">Delete</button></td>';
  }

  // One listener, one switch on data-action. New rows never need new bindings
  // and adding a fourth action later means adding one more "case", not
  // rewiring anything.
  tbody.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-action]');
    if (!btn) return;
    var row = btn.closest('tr');
    var action = btn.dataset.action;

    if (action === 'delete') {
      row.remove();
      note.textContent = 'Deleted a row that may not have existed when the listener was attached.';
    } else if (action === 'duplicate') {
      var clone = row.cloneNode(true);
      row.after(clone);
      note.textContent = 'Duplicated — the clone works immediately, no new listener attached to it.';
    } else if (action === 'edit') {
      row.classList.toggle('editing');
      note.textContent = row.classList.contains('editing') ? 'Editing mode on for this row.' : 'Editing mode off.';
    }
  });

  addBtn.addEventListener('click', function () {
    counter++;
    var tr = document.createElement('tr');
    tr.innerHTML = rowHTML('New task #' + counter);
    tbody.appendChild(tr);
    note.textContent = 'Row added — its Edit/Duplicate/Delete buttons already work.';
  });
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
