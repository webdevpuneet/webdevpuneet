<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Debounced Autosave">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Debounced Autosave</h1>
    <p class="hint">Type in the box below. The status goes to "Typing…" instantly on every keystroke, but the note is only "Saved" once you pause for 800ms — nothing saves on every keystroke.</p>
  </header>
  <main class="stageWrap">
    <textarea id="noteArea" class="noteArea" rows="4" placeholder="Start typing your note…"></textarea>
    <div class="statusRow">
      <span class="statusDot" id="statusDot"></span>
      <span class="statusText" id="statusText">Untouched</span>
    </div>
    <div class="statsRow">
      <div class="statBox"><span class="statLabel">Keystrokes</span><span class="statValue" id="keyCount">0</span></div>
      <div class="statBox"><span class="statLabel">Saves fired</span><span class="statValue" id="saveCount">0</span></div>
    </div>
  </main>
</script>

<script type="text/plain" id="css">
  :root {
    --ink: #14161c;
    --sub: #6b7080;
    --line: #e3e5ea;
    --accent: #6366f1;
  }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 14px 16px 26px; }

  .noteArea {
    width: 100%;
    max-width: 380px;
    padding: 10px 12px;
    font: 500 13px system-ui, sans-serif;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    outline: none;
    resize: vertical;
  }
  .noteArea:focus { border-color: var(--accent); }

  .statusRow { display: flex; align-items: center; gap: 8px; font: 700 12px system-ui, sans-serif; color: var(--sub); }
  .statusDot { width: 9px; height: 9px; border-radius: 50%; background: #c7cad4; transition: background .15s; flex-shrink: 0; }
  .statusDot.typing { background: #f59e0b; }
  .statusDot.saving { background: var(--accent); }
  .statusDot.saved { background: #22c55e; }

  .statsRow { display: flex; gap: 10px; }
  .statBox {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    min-width: 110px;
    padding: 10px 14px;
    border: 1.5px dashed var(--line);
    border-radius: 10px;
    background: #fff;
  }
  .statLabel { font-size: 10.5px; color: var(--sub); text-transform: uppercase; letter-spacing: .04em; }
  .statValue { font: 800 22px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--accent); }
</script>

<script type="text/plain" id="js">
  var textarea = document.getElementById('noteArea');
  var statusDot = document.getElementById('statusDot');
  var statusText = document.getElementById('statusText');
  var keyCountEl = document.getElementById('keyCount');
  var saveCountEl = document.getElementById('saveCount');

  var DELAY = 800;
  var keyCount = 0;
  var saveCount = 0;

  function debounce(fn, delay) {
    var timer;
    return function () {
      var args = arguments;
      clearTimeout(timer);
      timer = setTimeout(function () { fn.apply(null, args); }, delay);
    };
  }

  function doSave() {
    statusDot.className = 'statusDot saving';
    statusText.textContent = 'Saving…';
    setTimeout(function () {
      saveCount++;
      saveCountEl.textContent = saveCount;
      statusDot.className = 'statusDot saved';
      statusText.textContent = 'Saved';
    }, 350);
  }

  var debouncedSave = debounce(doSave, DELAY);

  textarea.addEventListener('input', function () {
    keyCount++;
    keyCountEl.textContent = keyCount;
    statusDot.className = 'statusDot typing';
    statusText.textContent = 'Typing…';
    debouncedSave();
  });
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
