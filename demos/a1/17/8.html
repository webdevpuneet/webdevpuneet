<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Shared State Makes Two Dropdowns Fight Each Other">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Sharing one closure's variables makes two dropdowns fight each other</h1>
    <p class="hint">Each column has two independent dropdowns (A and B) built from the same setup function. Open A, then open B without closing A. Watch whether A stays open on its own.</p>
  </header>
  <main class="stageWrap">
    <div class="cols">
      <div class="col">
        <h2 class="colTitle bad">Broken</h2>
        <div class="pair">
          <div class="menuWrap"><button type="button" class="trigger" data-bad="A">Menu A &#9662;</button><div class="menu" data-menu-bad="A"><p class="menuItem">A's content</p></div></div>
          <div class="menuWrap"><button type="button" class="trigger" data-bad="B">Menu B &#9662;</button><div class="menu" data-menu-bad="B"><p class="menuItem">B's content</p></div></div>
        </div>
        <p class="note" id="badNote">Both share one outer-scope reference to "the current menu."</p>
      </div>
      <div class="col">
        <h2 class="colTitle good">Fixed</h2>
        <div class="pair">
          <div class="menuWrap"><button type="button" class="trigger" data-good="A">Menu A &#9662;</button><div class="menu" data-menu-good="A"><p class="menuItem">A's content</p></div></div>
          <div class="menuWrap"><button type="button" class="trigger" data-good="B">Menu B &#9662;</button><div class="menu" data-menu-good="B"><p class="menuItem">B's content</p></div></div>
        </div>
        <p class="note" id="goodNote">Each instance keeps its own closure-scoped trigger/menu references.</p>
      </div>
    </div>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; --green: #16a34a; --red: #dc2626; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 58em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px 16px 28px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%; max-width: 520px; }
  .col { background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 14px; text-align: center; }
  .colTitle { margin: 0 0 10px; font: 700 12px ui-monospace, monospace; padding: 5px 8px; border-radius: 6px; display: inline-block; }
  .colTitle.bad { color: var(--red); background: #fdeaea; }
  .colTitle.good { color: var(--green); background: #e8f7ee; }
  .pair { display: flex; justify-content: center; gap: 14px; margin-bottom: 8px; }
  .menuWrap { position: relative; display: inline-block; }
  .trigger { padding: 9px 14px; border-radius: 8px; border: 1px solid var(--line); background: #fff; color: var(--ink); font: 700 12px system-ui, sans-serif; cursor: pointer; }
  .trigger:hover { border-color: var(--accent); }
  .menu { position: absolute; top: calc(100% + 6px); left: 50%; transform: translateX(-50%); display: none; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; box-shadow: 0 6px 20px rgba(0,0,0,.08); min-width: 110px; z-index: 5; }
  .menu.open { display: block; }
  .menuItem { margin: 0; font-size: 12px; }
  .note { margin: 6px 0 0; font-size: 11.5px; color: var(--sub); line-height: 1.5; min-height: 3.2em; }
</script>

<script type="text/plain" id="js">
  // BROKEN: copy-pasted setup, but the trigger/menu currently "in charge"
  // are stored in variables OUTSIDE any per-instance closure. Initializing
  // dropdown B overwrites the very variables dropdown A's own document
  // listener depends on, so A ends up checking B's element bounds instead
  // of its own.
  var sharedActiveTrigger = null;
  var sharedActiveMenu = null;

  function setupBadInstance(letter) {
    var trigger = document.querySelector('[data-bad="' + letter + '"]');
    var menu = document.querySelector('[data-menu-bad="' + letter + '"]');

    trigger.addEventListener('click', function (e) {
      e.stopPropagation();
      sharedActiveTrigger = trigger;
      sharedActiveMenu = menu;
      menu.classList.add('open');
    });
  }

  document.addEventListener('click', function (e) {
    // This single shared handler only ever knows about the LAST dropdown
    // that was opened -- it has no way to tell which menu the click
    // should actually be evaluated against.
    if (sharedActiveMenu && !sharedActiveMenu.contains(e.target) && !sharedActiveTrigger.contains(e.target)) {
      document.querySelectorAll('[data-menu-bad]').forEach(function (m) { m.classList.remove('open'); });
      document.getElementById('badNote').textContent = 'Closed using B\'s bounds even for a click meant to test A -- open A then B to see A get abandoned.';
    }
  });

  setupBadInstance('A');
  setupBadInstance('B');

  // FIXED: each call to setupGoodInstance creates its own function-scoped
  // trigger/menu variables AND its own document listener closure. Neither
  // instance can see or overwrite the other's state.
  function setupGoodInstance(letter) {
    var trigger = document.querySelector('[data-good="' + letter + '"]');
    var menu = document.querySelector('[data-menu-good="' + letter + '"]');

    trigger.addEventListener('click', function (e) {
      e.stopPropagation();
      menu.classList.toggle('open');
    });

    document.addEventListener('click', function (e) {
      if (menu.classList.contains('open') && !menu.contains(e.target) && !trigger.contains(e.target)) {
        menu.classList.remove('open');
        document.getElementById('goodNote').textContent = 'Menu ' + letter + ' closed independently -- opening the other one never touched its state.';
      }
    });
  }

  setupGoodInstance('A');
  setupGoodInstance('B');
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
