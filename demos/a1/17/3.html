<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="stopPropagation on the Trigger Breaks Other Click Listeners">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>stopPropagation() on the trigger silently breaks other click listeners</h1>
    <p class="hint">Each panel has an unrelated "page clicks" counter listening on document, plus a dropdown trigger. Click each trigger 3 times and watch whether the page counter notices.</p>
  </header>
  <main class="stageWrap">
    <div class="cols">
      <div class="col">
        <h2 class="colTitle bad">Broken</h2>
        <p class="pageCount">Page clicks seen: <span id="badPage">0</span></p>
        <div class="menuWrap">
          <button type="button" class="trigger" id="badTrigger">Menu &#9662;</button>
          <div class="menu" id="badMenu"><p class="menuItem">Menu content</p></div>
        </div>
        <p class="note" id="badNote">Trigger calls e.stopPropagation() "to be safe."</p>
      </div>
      <div class="col">
        <h2 class="colTitle good">Fixed</h2>
        <p class="pageCount">Page clicks seen: <span id="goodPage">0</span></p>
        <div class="menuWrap">
          <button type="button" class="trigger" id="goodTrigger">Menu &#9662;</button>
          <div class="menu" id="goodMenu"><p class="menuItem">Menu content</p></div>
        </div>
        <p class="note" id="goodNote">Trigger never stops propagation.</p>
      </div>
    </div>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; --green: #16a34a; --red: #dc2626; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 54em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px 16px 28px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%; max-width: 480px; }
  .col { background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 14px; text-align: center; }
  .colTitle { margin: 0 0 10px; font: 700 12px ui-monospace, monospace; padding: 5px 8px; border-radius: 6px; display: inline-block; }
  .colTitle.bad { color: var(--red); background: #fdeaea; }
  .colTitle.good { color: var(--green); background: #e8f7ee; }
  .pageCount { margin: 0 0 10px; font: 800 13px ui-monospace, monospace; }
  .menuWrap { position: relative; display: inline-block; margin-bottom: 8px; }
  .trigger { padding: 9px 16px; border-radius: 8px; border: 1px solid var(--line); background: #fff; color: var(--ink); font: 700 12.5px system-ui, sans-serif; cursor: pointer; }
  .trigger:hover { border-color: var(--accent); }
  .menu { position: absolute; top: calc(100% + 6px); left: 50%; transform: translateX(-50%); display: none; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; box-shadow: 0 6px 20px rgba(0,0,0,.08); min-width: 140px; z-index: 5; }
  .menu.open { display: block; }
  .menuItem { margin: 0; font-size: 12.5px; }
  .note { margin: 6px 0 0; font-size: 11.5px; color: var(--sub); line-height: 1.5; min-height: 2.6em; }
</script>

<script type="text/plain" id="js">
  function setupBad() {
    var trigger = document.getElementById('badTrigger');
    var menu = document.getElementById('badMenu');
    var pageEl = document.getElementById('badPage');
    var note = document.getElementById('badNote');
    var pageClicks = 0;

    // An unrelated listener on document -- analytics, a "close all popovers"
    // coordinator, anything else the page happens to need on every click.
    document.addEventListener('click', function () {
      pageClicks += 1;
      pageEl.textContent = pageClicks;
    });

    // BROKEN: stopPropagation() was added to stop the outside-click handler
    // from immediately closing the menu it just opened. It does stop that --
    // but it also stops the click from ever reaching document at all, so
    // every OTHER document-level listener silently stops seeing these clicks.
    trigger.addEventListener('click', function (e) {
      e.stopPropagation();
      menu.classList.toggle('open');
      note.textContent = 'Menu toggled, but this click never reached document -- the page counter above did not move.';
    });

    document.addEventListener('click', function (e) {
      if (menu.classList.contains('open') && !menu.contains(e.target) && !trigger.contains(e.target)) {
        menu.classList.remove('open');
      }
    });
  }

  function setupGood() {
    var trigger = document.getElementById('goodTrigger');
    var menu = document.getElementById('goodMenu');
    var pageEl = document.getElementById('goodPage');
    var note = document.getElementById('goodNote');
    var pageClicks = 0;

    document.addEventListener('click', function () {
      pageClicks += 1;
      pageEl.textContent = pageClicks;
    });

    // FIXED: never call stopPropagation(). The outside-click handler
    // protects itself with its own contains() check instead, so the click
    // is free to keep bubbling and reach every other listener on the page.
    trigger.addEventListener('click', function () {
      menu.classList.toggle('open');
      note.textContent = 'Menu toggled, and the click still reached document -- the page counter above moved too.';
    });

    document.addEventListener('click', function (e) {
      if (menu.classList.contains('open') && !menu.contains(e.target) && !trigger.contains(e.target)) {
        menu.classList.remove('open');
      }
    });
  }

  setupBad();
  setupGood();
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
