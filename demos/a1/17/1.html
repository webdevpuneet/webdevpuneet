<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="No Target Check Closes the Menu on Every Click">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>No target check closes the menu on every click</h1>
    <p class="hint">Open each menu, then click one of its own items (not the trigger). The broken menu slams shut before the click can register; the fixed one only closes on a genuine outside click.</p>
  </header>
  <main class="stageWrap">
    <div class="cols">
      <div class="col">
        <h2 class="colTitle bad">Broken</h2>
        <div class="menuWrap">
          <button type="button" class="trigger" id="badTrigger">Menu &#9662;</button>
          <div class="menu" id="badMenu">
            <button class="menuItem" data-item="Profile">Profile</button>
            <button class="menuItem" data-item="Settings">Settings</button>
            <button class="menuItem" data-item="Logout">Logout</button>
          </div>
        </div>
        <p class="stat">Closed by outside handler: <span id="badCount">0</span></p>
        <p class="note" id="badNote">Click the trigger, then try clicking "Profile."</p>
      </div>
      <div class="col">
        <h2 class="colTitle good">Fixed</h2>
        <div class="menuWrap">
          <button type="button" class="trigger" id="goodTrigger">Menu &#9662;</button>
          <div class="menu" id="goodMenu">
            <button class="menuItem" data-item="Profile">Profile</button>
            <button class="menuItem" data-item="Settings">Settings</button>
            <button class="menuItem" data-item="Logout">Logout</button>
          </div>
        </div>
        <p class="stat">Closed by outside handler: <span id="goodCount">0</span></p>
        <p class="note" id="goodNote">Click the trigger, then try clicking "Profile."</p>
      </div>
    </div>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; --green: #16a34a; --red: #dc2626; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 52em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px 16px 28px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%; max-width: 480px; }
  .col { background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 14px; text-align: center; }
  .colTitle { margin: 0 0 10px; font: 700 12px ui-monospace, monospace; padding: 5px 8px; border-radius: 6px; display: inline-block; }
  .colTitle.bad { color: var(--red); background: #fdeaea; }
  .colTitle.good { color: var(--green); background: #e8f7ee; }
  .menuWrap { position: relative; display: inline-block; margin-bottom: 8px; }
  .trigger { padding: 9px 16px; border-radius: 8px; border: 1px solid var(--line); background: #fff; color: var(--ink); font: 700 12.5px system-ui, sans-serif; cursor: pointer; }
  .trigger:hover { border-color: var(--accent); }
  .menu { position: absolute; top: calc(100% + 6px); left: 50%; transform: translateX(-50%); display: none; flex-direction: column; gap: 2px; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 6px; box-shadow: 0 6px 20px rgba(0,0,0,.08); min-width: 130px; z-index: 5; }
  .menu.open { display: flex; }
  .menuItem { text-align: left; padding: 7px 10px; border: none; background: transparent; border-radius: 6px; font: 500 12.5px system-ui, sans-serif; color: var(--ink); cursor: pointer; }
  .menuItem:hover { background: #f0f1f5; }
  .stat { margin: 4px 0 0; font: 800 13px ui-monospace, monospace; }
  .note { margin: 6px 0 0; font-size: 11.5px; color: var(--sub); line-height: 1.5; min-height: 2.6em; }
</script>

<script type="text/plain" id="js">
  function setupBad() {
    var trigger = document.getElementById('badTrigger');
    var menu = document.getElementById('badMenu');
    var countEl = document.getElementById('badCount');
    var note = document.getElementById('badNote');
    var count = 0;

    trigger.addEventListener('click', function () {
      menu.classList.toggle('open');
    });

    menu.addEventListener('click', function (e) {
      var item = e.target.closest('.menuItem');
      if (item) note.textContent = 'You picked "' + item.dataset.item + '" -- if you even got the click to land.';
    });

    // BROKEN: no check at all on e.target. ANY click anywhere on the
    // document closes the menu, including clicks on the menu's own items.
    document.addEventListener('click', function (e) {
      if (menu.classList.contains('open')) {
        menu.classList.remove('open');
        count += 1;
        countEl.textContent = count;
        note.textContent = 'Closed by the document listener -- even though you clicked inside the menu.';
      }
    });
  }

  function setupGood() {
    var trigger = document.getElementById('goodTrigger');
    var menu = document.getElementById('goodMenu');
    var countEl = document.getElementById('goodCount');
    var note = document.getElementById('goodNote');
    var count = 0;

    trigger.addEventListener('click', function (e) {
      e.stopPropagation();
      menu.classList.toggle('open');
    });

    menu.addEventListener('click', function (e) {
      var item = e.target.closest('.menuItem');
      if (item) {
        note.textContent = 'You picked "' + item.dataset.item + '" -- the click landed correctly.';
        menu.classList.remove('open');
      }
    });

    // FIXED: only close if the click's target is neither inside the menu
    // nor the trigger button itself.
    document.addEventListener('click', function (e) {
      if (!menu.classList.contains('open')) return;
      if (menu.contains(e.target) || trigger.contains(e.target)) return;
      menu.classList.remove('open');
      count += 1;
      countEl.textContent = count;
      note.textContent = 'Closed by the document listener -- because that click was genuinely outside.';
    });
  }

  setupBad();
  setupGood();
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
