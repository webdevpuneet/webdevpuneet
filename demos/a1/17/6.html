<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="click-Only Listeners Miss Taps on Touch Devices">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>A click-only listener misses a real touch tap outside the menu</h1>
    <p class="hint">Open each menu, then press "Simulate touch tap outside" -- it dispatches a real touchstart event outside the menu, not a mouse click. Watch which menu actually closes.</p>
  </header>
  <main class="stageWrap">
    <div class="cols">
      <div class="col">
        <h2 class="colTitle bad">Broken</h2>
        <div class="menuWrap">
          <button type="button" class="trigger" id="badTrigger">Open menu</button>
          <div class="menu" id="badMenu"><p class="menuItem">Menu content</p></div>
        </div>
        <button type="button" class="simBtn" id="badSim">Simulate touch tap outside</button>
        <p class="note" id="badNote">Listens for "click" only.</p>
      </div>
      <div class="col">
        <h2 class="colTitle good">Fixed</h2>
        <div class="menuWrap">
          <button type="button" class="trigger" id="goodTrigger">Open menu</button>
          <div class="menu" id="goodMenu"><p class="menuItem">Menu content</p></div>
        </div>
        <button type="button" class="simBtn" id="goodSim">Simulate touch tap outside</button>
        <p class="note" id="goodNote">Listens for both "click" and "touchstart".</p>
      </div>
    </div>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; --green: #16a34a; --red: #dc2626; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 58em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px 16px 28px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%; max-width: 480px; }
  .col { background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 14px; text-align: center; }
  .colTitle { margin: 0 0 10px; font: 700 12px ui-monospace, monospace; padding: 5px 8px; border-radius: 6px; display: inline-block; }
  .colTitle.bad { color: var(--red); background: #fdeaea; }
  .colTitle.good { color: var(--green); background: #e8f7ee; }
  .menuWrap { position: relative; display: inline-block; margin-bottom: 10px; }
  .trigger { padding: 9px 16px; border-radius: 8px; border: 1px solid var(--line); background: #fff; color: var(--ink); font: 700 12.5px system-ui, sans-serif; cursor: pointer; }
  .trigger:hover { border-color: var(--accent); }
  .menu { position: absolute; top: calc(100% + 6px); left: 50%; transform: translateX(-50%); display: none; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; box-shadow: 0 6px 20px rgba(0,0,0,.08); min-width: 140px; z-index: 5; }
  .menu.open { display: block; }
  .menuItem { margin: 0; font-size: 12.5px; }
  .simBtn { display: block; margin: 0 auto; padding: 8px 14px; border-radius: 7px; border: 1px dashed var(--line); background: #fafafa; color: var(--sub); font: 700 11.5px system-ui, sans-serif; cursor: pointer; }
  .simBtn:hover { border-color: var(--accent); color: var(--accent); }
  .note { margin: 8px 0 0; font-size: 11.5px; color: var(--sub); line-height: 1.5; min-height: 2.6em; }
</script>

<script type="text/plain" id="js">
  function dispatchOutsideTouch() {
    var evt;
    try {
      evt = new Event('touchstart', { bubbles: true, cancelable: true });
    } catch (err) {
      evt = document.createEvent('Event');
      evt.initEvent('touchstart', true, true);
    }
    // Dispatched on <body> itself -- simulating a tap on empty page space,
    // genuinely outside any menu. No "click" event is fired here at all,
    // matching how a real touchstart-only interaction behaves.
    document.body.dispatchEvent(evt);
  }

  function setupBad() {
    var trigger = document.getElementById('badTrigger');
    var menu = document.getElementById('badMenu');
    var note = document.getElementById('badNote');
    var sim = document.getElementById('badSim');

    trigger.addEventListener('click', function () {
      menu.classList.add('open');
      note.textContent = 'Menu open. Now simulate a touch tap outside.';
    });

    // BROKEN: only listens for "click". On many touch browsers a tap
    // still eventually synthesizes a click, but plenty of real
    // interactions -- scrolling past the menu, a tap handled elsewhere,
    // or code that calls preventDefault() on touchstart -- never produce
    // one at all, leaving the menu stuck open.
    document.addEventListener('click', function (e) {
      if (!menu.contains(e.target) && !trigger.contains(e.target)) {
        menu.classList.remove('open');
      }
    });

    sim.addEventListener('click', function (e) {
      // Stop this real click from bubbling so only the manually dispatched
      // touchstart below is what the outside-click logic ever sees.
      e.stopPropagation();
      dispatchOutsideTouch();
      note.textContent = menu.classList.contains('open')
        ? 'A touchstart happened outside, but this listener only understands "click" -- the menu is still open.'
        : 'Menu was already closed.';
    });
  }

  function setupGood() {
    var trigger = document.getElementById('goodTrigger');
    var menu = document.getElementById('goodMenu');
    var note = document.getElementById('goodNote');
    var sim = document.getElementById('goodSim');

    trigger.addEventListener('click', function () {
      menu.classList.add('open');
      note.textContent = 'Menu open. Now simulate a touch tap outside.';
    });

    // FIXED: listen for both "click" (mouse and trackpad) and "touchstart"
    // (touchscreens), so an outside interaction closes the menu no matter
    // which input method produced it.
    function handleOutside(e) {
      if (!menu.contains(e.target) && !trigger.contains(e.target)) {
        menu.classList.remove('open');
      }
    }
    document.addEventListener('click', handleOutside);
    document.addEventListener('touchstart', handleOutside);

    sim.addEventListener('click', function (e) {
      e.stopPropagation();
      dispatchOutsideTouch();
      note.textContent = menu.classList.contains('open')
        ? 'Menu was already closed.'
        : 'The touchstart listener caught it -- the menu closed immediately.';
    });
  }

  setupBad();
  setupGood();
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
