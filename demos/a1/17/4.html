<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Never Removing the Listener Leaks a New One Every Open">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Never removing the listener leaks a new one every time you open</h1>
    <p class="hint">Open and close each menu 3 times (click the trigger, then click outside), then click outside once more. Watch how many times the "closed" log fires from that single last click.</p>
  </header>
  <main class="stageWrap">
    <div class="cols">
      <div class="col">
        <h2 class="colTitle bad">Broken</h2>
        <div class="menuWrap">
          <button type="button" class="trigger" id="badTrigger">Open menu</button>
          <div class="menu" id="badMenu"><p class="menuItem">Menu content</p></div>
        </div>
        <p class="stat">Active listeners: <span id="badListeners">0</span></p>
        <p class="note" id="badNote">Open, click outside, repeat 3 times.</p>
      </div>
      <div class="col">
        <h2 class="colTitle good">Fixed</h2>
        <div class="menuWrap">
          <button type="button" class="trigger" id="goodTrigger">Open menu</button>
          <div class="menu" id="goodMenu"><p class="menuItem">Menu content</p></div>
        </div>
        <p class="stat">Active listeners: <span id="goodListeners">0</span></p>
        <p class="note" id="goodNote">Open, click outside, repeat 3 times.</p>
      </div>
    </div>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; --green: #16a34a; --red: #dc2626; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 56em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px 16px 28px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%; max-width: 480px; }
  .col { background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 14px; text-align: center; }
  .colTitle { margin: 0 0 10px; font: 700 12px ui-monospace, monospace; padding: 5px 8px; border-radius: 6px; display: inline-block; }
  .colTitle.bad { color: var(--red); background: #fdeaea; }
  .colTitle.good { color: var(--green); background: #e8f7ee; }
  .menuWrap { position: relative; display: inline-block; margin-bottom: 8px; }
  .trigger { padding: 9px 16px; border-radius: 8px; border: 1px solid var(--line); background: #fff; color: var(--ink); font: 700 12.5px system-ui, sans-serif; cursor: pointer; }
  .trigger:hover { border-color: var(--accent); }
  .menu { position: absolute; top: calc(100% + 6px); left: 50%; transform: translateX(-50%); display: none; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; box-shadow: 0 6px 20px rgba(0,0,0,.08); min-width: 140px; z-index: 5; }
  .menu.open { display: block; }
  .menuItem { margin: 0; font-size: 12.5px; }
  .stat { margin: 4px 0 0; font: 800 13px ui-monospace, monospace; }
  .note { margin: 6px 0 0; font-size: 11.5px; color: var(--sub); line-height: 1.5; min-height: 2.6em; }
</script>

<script type="text/plain" id="js">
  function setupBad() {
    var trigger = document.getElementById('badTrigger');
    var menu = document.getElementById('badMenu');
    var listenersEl = document.getElementById('badListeners');
    var note = document.getElementById('badNote');
    var activeListeners = 0;
    var closeFires = 0;

    // BROKEN: a fresh anonymous function is attached every time the menu
    // opens, and close() never removes it. Each one is a genuinely distinct
    // function reference, so addEventListener does NOT deduplicate them --
    // they stack up forever.
    trigger.addEventListener('click', function () {
      menu.classList.add('open');
      document.addEventListener('click', function outsideHandler(e) {
        if (menu.contains(e.target) || trigger.contains(e.target)) return;
        menu.classList.remove('open');
        closeFires += 1;
        note.textContent = 'This single click outside fired the close logic ' + closeFires + ' time(s) -- one for every leaked listener.';
      });
      activeListeners += 1;
      listenersEl.textContent = activeListeners;
    });
  }

  function setupGood() {
    var trigger = document.getElementById('goodTrigger');
    var menu = document.getElementById('goodMenu');
    var listenersEl = document.getElementById('goodListeners');
    var note = document.getElementById('goodNote');
    var activeListeners = 0;

    function outsideHandler(e) {
      if (menu.contains(e.target) || trigger.contains(e.target)) return;
      close();
    }

    function open() {
      menu.classList.add('open');
      document.addEventListener('click', outsideHandler);
      activeListeners = 1;
      listenersEl.textContent = activeListeners;
    }

    function close() {
      menu.classList.remove('open');
      // FIXED: remove the SAME function reference that was added. Only
      // ever one listener exists at a time, no matter how many open/close
      // cycles happen.
      document.removeEventListener('click', outsideHandler);
      activeListeners = 0;
      listenersEl.textContent = activeListeners;
      note.textContent = 'Closed cleanly -- the listener was removed, so this click only fired the close logic once.';
    }

    trigger.addEventListener('click', open);
  }

  setupBad();
  setupGood();
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
