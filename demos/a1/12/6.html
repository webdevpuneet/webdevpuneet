<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Animating clip-path — a wipe reveal">

<script type="text/plain" id="cdn">
https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>clip-path</h1>
    <p class="hint">GSAP tweens <code>clip-path</code> polygons point by point, as long as both ends list the same number of points &mdash; the browser then composites the wipe on the GPU.</p>
  </header>
  <main class="stageWrap">
    <div class="panel" id="panel">REVEAL</div>
  </main>
  <div class="btnRow">
    <button class="runBtn" id="runBtn">Wipe in</button>
    <button class="resetBtn" id="resetBtn">Reset</button>
  </div>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; font-family: ui-monospace, monospace; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .hint code { background: #eceef3; padding: 1px 5px; border-radius: 4px; }
  .stageWrap { display: flex; justify-content: center; align-items: center; height: 220px; }
  .panel {
    width: 220px;
    height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #6366f1, #06b6d4);
    color: #fff;
    font: 800 15px system-ui, sans-serif;
    border-radius: 12px;
    clip-path: polygon(0 0, 0 0, 0 100%, 0 100%);
  }
  .btnRow { display: flex; justify-content: center; gap: 10px; padding: 0 20px 32px; }
  .runBtn, .resetBtn {
    padding: 10px 18px;
    font: 700 13px system-ui, sans-serif;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  .runBtn { color: #fff; background: var(--accent); }
  .runBtn:hover { background: #4f52d9; }
  .resetBtn { color: var(--ink); background: #fff; border: 1.5px solid var(--line); }
</script>

<script type="text/plain" id="js">
  const panel = document.getElementById('panel');

  document.getElementById('runBtn').addEventListener('click', function () {
    gsap.to(panel, {
      clipPath: 'polygon(0 0, 100% 0, 100% 100%, 0 100%)',
      duration: 0.9,
      ease: 'power2.inOut'
    });
  });

  document.getElementById('resetBtn').addEventListener('click', function () {
    gsap.to(panel, {
      clipPath: 'polygon(0 0, 0 0, 0 100%, 0 100%)',
      duration: 0.5
    });
  });
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
