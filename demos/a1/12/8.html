<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Animating stroke-dashoffset — an SVG draw-in">

<script type="text/plain" id="cdn">
https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>SVG stroke draw-in</h1>
    <p class="hint">Not a CSS property in the box-model sense, but an SVG presentation attribute GSAP animates the exact same way &mdash; set <code>stroke-dasharray</code> to the path length, then tween <code>stroke-dashoffset</code> from that length to 0.</p>
  </header>
  <main class="stageWrap">
    <svg viewBox="0 0 200 100" width="220" height="110">
      <path id="tick" d="M20 55 L80 90 L180 15" fill="none" stroke="#16a34a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </main>
  <div class="btnRow">
    <button class="runBtn" id="runBtn">Draw</button>
    <button class="resetBtn" id="resetBtn">Reset</button>
  </div>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; font-family: ui-monospace, monospace; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .hint code { background: #eceef3; padding: 1px 5px; border-radius: 4px; }
  .stageWrap { display: flex; justify-content: center; align-items: center; height: 220px; }
  .btnRow { display: flex; justify-content: center; gap: 10px; padding: 0 20px 32px; }
  .runBtn, .resetBtn {
    padding: 10px 18px;
    font: 700 13px system-ui, sans-serif;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  .runBtn { color: #fff; background: var(--accent); }
  .runBtn:hover { background: #4f52d9; }
  .resetBtn { color: var(--ink); background: #fff; border: 1.5px solid var(--line); }
</script>

<script type="text/plain" id="js">
  const tick = document.getElementById('tick');
  const length = tick.getTotalLength();
  gsap.set(tick, { strokeDasharray: length, strokeDashoffset: length });

  document.getElementById('runBtn').addEventListener('click', function () {
    gsap.to(tick, {
      strokeDashoffset: 0,
      duration: 0.9,
      ease: 'power1.inOut'
    });
  });

  document.getElementById('resetBtn').addEventListener('click', function () {
    gsap.to(tick, {
      strokeDashoffset: length,
      duration: 0.4
    });
  });
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
