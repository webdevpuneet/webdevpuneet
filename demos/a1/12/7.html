<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Animating a CSS custom property">

<script type="text/plain" id="cdn">
https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>CSS custom property</h1>
    <p class="hint">GSAP can tween a registered numeric CSS variable directly &mdash; here <code>--pct</code> drives both the meter's fill width and the percentage label from one tween.</p>
  </header>
  <main class="stageWrap">
    <div class="meterWrap">
      <div class="meter"><div class="meterFill" id="fill"></div></div>
      <div class="pctLabel" id="label">0%</div>
    </div>
  </main>
  <div class="btnRow">
    <button class="runBtn" id="runBtn">Load to 82%</button>
    <button class="resetBtn" id="resetBtn">Reset</button>
  </div>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; }
  @property --pct {
    syntax: '<number>';
    inherits: false;
    initial-value: 0;
  }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; font-family: ui-monospace, monospace; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .hint code { background: #eceef3; padding: 1px 5px; border-radius: 4px; }
  .stageWrap { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 220px; gap: 12px; }
  .meterWrap { width: 260px; text-align: center; }
  .meter { height: 16px; border-radius: 999px; background: #e3e5ea; overflow: hidden; }
  .meterFill { height: 100%; width: calc(var(--pct) * 1%); background: linear-gradient(90deg, #6366f1, #06b6d4); border-radius: 999px; }
  .pctLabel { margin-top: 10px; font: 700 14px ui-monospace, monospace; color: var(--ink); }
  .btnRow { display: flex; justify-content: center; gap: 10px; padding: 0 20px 32px; }
  .runBtn, .resetBtn {
    padding: 10px 18px;
    font: 700 13px system-ui, sans-serif;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  .runBtn { color: #fff; background: var(--accent); }
  .runBtn:hover { background: #4f52d9; }
  .resetBtn { color: var(--ink); background: #fff; border: 1.5px solid var(--line); }
</script>

<script type="text/plain" id="js">
  const fill = document.getElementById('fill');
  const label = document.getElementById('label');

  document.getElementById('runBtn').addEventListener('click', function () {
    gsap.to(fill, {
      '--pct': 82,
      duration: 1.2,
      ease: 'power1.out',
      onUpdate: function () {
        var current = gsap.getProperty(fill, '--pct');
        label.textContent = Math.round(current) + '%';
      }
    });
  });

  document.getElementById('resetBtn').addEventListener('click', function () {
    gsap.to(fill, {
      '--pct': 0,
      duration: 0.5,
      onUpdate: function () {
        var current = gsap.getProperty(fill, '--pct');
        label.textContent = Math.round(current) + '%';
      }
    });
  });
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
