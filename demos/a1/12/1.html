<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Transform properties — x, y, scale, rotation, skew">

<script type="text/plain" id="cdn">
https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Transform shorthand</h1>
    <p class="hint">GSAP animates <code>x</code>, <code>y</code>, <code>scale</code>, <code>rotation</code> and <code>skewX</code>/<code>skewY</code> as plain numeric properties &mdash; no hand-written <code>transform</code> string required.</p>
  </header>
  <main class="stageWrap">
    <div class="box" id="box">CSS</div>
  </main>
  <div class="btnRow">
    <button class="runBtn" id="runBtn">Run</button>
    <button class="resetBtn" id="resetBtn">Reset</button>
  </div>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; font-family: ui-monospace, monospace; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .hint code { background: #eceef3; padding: 1px 5px; border-radius: 4px; }
  .stageWrap { display: flex; justify-content: center; align-items: center; height: 220px; }
  .box {
    width: 90px;
    height: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--accent);
    color: #fff;
    font: 800 14px system-ui, sans-serif;
    border-radius: 12px;
  }
  .btnRow { display: flex; justify-content: center; gap: 10px; padding: 0 20px 32px; }
  .runBtn, .resetBtn {
    padding: 10px 18px;
    font: 700 13px system-ui, sans-serif;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  .runBtn { color: #fff; background: var(--accent); }
  .runBtn:hover { background: #4f52d9; }
  .resetBtn { color: var(--ink); background: #fff; border: 1.5px solid var(--line); }
</script>

<script type="text/plain" id="js">
  const box = document.getElementById('box');

  document.getElementById('runBtn').addEventListener('click', function () {
    gsap.to(box, {
      x: 140,
      y: -20,
      scale: 1.3,
      rotation: 25,
      skewX: 8,
      duration: 1,
      ease: 'power2.out'
    });
  });

  document.getElementById('resetBtn').addEventListener('click', function () {
    gsap.to(box, { x: 0, y: 0, scale: 1, rotation: 0, skewX: 0, duration: 0.4 });
  });
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
