<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Animating color — backgroundColor, color, borderColor">

<script type="text/plain" id="cdn">
https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Color properties</h1>
    <p class="hint">GSAP's core understands color values &mdash; hex, <code>rgb()</code>, named colors &mdash; and tweens smoothly between them, unlike a raw CSS transition on some color pairs.</p>
  </header>
  <main class="stageWrap">
    <div class="card" id="card">Status: idle</div>
  </main>
  <div class="btnRow">
    <button class="runBtn" id="runBtn">Mark success</button>
    <button class="resetBtn" id="resetBtn">Reset</button>
  </div>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; font-family: ui-monospace, monospace; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .hint code { background: #eceef3; padding: 1px 5px; border-radius: 4px; }
  .stageWrap { display: flex; justify-content: center; align-items: center; height: 200px; }
  .card {
    padding: 22px 34px;
    background: #ffffff;
    color: #6b7080;
    border: 2px solid #e3e5ea;
    border-radius: 12px;
    font: 700 15px system-ui, sans-serif;
  }
  .btnRow { display: flex; justify-content: center; gap: 10px; padding: 0 20px 32px; }
  .runBtn, .resetBtn {
    padding: 10px 18px;
    font: 700 13px system-ui, sans-serif;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  .runBtn { color: #fff; background: var(--accent); }
  .runBtn:hover { background: #4f52d9; }
  .resetBtn { color: var(--ink); background: #fff; border: 1.5px solid var(--line); }
</script>

<script type="text/plain" id="js">
  const card = document.getElementById('card');

  document.getElementById('runBtn').addEventListener('click', function () {
    card.textContent = 'Status: saved';
    gsap.to(card, {
      backgroundColor: '#e8f9ee',
      color: '#15803d',
      borderColor: '#16a34a',
      duration: 0.6,
      ease: 'power1.out'
    });
  });

  document.getElementById('resetBtn').addEventListener('click', function () {
    card.textContent = 'Status: idle';
    gsap.to(card, {
      backgroundColor: '#ffffff',
      color: '#6b7080',
      borderColor: '#e3e5ea',
      duration: 0.4
    });
  });
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
