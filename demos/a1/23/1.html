<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="A Parent Re-Render Always Re-Renders Its Children">

<script type="text/plain" id="cdn">
https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js
https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>A parent re-render always re-renders its children</h1>
    <p class="hint">Click "Re-render parent" a few times. Child's props never change — watch its render count climb anyway.</p>
  </header>
  <main class="stageWrap">
    <div id="root"></div>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; --green: #16a34a; --red: #dc2626; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 18px 16px 28px; }
  .frame { width: 100%; max-width: 460px; background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 16px; text-align: center; }
  .parentStat { font: 800 22px ui-monospace, monospace; margin-bottom: 10px; }
  .childBox { margin-top: 6px; border: 1.5px dashed var(--accent); border-radius: 8px; padding: 12px; background: #f4f4ff; }
  .childTitle { font: 700 12px ui-monospace, monospace; color: var(--accent); margin-bottom: 6px; }
  .childStat { font: 800 24px ui-monospace, monospace; }
  .props { margin: 6px 0 0; font: 600 11px ui-monospace, monospace; color: var(--sub); }
  .note { margin: 10px 0 0; font-size: 11px; color: var(--sub); line-height: 1.5; }
  .btn { padding: 9px 16px; border-radius: 9px; border: none; background: var(--accent); color: #fff; font: 700 13px system-ui, sans-serif; cursor: pointer; }
  .btn:hover { background: #4f52d6; }
  code { background: #eceef3; padding: 1px 5px; border-radius: 4px; font-size: 11px; }
</script>

<script type="text/plain" id="js">
  var e = React.createElement;
  var useState = React.useState;
  var useRef = React.useRef;

  function Child(props) {
    var renderCountRef = useRef(0);
    renderCountRef.current += 1;

    return e('div', { className: 'childBox' },
      e('div', { className: 'childTitle' }, 'Child (unmemoized)'),
      e('div', { className: 'childStat' }, renderCountRef.current),
      e('div', { className: 'props' }, 'label prop: "' + props.label + '"')
    );
  }

  function Demo() {
    var tickState = useState(0);
    var tick = tickState[0];
    var setTick = tickState[1];

    var parentRenderRef = useRef(0);
    parentRenderRef.current += 1;

    return e('div', { className: 'frame' },
      e('div', { className: 'parentStat' }, 'Parent renders: ' + parentRenderRef.current),
      e(Child, { label: 'static-label' }),
      e('p', { className: 'note' }, 'Child receives the exact same ', e('code', null, 'label'), ' prop every time, yet its render count matches the parent’s exactly.'),
      e('button', { className: 'btn', onClick: function () { setTick(tick + 1); } }, 'Re-render parent (' + tick + ')')
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(e(Demo));
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
