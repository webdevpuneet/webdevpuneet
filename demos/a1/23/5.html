<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Proving React.memo Stops (or Doesn't Stop) a Re-Render">

<script type="text/plain" id="cdn">
https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js
https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Proving React.memo stops (or doesn't stop) a re-render</h1>
    <p class="hint">Click "Unrelated tick" a few times. Both children are wrapped in React.memo — watch which render counter still climbs.</p>
  </header>
  <main class="stageWrap">
    <div id="root"></div>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; --green: #16a34a; --red: #dc2626; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 18px 16px 28px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%; max-width: 480px; }
  .col { background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 14px; text-align: center; }
  .colTitle { margin: 0 0 8px; font: 700 12px ui-monospace, monospace; padding: 5px 8px; border-radius: 6px; }
  .colTitle.good { color: var(--green); background: #e8f7ee; }
  .colTitle.bad { color: var(--red); background: #fdeaea; }
  .stat { font: 800 24px ui-monospace, monospace; margin-bottom: 6px; }
  .note { margin: 8px 0 0; font-size: 11px; color: var(--sub); line-height: 1.5; }
  .btn { padding: 9px 16px; border-radius: 9px; border: none; background: var(--accent); color: #fff; font: 700 13px system-ui, sans-serif; cursor: pointer; }
  .btn:hover { background: #4f52d6; }
  code { background: #eceef3; padding: 1px 5px; border-radius: 4px; font-size: 11px; }
</script>

<script type="text/plain" id="js">
  var e = React.createElement;
  var useState = React.useState;
  var useRef = React.useRef;

  function StableChildImpl(props) {
    var renderCountRef = useRef(0);
    renderCountRef.current += 1;
    return e('div', { className: 'col' },
      e('div', { className: 'colTitle good' }, 'Stable prop'),
      e('div', { className: 'stat' }, renderCountRef.current),
      e('p', { className: 'note' }, e('code', null, 'onAction'), ' is the same reference every render, so React.memo’s shallow compare finds equality and skips this child.')
    );
  }
  var StableChild = React.memo(StableChildImpl);

  function UnstableChildImpl(props) {
    var renderCountRef = useRef(0);
    renderCountRef.current += 1;
    return e('div', { className: 'col' },
      e('div', { className: 'colTitle bad' }, 'Unstable prop'),
      e('div', { className: 'stat' }, renderCountRef.current),
      e('p', { className: 'note' }, e('code', null, 'onAction'), ' is a brand-new function every render, so React.memo sees a "changed" prop and renders anyway.')
    );
  }
  var UnstableChild = React.memo(UnstableChildImpl);

  var stableHandler = function () {};

  function Demo() {
    var tickState = useState(0);
    var tick = tickState[0];
    var setTick = tickState[1];

    return e('div', null,
      e('div', { className: 'cols' },
        e(StableChild, { onAction: stableHandler }),
        e(UnstableChild, { onAction: function () {} })
      ),
      e('div', { style: { marginTop: '14px', textAlign: 'center' } },
        e('button', { className: 'btn', onClick: function () { setTick(tick + 1); } }, 'Unrelated tick (' + tick + ')')
      )
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(e(Demo));
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
