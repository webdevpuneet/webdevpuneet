<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Changing a key Remounts, It Doesn't Just Re-Render">

<script type="text/plain" id="cdn">
https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js
https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Changing a key remounts — it doesn't just re-render</h1>
    <p class="hint">Click "Update text" (same key), then "New key" (forces a fresh key). Watch the mount count and internal state.</p>
  </header>
  <main class="stageWrap">
    <div id="root"></div>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; --green: #16a34a; --red: #dc2626; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 18px 16px 28px; }
  .frame { width: 100%; max-width: 480px; background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 16px; text-align: center; }
  .stat { font: 800 22px ui-monospace, monospace; margin-bottom: 4px; }
  .sub2 { font: 600 11px ui-monospace, monospace; color: var(--sub); margin-bottom: 10px; }
  .box { border: 1.5px dashed var(--accent); border-radius: 8px; padding: 12px; background: #f4f4ff; margin-bottom: 10px; }
  .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .btn { padding: 8px 12px; border-radius: 8px; border: none; background: var(--accent); color: #fff; font: 700 12.5px system-ui, sans-serif; cursor: pointer; }
  .btn:hover { background: #4f52d6; }
  .btn.ghost { background: #fff; color: var(--ink); border: 1.5px solid var(--line); }
  .note { margin: 8px 0 0; font-size: 11px; color: var(--sub); line-height: 1.5; }
  input { font: 600 12px ui-monospace, monospace; padding: 6px 8px; border-radius: 6px; border: 1.5px solid var(--line); margin-bottom: 8px; width: 70%; }
  code { background: #eceef3; padding: 1px 5px; border-radius: 4px; font-size: 11px; }
</script>

<script type="text/plain" id="js">
  var e = React.createElement;
  var useState = React.useState;
  var useRef = React.useRef;
  var useEffect = React.useEffect;

  var totalMountsCounter = { current: 0 }; // module-level, survives every remount

  function Counter(props) {
    // local state that lives INSIDE the component instance -- it should
    // survive a re-render, but not survive a remount
    var clicksState = useState(0);
    var clicks = clicksState[0];
    var setClicks = clicksState[1];

    var renderCountRef = useRef(0);
    renderCountRef.current += 1;

    useEffect(function () {
      totalMountsCounter.current += 1;
      props.onMount(totalMountsCounter.current);
      return function () {}; // unmount happens when key changes; this instance is discarded
    }, []);

    return e('div', { className: 'box' },
      e('div', { className: 'stat' }, 'internal clicks: ' + clicks),
      e('div', { className: 'sub2' }, 'renders this instance: ' + renderCountRef.current),
      e('button', { className: 'btn ghost', onClick: function () { setClicks(clicks + 1); } }, '+1 internal click')
    );
  }

  function Demo() {
    var labelState = useState('a');
    var label = labelState[0];
    var setLabel = labelState[1];

    var keyState = useState(1);
    var keyVal = keyState[0];
    var setKeyVal = keyState[1];

    var mountsSeenState = useState(1);
    var mountsSeen = mountsSeenState[0];
    var setMountsSeen = mountsSeenState[1];

    return e('div', { className: 'frame' },
      e(Counter, { key: keyVal, onMount: setMountsSeen }),
      e('div', { className: 'sub2' }, 'total instances mounted so far: ' + mountsSeen),
      e('p', { className: 'note' }, 'Current key: ', e('code', null, keyVal), '. "Update text" leaves the key alone (same instance, state survives). "New key" gives React a different key, so it discards the old component instance and mounts a fresh one — internal clicks resets to 0 and the mount count increments, even though nothing else about the UI changed.'),
      e('div', { className: 'row' },
        e('button', { className: 'btn', onClick: function () { setLabel(label + 'x'); } }, 'Update text (same key)'),
        e('button', { className: 'btn', onClick: function () { setKeyVal(keyVal + 1); } }, 'New key (' + keyVal + ')')
      )
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(e(Demo));
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
