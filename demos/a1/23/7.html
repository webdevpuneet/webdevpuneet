<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="StrictMode's Double-Render vs a Real Extra Re-Render">

<script type="text/plain" id="cdn">
https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js
https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>StrictMode's double-render vs a real extra re-render</h1>
    <p class="hint">Click "Mount inside StrictMode" once, then "Click me" once on each mounted instance. Compare the jump in each counter.</p>
  </header>
  <main class="stageWrap">
    <div id="root"></div>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; --green: #16a34a; --red: #dc2626; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 18px 16px 28px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%; max-width: 480px; }
  .col { background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 14px; text-align: center; }
  .colTitle { margin: 0 0 8px; font: 700 12px ui-monospace, monospace; padding: 5px 8px; border-radius: 6px; color: var(--accent); background: #f4f4ff; }
  .stat { font: 800 24px ui-monospace, monospace; margin-bottom: 6px; }
  .note { margin: 8px 0 0; font-size: 11px; color: var(--sub); line-height: 1.5; }
  .btn { padding: 9px 16px; border-radius: 9px; border: none; background: var(--accent); color: #fff; font: 700 13px system-ui, sans-serif; cursor: pointer; }
  .btn:hover { background: #4f52d6; }
  .btn.ghost { background: #fff; color: var(--ink); border: 1.5px solid var(--line); }
  code { background: #eceef3; padding: 1px 5px; border-radius: 4px; font-size: 11px; }
</script>

<script type="text/plain" id="js">
  var e = React.createElement;
  var useState = React.useState;
  var useRef = React.useRef;

  function Counter(props) {
    var clickState = useState(0);
    var clicks = clickState[0];
    var setClicks = clickState[1];

    var renderCountRef = useRef(0);
    renderCountRef.current += 1;

    return e('div', { className: 'col' },
      e('div', { className: 'colTitle' }, props.label),
      e('div', { className: 'stat' }, renderCountRef.current),
      e('button', { className: 'btn ghost', onClick: function () { setClicks(clicks + 1); } }, 'Click me (' + clicks + ')')
    );
  }

  function Demo() {
    var mountedState = useState(false);
    var mounted = mountedState[0];
    var setMounted = mountedState[1];

    if (!mounted) {
      return e('div', { style: { textAlign: 'center' } },
        e('button', { className: 'btn', onClick: function () { setMounted(true); } }, 'Mount inside StrictMode')
      );
    }

    return e('div', null,
      e('div', { className: 'cols' },
        e(Counter, { label: 'Plain' }),
        e(React.StrictMode, null, e(Counter, { label: 'Inside StrictMode' }))
      ),
      e('p', { className: 'note' }, 'In development, StrictMode intentionally renders (and mounts/unmounts) components twice to surface impure render logic — that extra render count jump is expected and disappears in a production build. It stays flat after that; if a counter keeps climbing on its own with no clicks, that’s a real bug, not StrictMode.')
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(e(Demo));
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
