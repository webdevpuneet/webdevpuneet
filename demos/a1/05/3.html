<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="useReducer's Action Log">

<script type="text/plain" id="cdn">
https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js
https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>useReducer's Action Log</h1>
    <p class="hint">Every button dispatches a plain object describing what happened, not the next value itself. Watch the log — it's a readable history of exactly what this component did, in order.</p>
  </header>
  <main class="stageWrap">
    <div id="root"></div>
  </main>
</script>

<script type="text/plain" id="css">
  :root {
    --ink: #14161c;
    --sub: #6b7080;
    --line: #e3e5ea;
    --accent: #6366f1;
  }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 18px 16px 26px; }

  .card { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; max-width: 460px; padding: 20px; border: 1.5px dashed var(--line); border-radius: 12px; background: #fff; box-sizing: border-box; }
  .countValue { font: 800 34px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--accent); }
  .btnRow { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .actBtn { padding: 8px 13px; font: 700 12px system-ui, sans-serif; color: #fff; background: var(--accent); border: none; border-radius: 8px; cursor: pointer; }
  .actBtn:hover { filter: brightness(1.08); }
  .actBtn--ghost { background: #eceef3; color: var(--ink); }

  .log { width: 100%; max-width: 460px; height: 150px; overflow-y: auto; background: #14151a; border-radius: 10px; padding: 10px 12px; box-sizing: border-box; display: flex; flex-direction: column-reverse; gap: 4px; }
  .logRow { font: 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: #9ea3b5; white-space: pre; }
  .logRow strong { color: #7dd3fc; }
</script>

<script type="text/plain" id="js">
  var e = React.createElement;
  var useReducer = React.useReducer;

  function reducer(state, action) {
    switch (action.type) {
      case 'increment': return { count: state.count + 1 };
      case 'decrement': return { count: state.count - 1 };
      case 'incrementBy': return { count: state.count + action.payload };
      case 'reset': return { count: 0 };
      default: return state;
    }
  }

  function fmt(action) {
    var p = action.payload !== undefined ? ', payload: ' + action.payload : '';
    return "{ type: '" + action.type + "'" + p + ' }';
  }

  function ActionLogger() {
    var r = useReducer(reducer, { count: 0 }), state = r[0], baseDispatch = r[1];
    var l = React.useState([]), log = l[0], setLog = l[1];

    function dispatch(action) {
      baseDispatch(action);
      setLog(function (prev) { return [{ id: Date.now() + Math.random(), text: fmt(action) }].concat(prev).slice(0, 30); });
    }

    return e('div', { className: 'card' },
      e('div', { className: 'countValue' }, state.count),
      e('div', { className: 'btnRow' },
        e('button', { className: 'actBtn', onClick: function () { dispatch({ type: 'increment' }); } }, '+1'),
        e('button', { className: 'actBtn', onClick: function () { dispatch({ type: 'decrement' }); } }, '−1'),
        e('button', { className: 'actBtn', onClick: function () { dispatch({ type: 'incrementBy', payload: 5 }); } }, '+5'),
        e('button', { className: 'actBtn actBtn--ghost', onClick: function () { dispatch({ type: 'reset' }); } }, 'Reset')
      ),
      e('div', { className: 'log' },
        log.length === 0
          ? e('div', { className: 'logRow' }, 'dispatch a few actions — they’ll stack up here')
          : log.map(function (item) { return e('div', { className: 'logRow', key: item.id }, item.text); })
      )
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(e(ActionLogger));
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
