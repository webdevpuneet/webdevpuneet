<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Undo/Redo, Free With a Reducer">

<script type="text/plain" id="cdn">
https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js
https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Undo/Redo, Free With a Reducer</h1>
    <p class="hint">Change the color a few times, then hit Undo. The reducer keeps past and future stacks alongside the present value — every action is just another entry to step through.</p>
  </header>
  <main class="stageWrap">
    <div id="root"></div>
  </main>
</script>

<script type="text/plain" id="css">
  :root {
    --ink: #14161c;
    --sub: #6b7080;
    --line: #e3e5ea;
    --accent: #6366f1;
  }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 20px 16px 30px; }

  .card { display: flex; flex-direction: column; align-items: center; gap: 16px; width: 300px; padding: 20px; border: 1.5px dashed var(--line); border-radius: 12px; background: #fff; }
  .swatch { width: 140px; height: 90px; border-radius: 12px; transition: background 0.15s; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06); }

  .swatchRow { display: flex; gap: 6px; }
  .swBtn { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line); cursor: pointer; }

  .btnRow { display: flex; gap: 8px; }
  .actBtn { padding: 8px 14px; font: 700 12px system-ui, sans-serif; color: #fff; background: var(--accent); border: none; border-radius: 8px; cursor: pointer; }
  .actBtn:hover:not(:disabled) { filter: brightness(1.08); }
  .actBtn:disabled { background: #cfd2db; cursor: not-allowed; }

  .stacks { font: 600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--sub); text-align: center; }

  .ruleTag { font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: #3f4252; background: #eceef3; padding: 10px 14px; border-radius: 10px; max-width: 100%; overflow-x: auto; white-space: pre; }
</script>

<script type="text/plain" id="js">
  var e = React.createElement;
  var useReducer = React.useReducer;

  var COLORS = ['#6366f1', '#ef4444', '#22c55e', '#eab308', '#0ea5e9', '#ec4899'];

  var initial = { past: [], present: '#6366f1', future: [] };

  function reducer(state, action) {
    switch (action.type) {
      case 'set': {
        if (action.color === state.present) return state;
        return { past: state.past.concat([state.present]), present: action.color, future: [] };
      }
      case 'undo': {
        if (state.past.length === 0) return state;
        var previous = state.past[state.past.length - 1];
        return { past: state.past.slice(0, -1), present: previous, future: [state.present].concat(state.future) };
      }
      case 'redo': {
        if (state.future.length === 0) return state;
        var next = state.future[0];
        return { past: state.past.concat([state.present]), present: next, future: state.future.slice(1) };
      }
      default: return state;
    }
  }

  function HistoryDemo() {
    var r = useReducer(reducer, initial), state = r[0], dispatch = r[1];
    return e('div', { className: 'card' },
      e('div', { className: 'swatch', style: { background: state.present } }),
      e('div', { className: 'swatchRow' },
        COLORS.map(function (c) {
          return e('button', { key: c, className: 'swBtn', style: { background: c }, onClick: function () { dispatch({ type: 'set', color: c }); } });
        })
      ),
      e('div', { className: 'btnRow' },
        e('button', { className: 'actBtn', disabled: state.past.length === 0, onClick: function () { dispatch({ type: 'undo' }); } }, 'Undo'),
        e('button', { className: 'actBtn', disabled: state.future.length === 0, onClick: function () { dispatch({ type: 'redo' }); } }, 'Redo')
      ),
      e('div', { className: 'stacks' }, 'past: ', state.past.length, '  ·  future: ', state.future.length)
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(e(HistoryDemo));
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
