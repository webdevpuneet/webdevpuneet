<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="One Reducer, One Cart">

<script type="text/plain" id="cdn">
https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js
https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>One Reducer, One Cart</h1>
    <p class="hint">Add items, bump quantities, remove a line — every update to this nested array runs through one function, so the "how do I update an array of objects immutably" logic exists exactly once.</p>
  </header>
  <main class="stageWrap">
    <div id="root"></div>
  </main>
</script>

<script type="text/plain" id="css">
  :root {
    --ink: #14161c;
    --sub: #6b7080;
    --line: #e3e5ea;
    --accent: #6366f1;
  }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 18px 16px 26px; }

  .card { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 420px; padding: 18px; border: 1.5px dashed var(--line); border-radius: 12px; background: #fff; box-sizing: border-box; }
  .catalog { display: flex; flex-wrap: wrap; gap: 6px; }
  .addBtn { padding: 6px 11px; font: 700 11.5px system-ui, sans-serif; color: var(--accent); background: #eef0ff; border: 1px solid #cfd3ff; border-radius: 7px; cursor: pointer; }
  .addBtn:hover { background: #e0e3ff; }

  .lines { display: flex; flex-direction: column; gap: 6px; min-height: 40px; }
  .empty { font: 12px system-ui, sans-serif; color: var(--sub); text-align: center; padding: 10px; }
  .line { display: flex; align-items: center; gap: 8px; padding: 7px 10px; background: #f6f7f9; border-radius: 8px; }
  .line .lName { flex: 1; font: 12.5px system-ui, sans-serif; }
  .qtyBtn { width: 22px; height: 22px; border-radius: 6px; border: none; background: #eceef3; cursor: pointer; font: 700 12px sans-serif; }
  .qty { min-width: 18px; text-align: center; font: 700 12px ui-monospace, monospace; }
  .rmBtn { border: none; background: none; color: #ef4444; cursor: pointer; font: 700 11px system-ui, sans-serif; }

  .total { display: flex; justify-content: space-between; font: 700 13px system-ui, sans-serif; padding-top: 8px; border-top: 1px solid var(--line); }
</script>

<script type="text/plain" id="js">
  var e = React.createElement;
  var useReducer = React.useReducer;

  var CATALOG = [
    { id: 'p1', name: 'Notebook', price: 4 },
    { id: 'p2', name: 'Pen Set', price: 7 },
    { id: 'p3', name: 'Sticky Notes', price: 3 }
  ];

  function reducer(items, action) {
    switch (action.type) {
      case 'add': {
        var existing = items.find(function (i) { return i.id === action.id; });
        if (existing) {
          return items.map(function (i) { return i.id === action.id ? Object.assign({}, i, { qty: i.qty + 1 }) : i; });
        }
        var product = CATALOG.find(function (p) { return p.id === action.id; });
        return items.concat([{ id: product.id, name: product.name, price: product.price, qty: 1 }]);
      }
      case 'changeQty': {
        return items
          .map(function (i) { return i.id === action.id ? Object.assign({}, i, { qty: i.qty + action.delta }) : i; })
          .filter(function (i) { return i.qty > 0; });
      }
      case 'remove':
        return items.filter(function (i) { return i.id !== action.id; });
      default:
        return items;
    }
  }

  function Cart() {
    var r = useReducer(reducer, []), items = r[0], dispatch = r[1];
    var total = items.reduce(function (sum, i) { return sum + i.price * i.qty; }, 0);

    return e('div', { className: 'card' },
      e('div', { className: 'catalog' },
        CATALOG.map(function (p) {
          return e('button', { key: p.id, className: 'addBtn', onClick: function () { dispatch({ type: 'add', id: p.id }); } }, '+ ' + p.name + ' ($' + p.price + ')');
        })
      ),
      e('div', { className: 'lines' },
        items.length === 0
          ? e('div', { className: 'empty' }, 'Cart is empty — add something above')
          : items.map(function (i) {
              return e('div', { className: 'line', key: i.id },
                e('span', { className: 'lName' }, i.name),
                e('button', { className: 'qtyBtn', onClick: function () { dispatch({ type: 'changeQty', id: i.id, delta: -1 }); } }, '−'),
                e('span', { className: 'qty' }, i.qty),
                e('button', { className: 'qtyBtn', onClick: function () { dispatch({ type: 'changeQty', id: i.id, delta: 1 }); } }, '+'),
                e('button', { className: 'rmBtn', onClick: function () { dispatch({ type: 'remove', id: i.id }); } }, 'Remove')
              );
            })
      ),
      e('div', { className: 'total' }, e('span', null, 'Total'), e('span', null, '$' + total))
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(e(Cart));
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
