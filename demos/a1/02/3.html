<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="&quot;Contains a Badge&quot; List Row">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
      <h1>"Contains a Badge" List Row</h1>
      <p class="hint">Click a row to mark it read — its "NEW" badge is removed from the DOM, and the row’s own styling reacts to no longer containing one.</p>
    </header>
    <main class="stageWrap">
      <ul class="notifList" id="stage">
          <li class="notifRow"><span class="badge">NEW</span>Invoice #4021 was paid</li>
          <li class="notifRow"><span class="badge">NEW</span>Sara commented on your PR</li>
          <li class="notifRow">Weekly report is ready</li>
        </ul>
      <div class="readout">
        <span>Unread rows: <strong id="readoutValue">&mdash;</strong></span>
      </div>
      <pre class="ruleTag">.notifRow:has(.badge) {
    background: #eef0ff;
    font-weight: 700;
  }</pre>
    </main>
</script>

<script type="text/plain" id="css">

  :root {
    --ink: #14161c;
    --sub: #6b7080;
    --line: #e3e5ea;
    --accent: #6366f1;
  }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 14px 16px 26px; }
  .stage {
    width: 100%;
    max-width: 560px;
    box-sizing: border-box;
    padding: 26px 24px;
    border: 1.5px dashed var(--line);
    border-radius: 12px;
    background: #fff;
  }
  .readout {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px 16px;
    font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--sub);
  }
  .readout strong { color: var(--accent); font-weight: 700; }
  .ruleTag {
    font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #3f4252;
    background: #eceef3;
    padding: 6px 14px;
    border-radius: 10px;
    max-width: 100%;
    overflow-x: auto;
    white-space: pre;
  }

  .notifList { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .notifRow {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 13px;
    color: var(--sub);
    cursor: pointer;
    transition: background .15s;
  }
  .badge {
    font: 700 9px ui-monospace, monospace;
    letter-spacing: 0.05em;
    color: #fff;
    background: var(--accent);
    padding: 2px 6px;
    border-radius: 20px;
  }

  /* The rule this demo is about. */
  .notifRow:has(.badge) {
    background: #eef0ff;
    color: var(--ink);
    font-weight: 700;
  }
</script>

<script type="text/plain" id="js">
  var stage = document.getElementById('stage');
    var out = document.getElementById('readoutValue');
    function report() {
      out.textContent = stage.querySelectorAll('.notifRow:has(.badge)').length;
    }
    stage.addEventListener('click', function (e) {
      var row = e.target.closest('.notifRow');
      if (!row) return;
      var badge = row.querySelector('.badge');
      if (badge) badge.remove();
      report();
    });
    report();
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
