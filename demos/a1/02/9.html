<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Empty-State Message">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
      <h1>Empty-State Message</h1>
      <p class="hint">Clear every task — the "you’re all caught up" message appears the instant the list has no tasks left, and disappears the moment you add one back.</p>
    </header>
    <main class="stageWrap">
      <div class="taskWrap" id="stage">
          <ul class="taskList">
            <li>Write the release notes <button class="doneBtn" type="button">&times;</button></li>
            <li>Reply to support tickets <button class="doneBtn" type="button">&times;</button></li>
          </ul>
          <p class="emptyMsg">You're all caught up &mdash; nothing left to do.</p>
          <button type="button" id="addTask" class="addTaskBtn">+ Add a task</button>
        </div>
      <div class="readout">
        <span>Tasks left: <strong id="readoutValue">&mdash;</strong></span>
      </div>
      <pre class="ruleTag">.taskList:not(:has(li)) + .emptyMsg {
    display: block;
  }</pre>
    </main>
</script>

<script type="text/plain" id="css">

  :root {
    --ink: #14161c;
    --sub: #6b7080;
    --line: #e3e5ea;
    --accent: #6366f1;
  }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 14px 16px 26px; }
  .stage {
    width: 100%;
    max-width: 560px;
    box-sizing: border-box;
    padding: 26px 24px;
    border: 1.5px dashed var(--line);
    border-radius: 12px;
    background: #fff;
  }
  .readout {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px 16px;
    font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--sub);
  }
  .readout strong { color: var(--accent); font-weight: 700; }
  .ruleTag {
    font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #3f4252;
    background: #eceef3;
    padding: 6px 14px;
    border-radius: 10px;
    max-width: 100%;
    overflow-x: auto;
    white-space: pre;
  }

  .taskList { list-style: none; margin: 0 0 10px; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .taskList li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 13px;
  }
  .doneBtn {
    width: 20px; height: 20px;
    border: none;
    border-radius: 50%;
    background: #eceef3;
    color: var(--sub);
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
  }
  .doneBtn:hover { background: #fee2e2; color: #dc2626; }
  .emptyMsg {
    display: none;
    margin: 0 0 10px;
    padding: 14px;
    text-align: center;
    font-size: 12.5px;
    color: #16a34a;
    background: #f0fdf4;
    border-radius: 8px;
  }
  .addTaskBtn {
    font: 700 12px system-ui, sans-serif;
    padding: 7px 14px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: #fff;
    cursor: pointer;
  }

  /* The rule this demo is about. :not(:has(li)) treats a list with only
     whitespace text nodes as empty too, which a plain :empty check would not
     — and this has to be a sibling selector, not a second :has() wrapping
     this one: CSS explicitly disallows nesting :has() inside :has(), even
     through a :not(). A plain adjacent-sibling combinator sidesteps that. */
  .taskList:not(:has(li)) + .emptyMsg { display: block; }
</script>

<script type="text/plain" id="js">
  var stage = document.getElementById('stage');
    var list = stage.querySelector('.taskList');
    var addBtn = document.getElementById('addTask');
    var out = document.getElementById('readoutValue');
    var n = 0;
    function report() { out.textContent = list.children.length; }
    stage.addEventListener('click', function (e) {
      if (e.target.classList.contains('doneBtn')) {
        e.target.closest('li').remove();
        report();
      }
    });
    addBtn.addEventListener('click', function () {
      n++;
      var li = document.createElement('li');
      li.innerHTML = 'New task ' + n + ' <button class="doneBtn" type="button">&times;</button>';
      list.appendChild(li);
      report();
    });
    report();
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
