<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Quantity-Aware Grid (Quantity Query)">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
      <h1>Quantity-Aware Grid (Quantity Query)</h1>
      <p class="hint">Add tiles one at a time — once the grid holds 6 or more, it switches itself to a denser 3-column layout. No JavaScript sets that layout; only CSS counts.</p>
    </header>
    <main class="stageWrap">
      <div class="qControls">
          <button type="button" id="addTile">+ Add tile</button>
          <button type="button" id="removeTile">&minus; Remove tile</button>
        </div>
        <div class="qGrid" id="stage">
          <div class="qTile"></div>
          <div class="qTile"></div>
          <div class="qTile"></div>
        </div>
      <div class="readout">
        <span>Tile count: <strong id="readoutValue">&mdash;</strong></span>
      </div>
      <pre class="ruleTag">.qGrid:has(> .qTile:nth-child(6)) {
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }</pre>
    </main>
</script>

<script type="text/plain" id="css">

  :root {
    --ink: #14161c;
    --sub: #6b7080;
    --line: #e3e5ea;
    --accent: #6366f1;
  }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 14px 16px 26px; }
  .stage {
    width: 100%;
    max-width: 560px;
    box-sizing: border-box;
    padding: 26px 24px;
    border: 1.5px dashed var(--line);
    border-radius: 12px;
    background: #fff;
  }
  .readout {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px 16px;
    font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--sub);
  }
  .readout strong { color: var(--accent); font-weight: 700; }
  .ruleTag {
    font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #3f4252;
    background: #eceef3;
    padding: 6px 14px;
    border-radius: 10px;
    max-width: 100%;
    overflow-x: auto;
    white-space: pre;
  }

  .qControls { display: flex; gap: 8px; margin-bottom: 14px; justify-content: center; }
  .qControls button {
    font: 700 12px system-ui, sans-serif;
    padding: 6px 14px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: #fff;
    cursor: pointer;
  }
  .qControls button:hover { border-color: var(--accent); color: var(--accent); }
  .qGrid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    transition: gap .2s;
  }
  .qTile {
    aspect-ratio: 1;
    border-radius: 8px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
  }

  /* The rule this demo is about — a "quantity query": style a container
     based on how many children it has, using an nth-child existence check
     as a stand-in for a count. */
  .qGrid:has(> .qTile:nth-child(6)) {
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
</script>

<script type="text/plain" id="js">
  var stage = document.getElementById('stage');
    var out = document.getElementById('readoutValue');
    var addBtn = document.getElementById('addTile');
    var removeBtn = document.getElementById('removeTile');
    function report() {
      var n = stage.children.length;
      out.textContent = n + (n >= 6 ? ' (compact layout)' : ' (normal layout)');
    }
    addBtn.addEventListener('click', function () {
      if (stage.children.length >= 12) return;
      var t = document.createElement('div');
      t.className = 'qTile';
      stage.appendChild(t);
      report();
    });
    removeBtn.addEventListener('click', function () {
      if (stage.children.length <= 1) return;
      stage.removeChild(stage.lastElementChild);
      report();
    });
    report();
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
