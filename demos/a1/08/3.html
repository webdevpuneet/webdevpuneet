<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="type=&quot;url&quot;">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>type="url"</h1>
    <p class="hint">Type "example" with no protocol and submit &mdash; the browser blocks it. Type "https://example.com" and it passes. A URL needs a scheme to be valid, not just a domain-looking string.</p>
  </header>
  <main class="stageWrap">
    <form class="urlForm" action="#" method="get" onsubmit="return false">
      <label class="field">
        <span class="fieldLabel">Portfolio website</span>
        <input type="url" name="site" required placeholder="https://…">
      </label>
      <button type="submit" class="submitBtn">Save</button>
    </form>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; --ok: #16a34a; --err: #dc2626; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 48em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; justify-content: center; padding: 16px 16px 32px; }

  .urlForm {
    width: 100%;
    max-width: 320px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 14px;
    padding: 20px;
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .fieldLabel { font: 700 12px system-ui, sans-serif; }

  .urlForm input {
    padding: 10px 12px;
    font: 500 14px system-ui, sans-serif;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    outline: none;
  }
  .urlForm input:focus { border-color: var(--accent); }
  .urlForm input:not(:placeholder-shown):invalid { border-color: var(--err); background: #fef2f2; }
  .urlForm input:not(:placeholder-shown):valid { border-color: var(--ok); background: #f0fdf4; }

  .submitBtn {
    padding: 11px 16px;
    font: 700 13px system-ui, sans-serif;
    border: none;
    border-radius: 9px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  .submitBtn:hover { background: #4f52d9; }
</script>

<script type="text/plain" id="js">
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
