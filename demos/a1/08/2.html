<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="type=&quot;tel&quot;">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>type="tel"</h1>
    <p class="hint">On a phone this opens the numeric phone keypad, not the full alphabet keyboard. Unlike email or url, the browser enforces zero format on its own &mdash; that's what the <code>pattern</code> below is doing.</p>
  </header>
  <main class="stageWrap">
    <form class="telForm" action="#" method="get" onsubmit="return false">
      <label class="field">
        <span class="fieldLabel">Phone number</span>
        <input
          type="tel"
          name="phone"
          required
          pattern="[0-9\-\+\s\(\)]{7,}"
          title="At least 7 digits — spaces, dashes and parentheses are fine"
          placeholder=" ">
        <span class="fieldHelp">No built-in format check for <code>tel</code> &mdash; phone formats vary too much by country, so a <code>pattern</code> is doing the actual work here</span>
      </label>
      <button type="submit" class="submitBtn">Continue</button>
    </form>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; --ok: #16a34a; --err: #dc2626; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; }
  .bar h1 code { font: 700 15px ui-monospace, monospace; }
  .hint { margin: 0 auto; max-width: 48em; font-size: 12.5px; color: var(--sub); }
  .hint code { background: #eceef3; padding: 1px 5px; border-radius: 4px; }
  .stageWrap { display: flex; justify-content: center; padding: 16px 16px 32px; }

  .telForm {
    width: 100%;
    max-width: 320px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 14px;
    padding: 20px;
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .fieldLabel { font: 700 12px system-ui, sans-serif; }
  .fieldHelp { font-size: 11px; color: var(--sub); line-height: 1.5; }
  .fieldHelp code { background: #eceef3; padding: 1px 5px; border-radius: 4px; }

  .telForm input {
    padding: 10px 12px;
    font: 500 14px system-ui, sans-serif;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    outline: none;
  }
  .telForm input:focus { border-color: var(--accent); }
  .telForm input:not(:placeholder-shown):invalid { border-color: var(--err); background: #fef2f2; }
  .telForm input:not(:placeholder-shown):valid { border-color: var(--ok); background: #f0fdf4; }

  .submitBtn {
    padding: 11px 16px;
    font: 700 13px system-ui, sans-serif;
    border: none;
    border-radius: 9px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  .submitBtn:hover { background: #4f52d9; }
</script>

<script type="text/plain" id="js">
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
