<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="type=&quot;password&quot; with a show/hide toggle">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>type="password"</h1>
    <p class="hint">Click the eye icon to toggle the field between masked and plain text &mdash; that swap is done in script by changing the <code>type</code> attribute itself; there's no dedicated "reveal" mode built into the input.</p>
  </header>
  <main class="stageWrap">
    <form class="pwForm">
      <label class="field">
        <span class="fieldLabel">Password</span>
        <div class="inputWrap">
          <input type="password" name="password" autocomplete="new-password" placeholder=" " id="pwInput">
          <button type="button" class="toggleBtn" id="toggleBtn" aria-label="Show password">👁</button>
        </div>
        <span class="fieldHelp"><code>autocomplete="new-password"</code> stops the browser suggesting a saved login password for a signup field</span>
      </label>
    </form>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 48em; font-size: 12.5px; color: var(--sub); }
  .hint code { background: #eceef3; padding: 1px 5px; border-radius: 4px; }
  .stageWrap { display: flex; justify-content: center; padding: 20px 16px 36px; }

  .pwForm {
    width: 100%;
    max-width: 320px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 14px;
    padding: 22px 20px;
  }
  .field { display: flex; flex-direction: column; gap: 8px; }
  .fieldLabel { font: 700 12px system-ui, sans-serif; }
  .fieldHelp { font-size: 11px; color: var(--sub); line-height: 1.5; }
  .fieldHelp code { background: #eceef3; padding: 1px 5px; border-radius: 4px; }

  .inputWrap { position: relative; }
  .pwForm input {
    width: 100%;
    box-sizing: border-box;
    padding: 10px 40px 10px 12px;
    font: 500 14px system-ui, sans-serif;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    outline: none;
  }
  .pwForm input:focus { border-color: var(--accent); }

  .toggleBtn {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: none;
    font-size: 15px;
    cursor: pointer;
    border-radius: 6px;
    opacity: 0.55;
  }
  .toggleBtn:hover { opacity: 1; background: #eceef3; }
</script>

<script type="text/plain" id="js">
  var input = document.getElementById('pwInput');
  var toggle = document.getElementById('toggleBtn');
  toggle.addEventListener('click', function () {
    var isPassword = input.type === 'password';
    input.type = isPassword ? 'text' : 'password';
    toggle.textContent = isPassword ? '🙈' : '👁';
    toggle.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
  });
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
