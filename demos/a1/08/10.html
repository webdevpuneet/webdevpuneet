<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="type=&quot;month&quot; and type=&quot;week&quot;">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>type="month" &amp; type="week"</h1>
    <p class="hint">Two narrower siblings of <code>date</code> &mdash; pick just a month with no day, or just a week number. Both are genuinely hard to build correctly by hand and free once you know they exist.</p>
  </header>
  <main class="stageWrap">
    <form class="myForm">
      <label class="field">
        <span class="fieldLabel">Billing month</span>
        <input type="month" name="month" id="monthInput">
        <span class="readoutSmall" id="monthReadout">No month selected yet</span>
      </label>
      <label class="field">
        <span class="fieldLabel">Report week</span>
        <input type="week" name="week" id="weekInput">
        <span class="readoutSmall" id="weekReadout">No week selected yet</span>
      </label>
    </form>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; }
  .bar h1 code { font: 700 15px ui-monospace, monospace; }
  .hint { margin: 0 auto; max-width: 48em; font-size: 12.5px; color: var(--sub); }
  .hint code { background: #eceef3; padding: 1px 5px; border-radius: 4px; }
  .stageWrap { display: flex; justify-content: center; padding: 20px 16px 36px; }

  .myForm {
    width: 100%;
    max-width: 320px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 14px;
    padding: 22px 20px;
  }
  .field { display: flex; flex-direction: column; gap: 8px; }
  .fieldLabel { font: 700 12px system-ui, sans-serif; }

  .myForm input {
    width: 100%;
    box-sizing: border-box;
    padding: 10px 12px;
    font: 500 14px system-ui, sans-serif;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    outline: none;
  }
  .myForm input:focus { border-color: var(--accent); }

  .readoutSmall { font-size: 12px; color: var(--accent); font-weight: 700; }
</script>

<script type="text/plain" id="js">
  var monthInput = document.getElementById('monthInput');
  var monthReadout = document.getElementById('monthReadout');
  monthInput.addEventListener('input', function () {
    if (!monthInput.value) { monthReadout.textContent = 'No month selected yet'; return; }
    var parts = monthInput.value.split('-');
    var d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, 1);
    monthReadout.textContent = 'You picked: ' + d.toLocaleDateString(undefined, { year: 'numeric', month: 'long' });
  });

  var weekInput = document.getElementById('weekInput');
  var weekReadout = document.getElementById('weekReadout');
  weekInput.addEventListener('input', function () {
    if (!weekInput.value) { weekReadout.textContent = 'No week selected yet'; return; }
    var parts = weekInput.value.split('-W');
    weekReadout.textContent = 'You picked: week ' + parts[1] + ' of ' + parts[0];
  });
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
