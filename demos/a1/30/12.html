<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Submit Button Loading State">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Submit button loading state</h1>
    <p class="hint">Fill in the field (or leave it) and click "Submit" — the button disables and shows a spinner while the form fakes a network round trip.</p>
  </header>
  <main class="stageWrap">
    <form id="form" novalidate>
      <label class="fieldLabel" for="q">Quick question</label>
      <input class="field" type="text" id="q" placeholder="Type anything...">
      <button type="submit" class="submitBtn" id="submitBtn">
        <span id="btnLabel">Submit</span>
      </button>
    </form>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; --green: #16a34a; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; justify-content: center; padding: 40px 16px 28px; }

  form { width: 100%; max-width: 280px; }
  .fieldLabel { display: block; font: 700 12px system-ui, sans-serif; margin-bottom: 6px; }
  .field {
    width: 100%; padding: 10px 12px; border-radius: 8px;
    border: 1.5px solid var(--line); font: 14px system-ui, sans-serif; outline: none;
    box-sizing: border-box; margin-bottom: 14px;
  }
  .field:focus { border-color: var(--accent); }

  .submitBtn {
    width: 100%; min-width: 100%; padding: 11px; border-radius: 9px; border: none;
    background: var(--accent); color: #fff; font: 700 13.5px system-ui, sans-serif; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: background 0.2s ease;
  }
  .submitBtn:hover { background: #4f52d6; }
  .submitBtn:disabled { opacity: 0.85; cursor: default; }
  .submitBtn.done { background: var(--green); }

  .spinnerSm {
    width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</script>

<script type="text/plain" id="js">
  var form = document.getElementById('form');
  var submitBtn = document.getElementById('submitBtn');
  var btnLabel = document.getElementById('btnLabel');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (submitBtn.disabled) return; // guards against a rapid double-submit

    submitBtn.disabled = true;
    submitBtn.className = 'submitBtn';
    btnLabel.innerHTML = '<span class="spinnerSm"></span> Submitting…';

    setTimeout(function () {
      submitBtn.className = 'submitBtn done';
      btnLabel.textContent = '✓ Submitted';
      setTimeout(function () {
        submitBtn.disabled = false;
        submitBtn.className = 'submitBtn';
        btnLabel.textContent = 'Submit';
      }, 1400);
    }, 1500);
  });
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
