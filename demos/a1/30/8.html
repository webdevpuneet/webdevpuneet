<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Auto-Growing Textarea">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Auto-growing textarea</h1>
    <p class="hint">Type a few lines, then keep going past the visible edge — the box grows taller to fit instead of showing an inner scrollbar.</p>
  </header>
  <main class="stageWrap">
    <div class="panel">
      <label class="fieldLabel" for="note">Message</label>
      <textarea class="field" id="note" rows="1" placeholder="Start typing — this box grows with you..."></textarea>
    </div>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; justify-content: center; padding: 30px 16px 28px; }

  .panel { width: 100%; max-width: 340px; }
  .fieldLabel { display: block; font: 700 12px system-ui, sans-serif; margin-bottom: 6px; }
  .field {
    width: 100%; padding: 10px 12px; border-radius: 8px; resize: none;
    border: 1.5px solid var(--line); font: 14px/1.5 system-ui, sans-serif; outline: none;
    box-sizing: border-box; overflow: hidden; max-height: 220px;
    transition: border-color 0.15s ease, height 0.08s ease;
  }
  .field:focus { border-color: var(--accent); }
</script>

<script type="text/plain" id="js">
  var note = document.getElementById('note');

  function resize() {
    note.style.height = 'auto';
    note.style.height = Math.min(note.scrollHeight, 220) + 'px';
  }

  note.addEventListener('input', resize);
  resize();
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
