<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Card Number Input Masking">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Card number input masking</h1>
    <p class="hint">Type digits into the field — they're auto-grouped into 4-digit blocks as you type, the way a real card number reads.</p>
  </header>
  <main class="stageWrap">
    <div class="panel">
      <label class="fieldLabel" for="card">Card number</label>
      <input class="field" type="text" id="card" placeholder="0000 0000 0000 0000" inputmode="numeric" autocomplete="off">
    </div>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; justify-content: center; padding: 44px 16px 28px; }

  .panel { width: 100%; max-width: 300px; }
  .fieldLabel { display: block; font: 700 12px system-ui, sans-serif; margin-bottom: 6px; }
  .field {
    width: 100%; padding: 11px 12px; border-radius: 8px;
    border: 1.5px solid var(--line); font: 16px ui-monospace, monospace; letter-spacing: 0.04em;
    outline: none; box-sizing: border-box;
  }
  .field:focus { border-color: var(--accent); }
</script>

<script type="text/plain" id="js">
  var card = document.getElementById('card');

  function formatCard(raw) {
    var digits = raw.replace(/\D/g, '').slice(0, 16);
    var groups = [];
    for (var i = 0; i < digits.length; i += 4) groups.push(digits.slice(i, i + 4));
    return groups.join(' ');
  }

  card.addEventListener('input', function () {
    // Keep the cursor pinned to the end -- simple and predictable for a
    // demo; production masks track exact caret position through re-grouping.
    var atEnd = card.selectionStart === card.value.length;
    card.value = formatCard(card.value);
    if (atEnd) card.setSelectionRange(card.value.length, card.value.length);
  });
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
