<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Index-as-Key Plus an Insert at the Front">

<script type="text/plain" id="cdn">
https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js
https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Index-as-key + insert at the front</h1>
    <p class="hint">Type something into one of the inputs, then click "Insert new item at top." Watch what you typed jump to a different row.</p>
  </header>
  <main class="stageWrap">
    <div id="root"></div>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; --green: #16a34a; --red: #dc2626; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 18px 16px 28px; }
  .frame { width: 100%; max-width: 480px; background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 16px; text-align: center; }
  .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 10px; }
  .btn { padding: 8px 12px; border-radius: 8px; border: none; background: var(--accent); color: #fff; font: 700 12.5px system-ui, sans-serif; cursor: pointer; }
  .btn:hover { background: #4f52d6; }
  .btn.ghost { background: #fff; color: var(--ink); border: 1.5px solid var(--line); }
  .note { margin: 8px 0 0; font-size: 11px; color: var(--sub); line-height: 1.5; text-align: left; }
  .item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 1.5px solid var(--line); border-radius: 8px; margin-bottom: 6px; background: #f9f9fb; }
  .item .label { font: 700 12px ui-monospace, monospace; width: 90px; text-align: left; color: var(--accent); }
  .item input { font: 600 12px ui-monospace, monospace; padding: 6px 8px; border-radius: 6px; border: 1.5px solid var(--line); flex: 1; }
  code { background: #eceef3; padding: 1px 5px; border-radius: 4px; font-size: 11px; }
</script>

<script type="text/plain" id="js">
  var e = React.createElement;
  var useState = React.useState;

  var nextId = 100;

  function Row(props) {
    // uncontrolled input -- React never touches its value after mount,
    // the DOM node itself owns whatever the user typed
    return e('div', { className: 'item' },
      e('span', { className: 'label' }, props.item.label),
      e('input', { defaultValue: '', placeholder: 'type here → ' + props.item.label })
    );
  }

  function Demo() {
    var itemsState = useState([
      { id: 1, label: 'Item A' },
      { id: 2, label: 'Item B' },
      { id: 3, label: 'Item C' }
    ]);
    var items = itemsState[0];
    var setItems = itemsState[1];

    function insertAtTop() {
      var fresh = { id: nextId++, label: 'NEW' };
      setItems([fresh].concat(items));
    }

    return e('div', { className: 'frame' },
      e('div', { className: 'row' },
        e('button', { className: 'btn', onClick: insertAtTop }, 'Insert new item at top')
      ),
      items.map(function (item, i) {
        // BROKEN: key is the array index, not the item's identity
        return e(Row, { key: i, item: item });
      }),
      e('p', { className: 'note' }, 'Every row is keyed by its position (0, 1, 2…), not by the item it holds. When a new item is unshifted onto the front, index 0 still means "the first row" to React — so the row that used to be Item A silently becomes NEW, keeping whatever you typed into the old index-0 input. The label text updates, the input\'s typed value does not: they\'ve come unglued.')
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(e(Demo));
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
