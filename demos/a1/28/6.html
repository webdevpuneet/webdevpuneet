<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Index-as-Key Is Fine When the List Only Ever Appends">

<script type="text/plain" id="cdn">
https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js
https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Index-as-key is fine when the list only ever appends</h1>
    <p class="hint">Type into a couple of the inputs, then click "Add item to end" repeatedly. Nothing you typed moves or gets misattached.</p>
  </header>
  <main class="stageWrap">
    <div id="root"></div>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; --green: #16a34a; --red: #dc2626; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 18px 16px 28px; }
  .frame { width: 100%; max-width: 480px; background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 16px; text-align: center; }
  .row { margin-bottom: 10px; }
  .btn { padding: 8px 12px; border-radius: 8px; border: none; background: var(--accent); color: #fff; font: 700 12.5px system-ui, sans-serif; cursor: pointer; }
  .btn:hover { background: #4f52d6; }
  .item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 1.5px solid var(--line); border-radius: 8px; margin-bottom: 6px; background: #f9f9fb; }
  .item .label { font: 700 12px ui-monospace, monospace; width: 90px; text-align: left; color: var(--green); }
  .item input { font: 600 12px ui-monospace, monospace; padding: 6px 8px; border-radius: 6px; border: 1.5px solid var(--line); flex: 1; }
  .note { margin: 8px 0 0; font-size: 11px; color: var(--sub); line-height: 1.5; text-align: left; }
  .stat { font: 700 11.5px ui-monospace, monospace; color: var(--sub); margin-bottom: 8px; }
</script>

<script type="text/plain" id="js">
  var e = React.createElement;
  var useState = React.useState;
  var useEffect = React.useEffect;

  var totalMountsCounter = { current: 0 };

  function Row(props) {
    useEffect(function () {
      totalMountsCounter.current += 1;
      props.onMount(totalMountsCounter.current);
    }, []);
    return e('div', { className: 'item' },
      e('span', { className: 'label' }, props.label),
      e('input', { defaultValue: '', placeholder: 'type here → ' + props.label })
    );
  }

  function Demo() {
    var labelsState = useState(['Log line #1', 'Log line #2', 'Log line #3']);
    var labels = labelsState[0];
    var setLabels = labelsState[1];

    var mountsState = useState(0);
    var mounts = mountsState[0];
    var setMounts = mountsState[1];

    function append() {
      setLabels(labels.concat(['Log line #' + (labels.length + 1)]));
    }

    return e('div', { className: 'frame' },
      e('div', { className: 'row' },
        e('button', { className: 'btn', onClick: append }, 'Add item to end')
      ),
      e('div', { className: 'stat' }, 'row components mounted so far: ' + mounts),
      labels.map(function (label, i) {
        // key={i} here, on purpose -- this list ONLY ever appends to the
        // end, it never inserts, removes, or reorders existing entries.
        return e(Row, { key: i, label: label, onMount: setMounts });
      }),
      e('p', { className: 'note' }, 'This list never inserts before an existing row, never removes one, and never reorders — it only appends. Every existing item\'s index stays exactly what it always was, so key={i} keeps pointing at the same underlying entry forever. Appending a new item just adds one new key (3, then 4, then 5…) at the end without shifting anything that came before it, which is why the earlier rows’ mount count never moves and your typed text never jumps rows. This is the case the "never use index as key" advice overcorrects for — it’s specifically inserts/removes/reorders in the middle that break index keys, not indexing itself.')
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(e(Demo));
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
