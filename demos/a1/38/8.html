<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Gradient Generator — Hard Stops and Repeating Patterns">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
<main class="stage">
  <h1>Stripes, pie charts and ripples — no images</h1>
  <div class="tiles">
    <figure><div class="tile candy"></div><figcaption>Candy stripes<br><span>repeating + hard stops</span></figcaption></figure>
    <figure><div class="tile pie"></div><figcaption>Pie chart<br><span>conic + hard stops</span></figcaption></figure>
    <figure><div class="tile ripples"></div><figcaption>Ripples<br><span>repeating radial</span></figcaption></figure>
  </div>
</main>
</script>

<script type="text/plain" id="css">
* { box-sizing: border-box; }
body { margin: 0; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
body { background: #f8fafc; color: #0f172a; }
.stage { min-height: 100vh; padding: 22px 16px; display: grid; align-content: center; gap: 16px; max-width: 720px; margin: 0 auto; }
h1 { margin: 0; font-size: 17px; text-align: center; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
figure { margin: 0; display: grid; gap: 8px; }
.tile { aspect-ratio: 1; border-radius: 12px; }
figcaption { font-size: 12.5px; font-weight: 700; text-align: center; line-height: 1.4; }
figcaption span { font-weight: 500; color: #64748b; font-size: 12px; }

.candy {
  background: repeating-linear-gradient(45deg, #f472b6 0px, #f472b6 20px, #fbcfe8 20px, #fbcfe8 40px);
}

.pie {
  border-radius: 50%;
  background: conic-gradient(from 0deg at 50% 50%, #3b82f6 0%, #3b82f6 40%, #22c55e 40%, #22c55e 65%, #f59e0b 65%, #f59e0b 85%, #ef4444 85%, #ef4444 100%);
}

.ripples {
  background: repeating-radial-gradient(circle at 50% 50%, #0ea5e9 0px, #38bdf8 18px, #0ea5e9 36px);
}
</script>

<script type="text/plain" id="js">

</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
