<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Gradient Generator — Rainbow with OKLCH Long Hue">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
<section class="rainbow">
  <div class="pill">
    <strong>Two nearly identical reds</strong>
    <span>blended with <code>in oklch longer hue</code></span>
  </div>
</section>
</script>

<script type="text/plain" id="css">
* { box-sizing: border-box; }
body { margin: 0; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }

.rainbow {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 20px;
  /* sRGB fallback for browsers without CSS color-space interpolation */
  background: linear-gradient(90deg, #ff4d6d 0%, #ff5e4d 100%);
  background: linear-gradient(in oklch longer hue 90deg, #ff4d6d 0%, #ff5e4d 100%);
}
.pill {
  display: grid;
  gap: 4px;
  padding: 16px 24px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.92);
  color: #0f172a;
  text-align: center;
  font-size: 14px;
  box-shadow: 0 8px 30px rgba(15, 23, 42, 0.18);
}
.pill strong { font-size: 17px; }
code { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: #6d28d9; }
</script>

<script type="text/plain" id="js">

</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
