<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Re-Opening the Same Layer">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Re-opening the same named layer</h1>
    <p class="hint">The "base" layer is opened, closed, and then opened again LATER in the file &mdash; physically after the "utilities" layer. The readout shows base still loses to utilities, proving a named layer keeps one fixed position no matter how many times you re-open it.</p>
  </header>
  <main class="stageWrap">
    <article class="card">
      <p class="target" id="target">Sample text</p>
    </article>
    <p class="note" id="note">Computing...</p>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 54em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 30px 18px 34px; }

  .card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 24px 30px;
  }

  /* base's position in the layer order is fixed right here, first time
     it's mentioned -- even though it's about to be reopened below. */
  @layer base {
    .target {
      color: #16a34a;
      font-weight: 800;
    }
  }

  @layer utilities {
    .target {
      color: #dc2626;
      font-weight: 800;
    }
  }

  /* Reopening "base" here, physically AFTER "utilities" in the source,
     does NOT move base to a later position. It's still the same layer,
     still ranked before "utilities". This rule only adds a declaration
     to the layer base already occupies. */
  @layer base {
    .target {
      text-decoration: underline;
    }
  }

  .note { margin: 0; max-width: 54em; font-size: 12.5px; color: var(--sub); text-align: center; }
  .note strong { color: var(--ink); }
</script>

<script type="text/plain" id="js">
  var target = document.getElementById('target');
  var note = document.getElementById('note');
  var style = getComputedStyle(target);
  var color = style.color;
  var underlined = style.textDecorationLine.indexOf('underline') !== -1;
  var isUtilities = color === 'rgb(220, 38, 38)';

  note.innerHTML = (isUtilities
    ? 'Computed color: <strong>red</strong> (the "utilities" layer) &mdash; even though a third block reopened "base" later in the file, "base" never moved. It kept the position it was assigned the first time it was mentioned.'
    : 'Computed color: <strong>green</strong>. (Unexpected &mdash; reopening base should not have changed its layer order.)')
    + (underlined ? ' The underline, though, DID apply &mdash; the reopened block still adds declarations to the same base layer, it just can\'t reorder it.' : '');
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
