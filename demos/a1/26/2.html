<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Unlayered Styles Always Win">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Unlayered styles always win</h1>
    <p class="hint">The paragraph below is matched by a high-specificity rule inside a layer, and a single-class rule that was never assigned to any layer. The readout shows which one wins.</p>
  </header>
  <main class="stageWrap">
    <article class="card">
      <p class="target" id="target">Which rule wins?</p>
    </article>
    <p class="note" id="note">Computing...</p>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 50em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 30px 18px 34px; }

  .card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 24px 30px;
  }

  /* Inside a layer, and deliberately over-specific: three chained class
     selectors, specificity (0,3,0). */
  @layer base {
    .target.target.target {
      color: #16a34a;
      font-weight: 800;
    }
  }

  /* Never assigned to any layer at all. Specificity (0,1,0) -- far lower
     than the rule above -- and it still wins every time. */
  .target {
    color: #6b7080;
    font-weight: 800;
  }

  .note { margin: 0; max-width: 50em; font-size: 12.5px; color: var(--sub); text-align: center; }
  .note strong { color: var(--ink); }
</script>

<script type="text/plain" id="js">
  var target = document.getElementById('target');
  var note = document.getElementById('note');
  var color = getComputedStyle(target).color;
  var isUnlayered = color === 'rgb(107, 112, 128)';

  note.innerHTML = isUnlayered
    ? 'Computed color: <strong>grey</strong> (the unlayered rule). Its selector is just <strong>.target</strong> (specificity 0-1-0) &mdash; three times less specific than the layered <strong>.target.target.target</strong> (0-3-0) inside @layer base. It still won, because unlayered author styles are treated as sitting in one implicit final layer that outranks every named layer, regardless of specificity.'
    : 'Computed color: <strong>green</strong>. (Unexpected in a spec-compliant browser &mdash; the unlayered rule should have won.)';
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
