<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="A Plain Function Prop Breaks React.memo">

<script type="text/plain" id="cdn">
https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js
https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>A plain function prop breaks React.memo</h1>
    <p class="hint">Click "Unrelated tick" a few times. Neither child's actual content changes -- watch which one re-renders anyway.</p>
  </header>
  <main class="stageWrap">
    <div id="root"></div>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; --green: #16a34a; --red: #dc2626; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 17px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 18px 16px 28px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%; max-width: 480px; }
  .col { background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 14px; text-align: center; }
  .colTitle { margin: 0 0 8px; font: 700 12px ui-monospace, monospace; padding: 5px 8px; border-radius: 6px; }
  .colTitle.bad { color: var(--red); background: #fdeaea; }
  .colTitle.good { color: var(--green); background: #e8f7ee; }
  .stat { font: 800 26px ui-monospace, monospace; margin-bottom: 8px; }
  .note { margin: 8px 0; font-size: 11px; color: var(--sub); line-height: 1.5; }
  .btn { padding: 7px 13px; border-radius: 8px; border: none; background: var(--accent); color: #fff; font: 700 12px system-ui, sans-serif; cursor: pointer; }
  .btn:hover { background: #4f52d6; }
  .btn.ghost { padding: 9px 18px; background: #fff; color: var(--ink); border: 1.5px solid var(--line); font: 700 13px system-ui, sans-serif; }
  code { background: #eceef3; padding: 1px 5px; border-radius: 4px; font-size: 11px; }
</script>

<script type="text/plain" id="js">
  var e = React.createElement;
  var useState = React.useState;
  var useCallback = React.useCallback;
  var useRef = React.useRef;
  var memo = React.memo;

  // Child is wrapped in React.memo, so it should only re-render when its own
  // props actually change (compared with Object.is, one key at a time).
  var Child = memo(function Child(props) {
    var rendersRef = useRef(0);
    rendersRef.current += 1;

    return e('div', { className: 'col' },
      e('h2', { className: 'colTitle ' + props.tone }, props.label),
      e('div', { className: 'stat' }, rendersRef.current),
      e('button', { className: 'btn', onClick: props.onAction }, 'Log click'),
      e('p', { className: 'note' }, 'Child render count -- goes up only if React.memo decided this child needed to re-render.')
    );
  });

  function Demo() {
    var tickState = useState(0);
    var tick = tickState[0];
    var setTick = tickState[1];

    // BROKEN: a new function expression is created on this line every single
    // render. It behaves identically, but it is never === to the previous
    // render's function -- so from React.memo's point of view, this prop
    // changed, every time.
    function handleClickBad() {
      // no-op, just something to pass down
    }

    // FIXED: useCallback with an empty dependency array returns the SAME
    // function reference across every render, so React.memo's shallow
    // compare sees "unchanged" and skips re-rendering the child entirely.
    var handleClickGood = useCallback(function () {
      // no-op, just something to pass down
    }, []);

    return e(React.Fragment, null,
      e('div', { className: 'cols' },
        e(Child, { tone: 'bad', label: 'Inline function', onAction: handleClickBad }),
        e(Child, { tone: 'good', label: 'useCallback', onAction: handleClickGood })
      ),
      e('button', { className: 'btn ghost', onClick: function () { setTick(tick + 1); } }, 'Unrelated tick (' + tick + ')')
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(e(Demo));
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
