<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="useMemo Skips a Recalculation vs Redoing It Every Render">

<script type="text/plain" id="cdn">
https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js
https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>useMemo skips a recalculation vs redoing it every render</h1>
    <p class="hint">Click "Unrelated tick" a few times first, then click "Add 500 items." Watch the calculation counter on each side.</p>
  </header>
  <main class="stageWrap">
    <div id="root"></div>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; --green: #16a34a; --red: #dc2626; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 17px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 18px 16px 28px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%; max-width: 480px; }
  .col { background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 14px; text-align: center; }
  .colTitle { margin: 0 0 8px; font: 700 12px ui-monospace, monospace; padding: 5px 8px; border-radius: 6px; }
  .colTitle.bad { color: var(--red); background: #fdeaea; }
  .colTitle.good { color: var(--green); background: #e8f7ee; }
  .stat { font: 800 24px ui-monospace, monospace; margin-bottom: 4px; }
  .sum { font: 600 11px ui-monospace, monospace; color: var(--sub); margin-bottom: 8px; }
  .note { margin: 8px 0 0; font-size: 11px; color: var(--sub); line-height: 1.5; }
  .row { display: flex; gap: 10px; }
  .btn { padding: 9px 16px; border-radius: 9px; border: none; background: var(--accent); color: #fff; font: 700 13px system-ui, sans-serif; cursor: pointer; }
  .btn:hover { background: #4f52d6; }
  .btn.ghost { background: #fff; color: var(--ink); border: 1.5px solid var(--line); }
  code { background: #eceef3; padding: 1px 5px; border-radius: 4px; font-size: 11px; }
</script>

<script type="text/plain" id="js">
  var e = React.createElement;
  var useState = React.useState;
  var useMemo = React.useMemo;
  var useRef = React.useRef;

  function expensiveSum(n) {
    var total = 0;
    for (var i = 0; i < n; i++) {
      total += (i * i) % 97;
    }
    return total;
  }

  function Demo() {
    var itemsState = useState(2000);
    var items = itemsState[0];
    var setItems = itemsState[1];

    var tickState = useState(0);
    var tick = tickState[0];
    var setTick = tickState[1];

    var badCallsRef = useRef(0);
    var goodCallsRef = useRef(0);

    // BROKEN: this runs on every single render, including the ones caused by
    // the totally unrelated "tick" button. There is no check for whether
    // `items` actually changed since last time.
    badCallsRef.current += 1;
    var badSum = expensiveSum(items);

    // FIXED: useMemo only re-invokes the function when `items` (its only
    // dependency) is different from last render. Clicking the unrelated tick
    // button re-renders the component, but the cached value is reused as-is.
    var goodSum = useMemo(function () {
      goodCallsRef.current += 1;
      return expensiveSum(items);
    }, [items]);

    return e(React.Fragment, null,
      e('div', { className: 'cols' },
        e('div', { className: 'col' },
          e('h2', { className: 'colTitle bad' }, 'No useMemo'),
          e('div', { className: 'stat' }, badCallsRef.current),
          e('div', { className: 'sum' }, 'sum: ' + badSum),
          e('p', { className: 'note' }, 'Recalculates every render, even when ', e('code', null, 'items'), ' did not change.')
        ),
        e('div', { className: 'col' },
          e('h2', { className: 'colTitle good' }, 'useMemo'),
          e('div', { className: 'stat' }, goodCallsRef.current),
          e('div', { className: 'sum' }, 'sum: ' + goodSum),
          e('p', { className: 'note' }, 'Only recalculates when ', e('code', null, 'items'), ' actually changes.')
        )
      ),
      e('div', { className: 'row' },
        e('button', { className: 'btn ghost', onClick: function () { setTick(tick + 1); } }, 'Unrelated tick (' + tick + ')'),
        e('button', { className: 'btn', onClick: function () { setItems(items + 500); } }, 'Add 500 items (' + items + ')')
      )
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(e(Demo));
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
