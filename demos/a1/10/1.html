<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="text-align: center">

<script type="text/plain" id="html">
  <div class="stage">
    <div class="box">
      <p>This text is centered with <code>text-align: center</code>.</p>
      <img src="https://picsum.photos/seed/ta1/80/80" alt="A centered inline image" class="inline-img">
      <button class="btn">A centered button</button>
    </div>
  </div>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; }
  body { background: #f6f7f9; color: var(--ink); }
  .stage { display: flex; justify-content: center; padding: 40px 20px; }
  .box { max-width: 340px; padding: 24px; background: #fff; border: 1.5px solid var(--line); border-radius: 12px; text-align: center; }
  .box p { margin: 0 0 14px; font: 500 14px/1.6 system-ui, sans-serif; }
  .box code { background: #eceef3; padding: 1px 5px; border-radius: 4px; }
  .inline-img { display: inline-block; width: 56px; height: 56px; border-radius: 50%; margin-bottom: 14px; }
  .btn { display: inline-block; padding: 9px 16px; font: 700 13px system-ui, sans-serif; color: #fff; background: var(--accent); border: none; border-radius: 8px; cursor: pointer; }
</script>

<script type="text/plain" id="js">
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
