<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="display: table-cell centering">

<script type="text/plain" id="html">
  <div class="stage">
    <div class="cell">
      <span class="pill">vertical-align: middle, the pre-flexbox way</span>
    </div>
  </div>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #64748b; }
  body { background: #f6f7f9; color: var(--ink); }
  .stage {
    display: table;
    width: 100%;
    height: 300px;
    margin: 20px 0;
    padding: 0 20px;
    box-sizing: border-box;
    background: repeating-linear-gradient(45deg, #eceef3, #eceef3 12px, #f6f7f9 12px, #f6f7f9 24px);
    border: 1.5px dashed var(--line);
    border-radius: 12px;
  }
  .cell {
    display: table-cell;
    vertical-align: middle;
    text-align: center;
  }
  .pill {
    display: inline-block;
    padding: 14px 22px;
    background: var(--accent);
    color: #fff;
    font: 700 13px/1.4 system-ui, sans-serif;
    border-radius: 10px;
  }
</script>

<script type="text/plain" id="js">
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
