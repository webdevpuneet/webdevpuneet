<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Centering a stack of items">

<script type="text/plain" id="html">
  <div class="stage">
    <div class="card">
      <div class="icon">★</div>
      <h3>Centered card content</h3>
      <p>Icon, heading, text and button all centered together — on both axes, as one column.</p>
      <button class="btn">Get started</button>
    </div>
  </div>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #16a34a; }
  body { background: #f6f7f9; color: var(--ink); }
  .stage {
    height: 360px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 20px;
    background: repeating-linear-gradient(45deg, #eceef3, #eceef3 12px, #f6f7f9 12px, #f6f7f9 24px);
    border: 1.5px dashed var(--line);
    border-radius: 12px;
  }
  .card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    max-width: 260px;
    padding: 28px 22px;
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 14px;
    text-align: center;
    box-shadow: 0 14px 34px rgba(15,23,42,0.08);
  }
  .icon {
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    background: var(--accent); color: #fff;
    border-radius: 50%; font-size: 18px;
  }
  .card h3 { margin: 0; font-size: 16px; }
  .card p { margin: 0; font-size: 12.5px; line-height: 1.6; color: var(--sub); }
  .btn { margin-top: 4px; padding: 9px 18px; font: 700 12.5px system-ui, sans-serif; color: #fff; background: var(--accent); border: none; border-radius: 8px; cursor: pointer; }
</script>

<script type="text/plain" id="js">
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
