<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="width: fit-content + margin-inline: auto">

<script type="text/plain" id="html">
  <div class="stage">
    <div class="box">Shrink-wrapped to its content, then centered</div>
  </div>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; }
  body { background: #f6f7f9; color: var(--ink); }
  .stage { padding: 40px 20px; }
  .box {
    width: fit-content;
    margin-inline: auto;
    max-width: 90%;
    padding: 16px 22px;
    background: #fff;
    border: 1.5px solid var(--line);
    border-left: 4px solid var(--accent);
    border-radius: 10px;
    font: 600 13px/1.6 system-ui, sans-serif;
    text-align: center;
  }
</script>

<script type="text/plain" id="js">
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
