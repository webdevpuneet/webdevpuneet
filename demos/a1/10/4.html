<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Grid place-items: center">

<script type="text/plain" id="html">
  <div class="stage">
    <div class="box">One line: <code>place-items: center</code></div>
  </div>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #10b981; }
  body { background: #f6f7f9; color: var(--ink); }
  .stage {
    height: 320px;
    display: grid;
    place-items: center;
    margin: 20px;
    background: repeating-linear-gradient(45deg, #eceef3, #eceef3 12px, #f6f7f9 12px, #f6f7f9 24px);
    border: 1.5px dashed var(--line);
    border-radius: 12px;
  }
  .box {
    padding: 18px 26px;
    background: var(--accent);
    color: #fff;
    font: 700 14px system-ui, sans-serif;
    border-radius: 10px;
    box-shadow: 0 10px 26px rgba(16,185,129,0.35);
  }
  .box code { background: rgba(255,255,255,0.2); padding: 1px 6px; border-radius: 4px; }
</script>

<script type="text/plain" id="js">
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
