<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Plain vs Registered Angle">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Plain custom property vs registered &lt;angle&gt;</h1>
    <p class="hint">Click "Animate" to transition both conic gradients from 0deg to 360deg over 1.2s. The left ring uses a plain, unregistered --angle; the right ring uses the exact same variable registered as an &lt;angle&gt; with @property. The readout samples both mid-transition.</p>
  </header>
  <main class="stageWrap">
    <div class="row">
      <div class="swatch">
        <div class="ring plain" id="plainRing"></div>
        <p class="label">Plain <code>--angle</code> (unregistered)</p>
      </div>
      <div class="swatch">
        <div class="ring registered" id="regRing"></div>
        <p class="label">Registered <code>--angle</code> (&lt;angle&gt;)</p>
      </div>
    </div>
    <button class="btn" id="animateBtn" type="button">Animate</button>
    <p class="note" id="note">Click Animate, then watch the readout below capture a snapshot 300ms into the 1200ms transition.</p>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 54em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 22px 18px 30px; }
  .row { display: flex; gap: 36px; flex-wrap: wrap; justify-content: center; }
  .swatch { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .label { margin: 0; font-size: 12px; color: var(--sub); }
  .label code { color: var(--ink); }

  /* The registration: this is what gives --angle an actual value space. */
  @property --angle {
    syntax: '<angle>';
    inherits: false;
    initial-value: 0deg;
  }

  .ring {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    box-shadow: 0 1px 3px rgba(20,22,28,.12);
  }

  .plain {
    --angle: 0deg;
    background: conic-gradient(from var(--angle), #6366f1, #22c55e, #f59e0b, #6366f1);
    transition: --angle 1.2s ease;
  }

  .registered {
    --angle: 0deg;
    background: conic-gradient(from var(--angle), #6366f1, #22c55e, #f59e0b, #6366f1);
    transition: --angle 1.2s ease;
  }

  .plain.spin, .registered.spin { --angle: 360deg; }

  .btn { border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: 700 13px system-ui, sans-serif; padding: 10px 18px; cursor: pointer; }
  .btn:active { transform: translateY(1px); }
  .note { margin: 0; max-width: 54em; font-size: 12.5px; color: var(--sub); text-align: center; }
  .note strong { color: var(--ink); }
</script>

<script type="text/plain" id="js">
  var plainRing = document.getElementById('plainRing');
  var regRing = document.getElementById('regRing');
  var btn = document.getElementById('animateBtn');
  var note = document.getElementById('note');

  btn.addEventListener('click', function () {
    plainRing.classList.remove('spin');
    regRing.classList.remove('spin');
    // Force reflow so re-adding the class restarts the transition.
    void plainRing.offsetWidth;
    void regRing.offsetWidth;

    plainRing.classList.add('spin');
    regRing.classList.add('spin');
    note.textContent = 'Animating...';

    setTimeout(function () {
      var plainAngle = getComputedStyle(plainRing).getPropertyValue('--angle').trim();
      var regAngle = getComputedStyle(regRing).getPropertyValue('--angle').trim();

      note.innerHTML = '300ms into a 1200ms transition (25% elapsed) &mdash; plain <strong>--angle</strong> reads <strong>' + plainAngle + '</strong> (an unregistered custom property can only flip discretely, so it is still showing the start value, then will jump straight to 360deg partway through). Registered <strong>--angle</strong> reads <strong>' + regAngle + '</strong> &mdash; roughly a quarter of the way to 360deg, because @property gave the browser an actual &lt;angle&gt; value space to interpolate within.';
    }, 300);
  });
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
