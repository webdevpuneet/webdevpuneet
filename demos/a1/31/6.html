<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Registered Number Driving calc() Layout">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>A registered &lt;number&gt; driving grid-template-columns via calc()</h1>
    <p class="hint">Click "Widen sidebar". One registered --frac number feeds a calc() expression inside grid-template-columns, and the whole layout animates smoothly on a plain CSS transition &mdash; no JavaScript writes to the grid track sizes.</p>
  </header>
  <main class="stageWrap">
    <div class="grid" id="grid">
      <div class="side" id="side">sidebar</div>
      <div class="main">main content</div>
    </div>
    <button class="btn" id="widenBtn" type="button">Widen sidebar</button>
    <p class="note" id="note">Computing...</p>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 54em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 22px 18px 30px; }

  @property --frac {
    syntax: '<number>';
    inherits: false;
    initial-value: 0.25;
  }

  .grid {
    --frac: 0.25;
    width: 100%;
    max-width: 420px;
    height: 110px;
    display: grid;
    grid-template-columns: calc(var(--frac) * 100%) 1fr;
    gap: 8px;
    transition: --frac .8s ease;
  }

  .grid.wide { --frac: 0.65; }

  .side { background: var(--accent); color: #fff; border-radius: 8px; display: flex; align-items: center; justify-content: center; font: 700 12px system-ui, sans-serif; }
  .main { background: #fff; border: 1px solid var(--line); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--sub); }

  .btn { border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: 700 13px system-ui, sans-serif; padding: 10px 18px; cursor: pointer; }
  .btn:active { transform: translateY(1px); }
  .note { margin: 0; max-width: 54em; font-size: 12.5px; color: var(--sub); text-align: center; }
  .note strong { color: var(--ink); }
</script>

<script type="text/plain" id="js">
  var grid = document.getElementById('grid');
  var side = document.getElementById('side');
  var btn = document.getElementById('widenBtn');
  var note = document.getElementById('note');

  function widths() {
    var frac = getComputedStyle(grid).getPropertyValue('--frac').trim();
    var sideW = Math.round(side.getBoundingClientRect().width);
    return { frac: frac, sideW: sideW };
  }

  var start = widths();
  note.innerHTML = 'Current <strong>--frac</strong>: ' + start.frac + ' &rarr; sidebar is ' + start.sideW + 'px. Click the button to animate --frac to 0.65 and watch grid-template-columns recompute on every frame.';

  btn.addEventListener('click', function () {
    grid.classList.toggle('wide');
    var raf = 0;
    function tick() {
      var w = widths();
      note.innerHTML = '<strong>--frac</strong>: ' + w.frac + ' &rarr; sidebar: ' + w.sideW + 'px (live, sampled every frame)';
      raf = requestAnimationFrame(tick);
    }
    tick();
    setTimeout(function () {
      cancelAnimationFrame(raf);
      var w = widths();
      note.innerHTML = 'Transition finished. <strong>--frac</strong> settled at <strong>' + w.frac + '</strong>, sidebar at <strong>' + w.sideW + 'px</strong> &mdash; a single registered number, used inside calc(), animated an actual layout property with plain CSS.';
    }, 900);
  });
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
