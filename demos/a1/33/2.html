<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Proving the Actual Firing Order">

<script type="text/plain" id="cdn">
https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js
https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>What actually happens, in order</h1>
    <p class="hint">Click "Trigger update" and read the log top to bottom -- it's the real sequence, timestamped, not a diagram.</p>
  </header>
  <main class="stageWrap">
    <div id="root"></div>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; --green: #16a34a; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 16px 20px 6px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 17px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 14px 16px 28px; }
  .frame { width: 100%; max-width: 480px; background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 14px; }
  .box { text-align: center; font: 800 22px ui-monospace, monospace; padding: 10px; background: #f4f4ff; border-radius: 8px; margin-bottom: 10px; }
  .btn { width: 100%; padding: 9px 10px; border-radius: 9px; border: none; background: var(--accent); color: #fff; font: 700 13px system-ui, sans-serif; cursor: pointer; margin-bottom: 10px; }
  .log { background: #14161c; color: #a7f3d0; font: 11px ui-monospace, monospace; border-radius: 8px; padding: 10px; height: 190px; overflow-y: auto; line-height: 1.7; }
  .log .render { color: #93c5fd; }
  .log .commit { color: #fcd34d; }
  .log .layout { color: #6ee7b7; }
  .log .paint { color: #f9a8d4; }
  .log .effect { color: #fca5a5; }
  .note { margin: 8px 0 0; font-size: 11px; color: var(--sub); line-height: 1.5; }
</script>

<script type="text/plain" id="js">
  var e = React.createElement;
  var useState = React.useState;
  var useRef = React.useRef;
  var useEffect = React.useEffect;
  var useLayoutEffect = React.useLayoutEffect;

  var t0 = performance.now();
  function ms() { return (performance.now() - t0).toFixed(1); }

  function Demo() {
    var tickState = useState(0);
    var tick = tickState[0];
    var setTick = tickState[1];

    var logRef = useRef([]);
    var forceState = useState(0);
    var forceTick = forceState[1];

    function log(cls, msg) {
      logRef.current = logRef.current.concat([{ cls: cls, msg: '[' + ms() + 'ms] ' + msg }]);
      forceTick(function (n) { return n + 1; });
    }

    // 1. RENDER PHASE -- this line runs every time the component function is called.
    log('render', '1. render phase -- component function runs');

    useLayoutEffect(function () {
      // 3. Fires synchronously right after React writes to the real DOM,
      // and BEFORE the browser is allowed to paint anything.
      log('layout', '3. useLayoutEffect -- DOM already mutated, paint still blocked');
      requestAnimationFrame(function () {
        // requestAnimationFrame runs as the browser starts its next frame, right before it paints.
        log('paint', '4. next frame starts (rAF) -- the browser paints right after this');
      });
    }, [tick]);

    useEffect(function () {
      // 5. Scheduled to run after the browser paints -- asynchronous relative to step 4.
      log('effect', '5. useEffect -- runs after the paint above, non-blocking');
    }, [tick]);

    return e('div', { className: 'frame' },
      e('div', { className: 'box' }, 'tick: ' + tick),
      e('button', {
        className: 'btn',
        onClick: function () {
          logRef.current = [];
          log('commit', '(new click -- React will re-render, then commit)');
          // Deferred with setTimeout on purpose: since React 18, an update that comes straight
          // from a click flushes even useEffect before the paint. A timer-driven update shows
          // the general-case order this demo is about.
          setTimeout(function () { setTick(function (t) { return t + 1; }); }, 0);
        }
      }, 'Trigger update'),
      e('div', { className: 'log' }, logRef.current.map(function (item, i) {
        return e('div', { key: i, className: item.cls }, item.msg);
      }))
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(e(Demo));
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
