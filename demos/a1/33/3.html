<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Restoring Scroll Position Without the Jump">

<script type="text/plain" id="cdn">
https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js
https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Restoring scroll position: jump vs no jump</h1>
    <p class="hint">Click "Reopen list (restore to item 40)" on each side. Watch the frame log to see whether item 0 ever got painted first.</p>
  </header>
  <main class="stageWrap">
    <div id="root"></div>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; --green: #16a34a; --red: #dc2626; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 16px 20px 6px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 17px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px 16px 28px; }
  .cols { width: 100%; max-width: 540px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .col { background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px; }
  .colHead { font: 700 12px ui-monospace, monospace; margin-bottom: 6px; text-align: center; }
  .colHead.eff { color: var(--red); }
  .colHead.layout { color: var(--green); }
  .list { height: 90px; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 6px; background: #fafafa; }
  .row { padding: 4px 8px; font: 11px ui-monospace, monospace; border-bottom: 1px solid #eee; }
  .row.hi { background: #fde68a; }
  .btn { width: 100%; padding: 7px 8px; border-radius: 8px; border: none; background: var(--accent); color: #fff; font: 700 10.5px system-ui, sans-serif; cursor: pointer; margin-bottom: 6px; }
  .log { background: #14161c; color: #a7f3d0; font: 10px ui-monospace, monospace; border-radius: 6px; padding: 6px 7px; height: 68px; overflow-y: auto; line-height: 1.5; }
  .log .zero { color: #fca5a5; }
  .note { margin: 8px 0 0; max-width: 540px; font-size: 11px; color: var(--sub); line-height: 1.5; text-align: center; }
</script>

<script type="text/plain" id="js">
  var e = React.createElement;
  var useState = React.useState;
  var useRef = React.useRef;
  var useEffect = React.useEffect;
  var useLayoutEffect = React.useLayoutEffect;

  var ROWS = 60;
  var TARGET = 40;

  function Panel(props) {
    var openState = useState(0);
    var openId = openState[0];
    var setOpenId = openState[1];

    var listRef = useRef(null);
    var logRef = useRef([]);
    var forceState = useState(0);
    var forceTick = forceState[1];

    function log(msg, wasZero) {
      logRef.current = logRef.current.concat([{ msg: msg, zero: !!wasZero }]).slice(-4);
      forceTick(function (n) { return n + 1; });
    }

    var hook = props.mode === 'layout' ? useLayoutEffect : useEffect;

    hook(function () {
      if (listRef.current) {
        listRef.current.scrollTop = 0; // always mounts at the top first
        var target = listRef.current.querySelector('[data-row="' + TARGET + '"]');
        if (target) target.scrollIntoView({ block: 'center' });
      }
      requestAnimationFrame(function () {
        var top = listRef.current ? listRef.current.scrollTop : 0;
        log('PAINTED at scrollTop=' + Math.round(top), top < 20);
      });
    }, [openId]);

    function reopen() {
      logRef.current = [];
      // Deferred with setTimeout on purpose: since React 18, an update that comes straight from a
      // click runs even useEffect before the browser paints. Starting it from a timer (like data
      // arriving, or any non-click update) shows the timing difference this demo is about.
      setTimeout(function () { setOpenId(function (n) { return n + 1; }); }, 0);
    }

    var rows = [];
    for (var i = 0; i < ROWS; i++) {
      rows.push(e('div', { key: i, 'data-row': i, className: 'row' + (i === TARGET ? ' hi' : '') }, 'item ' + i));
    }

    return e('div', { className: 'col' },
      e('div', { className: 'colHead ' + (props.mode === 'layout' ? 'layout' : 'eff') }, props.mode === 'layout' ? 'useLayoutEffect' : 'useEffect'),
      e('div', { className: 'list', ref: listRef, key: openId }, rows),
      e('button', { className: 'btn', onClick: reopen }, 'Reopen list (restore to item 40)'),
      e('div', { className: 'log' }, logRef.current.map(function (item, i) {
        return e('div', { key: i, className: item.zero ? 'zero' : '' }, item.msg);
      }))
    );
  }

  function Demo() {
    return e('div', { className: 'cols' },
      e(Panel, { mode: 'effect' }),
      e(Panel, { mode: 'layout' })
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(
    e('div', null,
      e(Demo),
      e('p', { className: 'note' }, 'Every mount sets scrollTop=0 first, on purpose, then scrolls item 40 into view -- exactly like restoring a saved position for a real list. The useLayoutEffect panel\'s restore happens before the browser paints, so the very first painted frame is already scrolled. The useEffect panel genuinely paints at scrollTop=0 first (red log line), then jumps -- a real, momentary top-of-list flash.')
    )
  );
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
