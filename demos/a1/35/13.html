<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Shimmer Loading Placeholder">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Shimmer Loading Placeholder</h1>
    <p class="hint">No click needed &mdash; watch the placeholder blocks shimmer continuously, the same effect used while real content loads.</p>
  </header>
  <main class="stageWrap">
    <div class="skelCard">
      <div class="skelAvatar shimmer"></div>
      <div class="skelLines">
        <div class="skelLine shimmer" style="width:70%"></div>
        <div class="skelLine shimmer" style="width:45%"></div>
      </div>
    </div>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; justify-content: center; align-items: center; padding: 40px 18px; min-height: 260px; }

  .skelCard {
    display: flex; gap: 14px; align-items: center;
    width: 300px;
    padding: 18px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
  }
  .shimmer {
    background: linear-gradient(90deg, #e7e9ee 25%, #f4f5f8 37%, #e7e9ee 63%);
    background-size: 400% 100%;
    animation: shimmer 1.3s ease-in-out infinite;
    border-radius: 6px;
  }
  .skelAvatar { width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0; }
  .skelLines { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .skelLine { height: 12px; }
  @keyframes shimmer {
    0% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
</script>

<script type="text/plain" id="js">
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
