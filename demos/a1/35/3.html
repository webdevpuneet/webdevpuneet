<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Custom Toggle Switch">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Custom Toggle Switch</h1>
    <p class="hint">Click the switch &mdash; it's a real checkbox under the hood, styled entirely with <code>:checked</code> and a sibling selector.</p>
  </header>
  <main class="stageWrap">
    <label class="toggle">
      <input type="checkbox">
      <span class="track"><span class="thumb"></span></span>
      <span class="toggleLabel">Notifications</span>
    </label>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; justify-content: center; align-items: center; padding: 20px 18px 40px; min-height: 260px; }

  .toggle {
    display: flex; align-items: center; gap: 12px;
    cursor: pointer;
    font: 600 14px system-ui, -apple-system, sans-serif;
    color: var(--ink);
  }
  .toggle input {
    position: absolute; opacity: 0; width: 1px; height: 1px;
  }
  .track {
    position: relative;
    width: 46px; height: 26px;
    background: #d7d9e0;
    border-radius: 999px;
    transition: background 0.25s ease;
    flex-shrink: 0;
  }
  .thumb {
    position: absolute; top: 3px; left: 3px;
    width: 20px; height: 20px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 1px 2px rgba(20,22,28,.25);
    transition: transform 0.25s cubic-bezier(.34,1.56,.64,1);
  }
  .toggle input:checked ~ .track { background: var(--accent); }
  .toggle input:checked ~ .track .thumb { transform: translateX(20px); }
  .toggle input:focus-visible ~ .track { outline: 2px solid var(--accent); outline-offset: 2px; }
</script>

<script type="text/plain" id="js">
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
