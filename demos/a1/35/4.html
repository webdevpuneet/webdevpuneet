<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Focus Glow Input">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Focus Glow Input</h1>
    <p class="hint">Click into the field &mdash; the border color and floating label animate together, plus a soft glow expands around the input, all via <code>:focus</code>.</p>
  </header>
  <main class="stageWrap">
    <div class="field">
      <input type="text" id="nameInput" placeholder=" ">
      <label for="nameInput">Your name</label>
    </div>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; justify-content: center; align-items: center; padding: 20px 18px 40px; min-height: 260px; }

  .field { position: relative; width: 240px; }
  .field input {
    width: 100%;
    padding: 16px 12px 8px;
    font: 14px system-ui, -apple-system, sans-serif;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    outline: none;
    background: #fff;
    transition: border-color 0.25s ease, box-shadow 0.25s ease;
  }
  .field label {
    position: absolute; left: 12px; top: 15px;
    font: 14px system-ui, -apple-system, sans-serif;
    color: var(--sub);
    pointer-events: none;
    transition: transform 0.2s ease, color 0.2s ease;
    transform-origin: left top;
  }
  .field input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(99,102,241,.15);
  }
  .field input:focus ~ label,
  .field input:not(:placeholder-shown) ~ label {
    transform: translateY(-11px) scale(0.78);
    color: var(--accent);
  }
</script>

<script type="text/plain" id="js">
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
