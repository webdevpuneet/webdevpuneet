<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Timed Copy Confirmation">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Timed Copy Confirmation</h1>
    <p class="hint">Click the button &mdash; a hidden checkbox toggles a "Copied!" state that fades back on its own via a CSS animation. (Real clipboard access still needs a line of JS; this demo isolates just the timed state-change effect.)</p>
  </header>
  <main class="stageWrap">
    <label class="copyBtn">
      <input type="checkbox" class="copyInput">
      <span class="copyDefault">Copy code</span>
      <span class="copyDone">Copied!</span>
    </label>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; justify-content: center; align-items: center; padding: 40px 18px; min-height: 260px; }

  .copyBtn {
    position: relative;
    display: inline-flex; align-items: center; justify-content: center;
    width: 140px; padding: 12px 0;
    font: 700 13.5px system-ui, -apple-system, sans-serif;
    color: #fff;
    background: var(--ink);
    border-radius: 8px;
    cursor: pointer;
    overflow: hidden;
    user-select: none;
  }
  .copyInput { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .copyDone {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #22c55e;
    opacity: 0;
  }
  .copyInput:checked ~ .copyDone {
    animation: copyPulse 2.4s ease forwards;
  }
  @keyframes copyPulse {
    0% { opacity: 0; }
    10% { opacity: 1; }
    85% { opacity: 1; }
    100% { opacity: 0; }
  }
</script>

<script type="text/plain" id="js">
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
