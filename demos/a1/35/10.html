<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="CSS-Only Star Rating">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>CSS-Only Star Rating</h1>
    <p class="hint">Hover across the stars to preview a rating, click to lock it in &mdash; five radio inputs and the general sibling combinator do all the work.</p>
  </header>
  <main class="stageWrap">
    <fieldset class="stars">
      <input type="radio" id="s5" name="rating" value="5"><label for="s5">&#9733;</label>
      <input type="radio" id="s4" name="rating" value="4"><label for="s4">&#9733;</label>
      <input type="radio" id="s3" name="rating" value="3"><label for="s3">&#9733;</label>
      <input type="radio" id="s2" name="rating" value="2"><label for="s2">&#9733;</label>
      <input type="radio" id="s1" name="rating" value="1" checked><label for="s1">&#9733;</label>
    </fieldset>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; justify-content: center; align-items: center; padding: 40px 18px; min-height: 260px; }

  .stars {
    border: none; padding: 0; margin: 0;
    display: flex; flex-direction: row-reverse;
    gap: 4px;
  }
  .stars input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .stars label {
    font-size: 36px; line-height: 1;
    color: #d7d9e0;
    cursor: pointer;
    transition: color 0.15s ease;
  }
  .stars label:hover,
  .stars label:hover ~ label {
    color: #f59e0b;
  }
  .stars input:checked ~ label {
    color: #f59e0b;
  }
</script>

<script type="text/plain" id="js">
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
