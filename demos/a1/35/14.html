<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="New-Item Badge Pulse">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>New-Item Badge Pulse</h1>
    <p class="hint">Click to simulate a new item arriving &mdash; the checkbox toggles a badge count that pulses once via a CSS animation.</p>
  </header>
  <main class="stageWrap">
    <label class="pulseDemo">
      <input type="checkbox" class="pulseInput">
      <span class="bell">&#128276;<span class="badge">3</span></span>
      <span class="pulseLabel">Simulate new item</span>
    </label>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; justify-content: center; align-items: center; padding: 40px 18px; min-height: 260px; }

  .pulseDemo {
    display: flex; align-items: center; gap: 14px;
    cursor: pointer;
    font: 600 13.5px system-ui, -apple-system, sans-serif;
    color: var(--ink);
  }
  .pulseInput { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .bell { position: relative; font-size: 26px; display: inline-flex; }
  .badge {
    position: absolute; top: -6px; right: -10px;
    min-width: 18px; height: 18px; padding: 0 4px;
    background: #ef4444; color: #fff;
    font: 700 11px system-ui, -apple-system, sans-serif;
    border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    transform: scale(1);
  }
  .pulseInput:checked ~ .bell .badge {
    animation: badgePulse 0.5s ease;
  }
  @keyframes badgePulse {
    0% { transform: scale(1); }
    40% { transform: scale(1.5); }
    100% { transform: scale(1); }
  }
</script>

<script type="text/plain" id="js">
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
