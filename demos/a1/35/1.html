<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Satisfying Button Press">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Satisfying Button Press</h1>
    <p class="hint">Press and hold the button &mdash; it scales down and the shadow tightens exactly like a real physical press, driven entirely by <code>:active</code>.</p>
  </header>
  <main class="stageWrap">
    <button class="btn">Press me</button>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; justify-content: center; align-items: center; padding: 20px 18px 40px; min-height: 260px; }

  .btn {
    padding: 14px 30px;
    font: 700 15px system-ui, -apple-system, sans-serif;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(99,102,241,.35), 0 2px 4px rgba(20,22,28,.1);
    transform: scale(1);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover {
    box-shadow: 0 6px 16px rgba(99,102,241,.4), 0 2px 6px rgba(20,22,28,.12);
  }
  .btn:active {
    transform: scale(0.94);
    box-shadow: 0 1px 3px rgba(99,102,241,.3);
  }
</script>

<script type="text/plain" id="js">
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
