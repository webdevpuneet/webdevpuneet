<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Checkbox-Hack Accordion">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Checkbox-Hack Accordion</h1>
    <p class="hint">Click a question &mdash; each row is a hidden checkbox and label pair, and the answer's <code>max-height</code> animates open on <code>:checked</code>.</p>
  </header>
  <main class="stageWrap">
    <div class="accordion">
      <div class="acc-item">
        <input type="checkbox" id="acc1" class="acc-input">
        <label for="acc1" class="acc-head">What is a microinteraction? <span class="acc-plus">+</span></label>
        <div class="acc-body"><p>A small, self-contained piece of feedback &mdash; a hover state, a toggle, a press animation &mdash; that responds to one specific user action.</p></div>
      </div>
      <div class="acc-item">
        <input type="checkbox" id="acc2" class="acc-input">
        <label for="acc2" class="acc-head">Does this need JavaScript? <span class="acc-plus">+</span></label>
        <div class="acc-body"><p>No &mdash; this accordion is driven entirely by the checkbox hack: a hidden checkbox, a label as the click target, and a sibling selector.</p></div>
      </div>
    </div>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; justify-content: center; align-items: flex-start; padding: 24px 18px 40px; min-height: 260px; }

  .accordion { width: 320px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 0 14px; }
  .acc-item { border-bottom: 1px solid var(--line); }
  .acc-item:last-child { border-bottom: none; }
  .acc-input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .acc-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 2px;
    font: 600 13.5px system-ui, -apple-system, sans-serif;
    cursor: pointer;
    color: var(--ink);
  }
  .acc-plus { color: var(--sub); transition: transform 0.25s ease; }
  .acc-body { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
  .acc-body p { margin: 0 2px 14px; font-size: 12.5px; line-height: 1.6; color: var(--sub); }
  .acc-input:checked ~ .acc-body { max-height: 140px; }
  .acc-input:checked ~ .acc-head .acc-plus { transform: rotate(45deg); }
  .acc-input:focus-visible ~ .acc-head { outline: 2px solid var(--accent); outline-offset: -2px; }
</script>

<script type="text/plain" id="js">
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
