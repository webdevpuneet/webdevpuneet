<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Missing Dependency Array Runs on Every Render">

<script type="text/plain" id="cdn">
https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js
https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>No dependency array = runs after every single render</h1>
    <p class="hint">Both counters share one unrelated "tick" button. Watch the effect-run count on each side as you click it.</p>
  </header>
  <main class="stageWrap">
    <div id="root"></div>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; --green: #16a34a; --red: #dc2626; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 18px 16px 28px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%; max-width: 460px; }
  .col { background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 14px; text-align: center; }
  .colTitle { margin: 0 0 8px; font: 700 12px ui-monospace, monospace; padding: 5px 8px; border-radius: 6px; }
  .colTitle.bad { color: var(--red); background: #fdeaea; }
  .colTitle.good { color: var(--green); background: #e8f7ee; }
  .stat { font: 800 26px ui-monospace, monospace; color: var(--ink); }
  .note { margin: 8px 0 0; font-size: 11.5px; color: var(--sub); line-height: 1.5; }
  .tickBtn { padding: 10px 18px; border-radius: 9px; border: none; background: var(--accent); color: #fff; font: 700 13px system-ui, sans-serif; cursor: pointer; }
  .tickBtn:hover { background: #4f52d6; }
</script>

<script type="text/plain" id="js">
  var e = React.createElement;
  var useState = React.useState;
  var useEffect = React.useEffect;

  function Demo() {
    var tickState = useState(0);
    var tick = tickState[0];
    var setTick = tickState[1];

    // badRuns is a REF, not state, on purpose -- calling setState inside an
    // effect with no dependency array at all would re-trigger that same
    // effect on the render it just caused, forever, spinning the tab at
    // 100% CPU. A ref lets the count climb without itself causing another
    // render, so the demo can show the real behavior safely.
    var badRunsRef = React.useRef(0);

    var goodRunsState = useState(0);
    var goodRuns = goodRunsState[0];
    var setGoodRuns = goodRunsState[1];

    // No dependency array at all -- React has no list to compare against,
    // so "no array" means "always different," and this runs after EVERY
    // render, including ones caused by totally unrelated state like tick.
    useEffect(function () {
      badRunsRef.current += 1;
    });

    // Empty array -- React compares against an empty list every time, which
    // never differs, so this only ever runs once, right after mount. Calling
    // setState here is safe: it runs exactly once, so it cannot self-loop.
    useEffect(function () {
      setGoodRuns(function (n) { return n + 1; });
    }, []);

    return e(React.Fragment, null,
      e('div', { className: 'cols' },
        e('div', { className: 'col' },
          e('h2', { className: 'colTitle bad' }, 'No array'),
          e('div', { className: 'stat' }, badRunsRef.current),
          e('p', { className: 'note' }, 'Fires after every render, including ones caused by totally unrelated state.')
        ),
        e('div', { className: 'col' },
          e('h2', { className: 'colTitle good' }, 'Empty array []'),
          e('div', { className: 'stat' }, goodRuns),
          e('p', { className: 'note' }, 'Fires exactly once, on mount.')
        )
      ),
      e('button', { className: 'tickBtn', onClick: function () { setTick(tick + 1); } },
        'Trigger unrelated re-render (tick: ' + tick + ')'
      )
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(e(Demo));
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
