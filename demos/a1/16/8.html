<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="One Effect, Two Unrelated Concerns">

<script type="text/plain" id="cdn">
https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js
https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Two unrelated subscriptions living in one effect</h1>
    <p class="hint">Change the theme (unrelated to chat). Watch whether the chat connection below reconnects when it has no reason to.</p>
  </header>
  <main class="stageWrap">
    <div id="root"></div>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; --green: #16a34a; --red: #dc2626; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 17px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 47em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 18px 16px 28px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%; max-width: 500px; }
  .col { background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 14px; }
  .colTitle { margin: 0 0 10px; font: 700 12px ui-monospace, monospace; padding: 5px 8px; border-radius: 6px; text-align: center; }
  .colTitle.bad { color: var(--red); background: #fdeaea; }
  .colTitle.good { color: var(--green); background: #e8f7ee; }
  .themeBtns { display: flex; gap: 6px; margin-bottom: 10px; justify-content: center; }
  .themeBtn { padding: 5px 10px; border-radius: 7px; border: 1.5px solid var(--line); background: #fff; font: 700 11px system-ui, sans-serif; cursor: pointer; }
  .themeBtn.active { border-color: var(--accent); background: #eef0ff; color: var(--accent); }
  .chatStatus { font-size: 12px; text-align: center; padding: 8px; border-radius: 8px; background: #f1f5f9; }
  .reconnectCount { margin-top: 8px; font-size: 11px; color: var(--sub); text-align: center; }
  .reconnectCount b { color: var(--red); }
  .col.good .reconnectCount b { color: var(--green); }
</script>

<script type="text/plain" id="js">
  var e = React.createElement;
  var useState = React.useState;
  var useEffect = React.useEffect;

  function BadPanel() {
    var themeState = useState('light');
    var theme = themeState[0];
    var setTheme = themeState[1];
    var connectState = useState(0);
    var connectCount = connectState[0];
    var setConnectCount = connectState[1];

    // ANTI-PATTERN: theme (for the UI) and the chat connection (a totally
    // unrelated concern) are jammed into ONE effect. Because the effect's
    // dependency array has to include EVERY value it reads, theme being
    // read here (even just to log it) forces the whole effect -- including
    // the chat reconnect -- to re-run whenever theme changes.
    useEffect(function () {
      setConnectCount(function (n) { return n + 1; }); // reconnect to chat
      document.title = 'Theme: ' + theme; // unrelated UI concern, same effect
      return function () { /* disconnect */ };
    }, [theme]);

    return e('div', null,
      e('div', { className: 'themeBtns' },
        e('button', { className: 'themeBtn' + (theme === 'light' ? ' active' : ''), onClick: function () { setTheme('light'); } }, 'Light'),
        e('button', { className: 'themeBtn' + (theme === 'dark' ? ' active' : ''), onClick: function () { setTheme('dark'); } }, 'Dark')
      ),
      e('div', { className: 'chatStatus' }, 'Chat connected'),
      e('div', { className: 'reconnectCount' }, 'Reconnects: ', e('b', null, connectCount))
    );
  }

  function GoodPanel() {
    var themeState = useState('light');
    var theme = themeState[0];
    var setTheme = themeState[1];
    var connectState = useState(0);
    var connectCount = connectState[0];
    var setConnectCount = connectState[1];

    // FIXED: two effects, split by concern -- and therefore by dependency.
    // The chat effect has an EMPTY array because connecting to chat has
    // nothing to do with theme, so it runs once and never again.
    useEffect(function () {
      setConnectCount(function (n) { return n + 1; }); // reconnect to chat -- once, ever
      return function () { /* disconnect */ };
    }, []);

    useEffect(function () {
      document.title = 'Theme: ' + theme; // unrelated UI concern, its own effect
    }, [theme]);

    return e('div', null,
      e('div', { className: 'themeBtns' },
        e('button', { className: 'themeBtn' + (theme === 'light' ? ' active' : ''), onClick: function () { setTheme('light'); } }, 'Light'),
        e('button', { className: 'themeBtn' + (theme === 'dark' ? ' active' : ''), onClick: function () { setTheme('dark'); } }, 'Dark')
      ),
      e('div', { className: 'chatStatus' }, 'Chat connected'),
      e('div', { className: 'reconnectCount' }, 'Reconnects: ', e('b', null, connectCount))
    );
  }

  function Demo() {
    return e('div', { className: 'cols' },
      e('div', { className: 'col' },
        e('h2', { className: 'colTitle bad' }, 'One combined effect'),
        e(BadPanel)
      ),
      e('div', { className: 'col good' },
        e('h2', { className: 'colTitle good' }, 'Split by concern'),
        e(GoodPanel)
      )
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(e(Demo));
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
