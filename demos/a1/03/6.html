<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Named Containers">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Named Containers</h1>
    <p class="hint">Drag the outer panel. Two rules are watching two different named ancestors at once — one keyed to the inner card, one reaching straight past it to the outer panel — proving <code>@container</code> can target a specific ancestor, not just "whichever is nearest."</p>
  </header>
  <main class="stageWrap">
    <div class="resizeBox" id="rzBox" style="width:260px">
      <div class="outerPanel">
        <span class="panelTag">panel (named container)</span>
        <div class="innerCard">
          <span class="cardTag">card (named container)</span>
          <span class="innerBadge">Beta</span>
        </div>
      </div>
      <div class="resizeHandle" id="rzHandle" aria-hidden="true"></div>
    </div>
    <div class="readout">
      <span>Outer panel width: <strong id="readoutValue">260px</strong></span>
    </div>
    <pre class="ruleTag">.outerPanel { container: panel / inline-size; }
.innerCard  { container: card  / inline-size; }

@container card (min-width: 200px) { .innerBadge { font-size: 15px; } }
@container panel (min-width: 420px) { .innerBadge { background: gold; } }</pre>
  </main>
</script>

<script type="text/plain" id="css">
  :root {
    --ink: #14161c;
    --sub: #6b7080;
    --line: #e3e5ea;
    --accent: #6366f1;
  }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 54em; font-size: 12.5px; color: var(--sub); }
  .hint code { background: #eceef3; padding: 1px 5px; border-radius: 4px; }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 14px 16px 26px; }
  .readout {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px 16px;
    font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--sub);
  }
  .readout strong { color: var(--accent); font-weight: 700; }
  .ruleTag {
    font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #3f4252;
    background: #eceef3;
    padding: 8px 14px;
    border-radius: 10px;
    max-width: 100%;
    overflow-x: auto;
    white-space: pre;
  }

  .resizeBox {
    position: relative;
    max-width: 100%;
    min-width: 180px;
    box-sizing: border-box;
    border: 1.5px dashed var(--line);
    border-radius: 12px;
    padding: 16px 22px 16px 16px;
    background: #fff;
  }
  .resizeHandle {
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 16px;
    cursor: ew-resize;
    background: repeating-linear-gradient(90deg, var(--line) 0 2px, transparent 2px 6px);
    border-left: 1px solid var(--line);
    touch-action: none;
  }
  .resizeHandle:hover { background-color: #eef0ff; }

  /* The shorthand `container: <name> / <type>` sets container-name and
     container-type in one line — two nested named containers here. */
  .outerPanel {
    padding: 14px;
    border: 1.5px dashed #c7cbe0;
    border-radius: 10px;
    container: panel / inline-size;
  }
  .panelTag {
    display: block;
    font: 700 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #9095a8;
    margin-bottom: 10px;
  }
  .innerCard {
    padding: 14px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    background: #f9fafc;
    container: card / inline-size;
  }
  .cardTag {
    display: block;
    font: 700 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--sub);
    margin-bottom: 10px;
  }
  .innerBadge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 999px;
    background: #e5e7ff;
    color: #4338ca;
    font-size: 11px;
    font-weight: 700;
  }

  /* The rules this demo is about — each one names exactly which ancestor
     it's asking about, regardless of what sits between it and .innerBadge. */
  @container card (min-width: 200px) {
    .innerBadge { font-size: 15px; padding: 6px 16px; }
  }
  @container panel (min-width: 420px) {
    .innerBadge { background: #fde68a; color: #92400e; }
  }
</script>

<script type="text/plain" id="js">
  var box = document.getElementById('rzBox');
  var handle = document.getElementById('rzHandle');
  var outWidth = document.getElementById('readoutValue');
  var startX = 0, startWidth = 0, dragging = false;

  function report() {
    outWidth.textContent = Math.round(box.getBoundingClientRect().width) + 'px';
  }

  function onMove(e) {
    if (!dragging) return;
    var x = e.touches ? e.touches[0].clientX : e.clientX;
    var next = Math.max(180, Math.min(560, startWidth + (x - startX)));
    box.style.width = next + 'px';
    report();
  }
  function onUp() {
    dragging = false;
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
  }
  handle.addEventListener('pointerdown', function (e) {
    dragging = true;
    startX = e.clientX;
    startWidth = box.getBoundingClientRect().width;
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    e.preventDefault();
  });

  report();
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
