<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Media Query vs. Container Query, Side by Side">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Media Query vs. Container Query, Side by Side</h1>
    <p class="hint">Drag the handle down to a narrow width. The top widget is styled with <code>@media (min-width: 500px)</code> — it only ever looks at your browser window, which never changes here, so it stays in its wide layout and overflows. The bottom widget uses <code>@container</code> and correctly adapts to the box it's actually in.</p>
  </header>
  <main class="stageWrap">
    <div class="resizeBox" id="rzBox" style="width:420px">
      <div class="compareStack">
        <div class="widgetRow">
          <span class="widgetTag">@media (min-width: 500px)</span>
          <div class="mediaWidget">
            <span class="wIcon">&#9881;</span>
            <span class="wLabel">Auto-renew subscription</span>
            <button class="wBtn" type="button">Manage</button>
          </div>
        </div>
        <div class="widgetRow">
          <span class="widgetTag">@container (min-width: 300px)</span>
          <div class="containerWidget">
            <span class="wIcon">&#9881;</span>
            <span class="wLabel">Auto-renew subscription</span>
            <button class="wBtn" type="button">Manage</button>
          </div>
        </div>
      </div>
      <div class="resizeHandle" id="rzHandle" aria-hidden="true"></div>
    </div>
    <div class="readout">
      <span>Box width: <strong id="readoutValue">420px</strong></span>
    </div>
    <pre class="ruleTag">@media (min-width: 500px) { .mediaWidget { flex-direction: row; } }

/* .resizeBox: container-type: inline-size; — both widgets share it */
@container (min-width: 300px) { .containerWidget { flex-direction: row; } }</pre>
  </main>
</script>

<script type="text/plain" id="css">
  :root {
    --ink: #14161c;
    --sub: #6b7080;
    --line: #e3e5ea;
    --accent: #6366f1;
    --bad: #dc2626;
  }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 56em; font-size: 12.5px; color: var(--sub); }
  .hint code { background: #eceef3; padding: 1px 5px; border-radius: 4px; }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 14px 16px 26px; }
  .readout {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px 16px;
    font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--sub);
  }
  .readout strong { color: var(--accent); font-weight: 700; }
  .ruleTag {
    font: 600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #3f4252;
    background: #eceef3;
    padding: 8px 14px;
    border-radius: 10px;
    max-width: 100%;
    overflow-x: auto;
    white-space: pre;
  }

  .resizeBox {
    position: relative;
    max-width: 100%;
    min-width: 130px;
    box-sizing: border-box;
    border: 1.5px dashed var(--line);
    border-radius: 12px;
    padding: 14px 22px 14px 14px;
    background: #fff;
    overflow: hidden;

    /* The whole comparison box is the query container — both widgets share
       the same ancestor, so this is an honest, identical comparison. */
    container-type: inline-size;
  }
  .resizeHandle {
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 16px;
    cursor: ew-resize;
    background: repeating-linear-gradient(90deg, var(--line) 0 2px, transparent 2px 6px);
    border-left: 1px solid var(--line);
    touch-action: none;
  }
  .resizeHandle:hover { background-color: #eef0ff; }

  .compareStack { display: flex; flex-direction: column; gap: 14px; }
  .widgetRow { display: flex; flex-direction: column; gap: 5px; }
  .widgetTag {
    font: 700 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--sub);
  }

  .mediaWidget,
  .containerWidget {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
    padding: 8px 10px;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    font-size: 12.5px;
    white-space: nowrap;
  }
  .wIcon { flex-shrink: 0; }
  .wBtn {
    padding: 4px 10px;
    font: 700 11px system-ui, -apple-system, sans-serif;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 6px;
    cursor: default;
  }

  /* Top widget — only ever checks the viewport (this demo page's own
     window), which stays fixed no matter what you do to the box below. */
  @media (min-width: 500px) {
    .mediaWidget { flex-direction: row; align-items: center; }
    .mediaWidget .wBtn { margin-left: auto; }
  }

  /* Bottom widget — checks the box it's actually sitting in. */
  @container (min-width: 300px) {
    .containerWidget { flex-direction: row; align-items: center; }
    .containerWidget .wBtn { margin-left: auto; }
  }

  /* Visual honesty: when the row layout doesn't fit, let it actually
     overflow rather than silently clipping it — that overflow IS the bug
     a container query prevents. */
  .widgetRow { overflow-x: auto; }
</script>

<script type="text/plain" id="js">
  var box = document.getElementById('rzBox');
  var handle = document.getElementById('rzHandle');
  var outWidth = document.getElementById('readoutValue');
  var startX = 0, startWidth = 0, dragging = false;

  function report() {
    outWidth.textContent = Math.round(box.getBoundingClientRect().width) + 'px';
  }

  function onMove(e) {
    if (!dragging) return;
    var x = e.touches ? e.touches[0].clientX : e.clientX;
    var next = Math.max(130, Math.min(560, startWidth + (x - startX)));
    box.style.width = next + 'px';
    report();
  }
  function onUp() {
    dragging = false;
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
  }
  handle.addEventListener('pointerdown', function (e) {
    dragging = true;
    startX = e.clientX;
    startWidth = box.getBoundingClientRect().width;
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    e.preventDefault();
  });

  report();
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
