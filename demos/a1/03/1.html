<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Resizable Profile Card">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Resizable Profile Card</h1>
    <p class="hint">Drag the handle on the right edge — the card switches from a stacked to a side-by-side layout once its own container crosses 380px, no matter how wide your browser window is.</p>
  </header>
  <main class="stageWrap">
    <div class="resizeBox" id="rzBox" style="width:300px">
      <div class="cqCard">
        <div class="cqAvatar">DR</div>
        <div class="cqBody">
          <strong>Dana Reyes</strong>
          <span class="cqRole">Engineering Lead</span>
          <p class="cqBio">Ships backend systems and mentors the on-call rotation.</p>
        </div>
      </div>
      <div class="resizeHandle" id="rzHandle" aria-hidden="true"></div>
    </div>
    <div class="readout">
      <span>Container width: <strong id="readoutValue">300px</strong></span>
      <span>Layout: <strong id="readoutLayout">stacked</strong></span>
    </div>
    <pre class="ruleTag">.cqCard { container-type: inline-size; }
@container (min-width: 380px) {
  .cqCard { flex-direction: row; }
}</pre>
  </main>
</script>

<script type="text/plain" id="css">
  :root {
    --ink: #14161c;
    --sub: #6b7080;
    --line: #e3e5ea;
    --accent: #6366f1;
  }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 14px 16px 26px; }
  .readout {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px 16px;
    font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--sub);
  }
  .readout strong { color: var(--accent); font-weight: 700; }
  .ruleTag {
    font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #3f4252;
    background: #eceef3;
    padding: 8px 14px;
    border-radius: 10px;
    max-width: 100%;
    overflow-x: auto;
    white-space: pre;
  }

  /* The resize handle — drags .resizeBox's own width, nothing else. */
  .resizeBox {
    position: relative;
    max-width: 100%;
    min-width: 220px;
    box-sizing: border-box;
    border: 1.5px dashed var(--line);
    border-radius: 12px;
    padding: 16px 22px 16px 16px;
    background: #fff;

    /* The line that makes everything below possible: this box now reports
       its own inline size to any @container rule inside it. */
    container-type: inline-size;
  }
  .resizeHandle {
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 16px;
    cursor: ew-resize;
    background: repeating-linear-gradient(90deg, var(--line) 0 2px, transparent 2px 6px);
    border-left: 1px solid var(--line);
    touch-action: none;
  }
  .resizeHandle:hover { background-color: #eef0ff; }

  /* ── The card itself — stacked by default ── */
  .cqCard {
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: flex-start;
  }
  .cqAvatar {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, #818cf8, #6366f1);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px;
    flex-shrink: 0;
  }
  .cqBody { display: flex; flex-direction: column; gap: 2px; }
  .cqRole { font-size: 12px; color: var(--sub); }
  .cqBio { margin: 6px 0 0; font-size: 12.5px; color: var(--sub); }

  /* The rule this demo is about — everything above is just card styling. */
  @container (min-width: 380px) {
    .cqCard { flex-direction: row; align-items: center; }
    .cqBio { margin: 2px 0 0; }
  }
</script>

<script type="text/plain" id="js">
  var box = document.getElementById('rzBox');
  var handle = document.getElementById('rzHandle');
  var outWidth = document.getElementById('readoutValue');
  var outLayout = document.getElementById('readoutLayout');
  var startX = 0, startWidth = 0, dragging = false;

  function report() {
    var w = Math.round(box.getBoundingClientRect().width);
    outWidth.textContent = w + 'px';
    outLayout.textContent = w >= 380 ? 'side-by-side' : 'stacked';
  }

  function onMove(e) {
    if (!dragging) return;
    var x = e.touches ? e.touches[0].clientX : e.clientX;
    var next = Math.max(220, Math.min(520, startWidth + (x - startX)));
    box.style.width = next + 'px';
    report();
  }
  function onUp() {
    dragging = false;
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
  }
  handle.addEventListener('pointerdown', function (e) {
    dragging = true;
    startX = e.clientX;
    startWidth = box.getBoundingClientRect().width;
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    e.preventDefault();
  });

  report();
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
