<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Height-Aware Container (container-type: size)">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Height-Aware Container</h1>
    <p class="hint">Drag the corner handle. This box uses <code>container-type: size</code> instead of <code>inline-size</code> — it can query height too, so the description below disappears once the box gets short, no matter how wide it stays.</p>
  </header>
  <main class="stageWrap">
    <div class="resizeBox" id="rzBox" style="width:280px;height:170px">
      <div class="noticeCard">
        <strong class="noticeTitle">Scheduled maintenance</strong>
        <p class="noticeDesc">The billing service will be briefly unavailable Sunday 2–3am UTC while we migrate database indexes.</p>
      </div>
      <div class="resizeHandle" id="rzHandle" aria-hidden="true"></div>
    </div>
    <div class="readout">
      <span>Box: <strong id="readoutValue">280 × 170px</strong></span>
      <span>Description shown: <strong id="readoutState">yes</strong></span>
    </div>
    <pre class="ruleTag">.noticeCard { container-type: size; }
@container (max-height: 120px) {
  .noticeDesc { display: none; }
}</pre>
  </main>
</script>

<script type="text/plain" id="css">
  :root {
    --ink: #14161c;
    --sub: #6b7080;
    --line: #e3e5ea;
    --accent: #6366f1;
  }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 54em; font-size: 12.5px; color: var(--sub); }
  .hint code { background: #eceef3; padding: 1px 5px; border-radius: 4px; }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 14px 16px 26px; }
  .readout {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px 16px;
    font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--sub);
  }
  .readout strong { color: var(--accent); font-weight: 700; }
  .ruleTag {
    font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #3f4252;
    background: #eceef3;
    padding: 8px 14px;
    border-radius: 10px;
    max-width: 100%;
    overflow-x: auto;
    white-space: pre;
  }

  /* container-type: size needs an element with a genuinely definite size on
     both axes — that's why this box, unlike the others in this batch, sets
     height explicitly instead of leaving it to auto. */
  .resizeBox {
    position: relative;
    max-width: 100%;
    box-sizing: border-box;
    border: 1.5px dashed var(--line);
    border-radius: 12px;
    padding: 14px;
    background: #fff;
    overflow: hidden;
  }
  .resizeHandle {
    position: absolute;
    right: 0; bottom: 0;
    width: 20px; height: 20px;
    cursor: nwse-resize;
    background:
      linear-gradient(135deg, transparent 0 50%, var(--line) 50% 60%, transparent 60% 100%),
      linear-gradient(135deg, transparent 0 65%, var(--line) 65% 75%, transparent 75% 100%);
    touch-action: none;
  }
  .resizeHandle:hover { background-color: #eef0ff; }

  .noticeCard {
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow: hidden;

    /* The rule this demo is about — size containment tracks both axes,
       so it can only ever be as reliable as the box's own explicit size. */
    container-type: size;
  }
  .noticeTitle { font-size: 13.5px; }
  .noticeDesc { margin: 0; font-size: 12px; color: var(--sub); }

  @container (max-height: 120px) {
    .noticeDesc { display: none; }
  }
</script>

<script type="text/plain" id="js">
  var box = document.getElementById('rzBox');
  var handle = document.getElementById('rzHandle');
  var outWidth = document.getElementById('readoutValue');
  var outState = document.getElementById('readoutState');
  var startX = 0, startY = 0, startWidth = 0, startHeight = 0, dragging = false;

  function report() {
    var rect = box.getBoundingClientRect();
    var w = Math.round(rect.width), h = Math.round(rect.height);
    outWidth.textContent = w + ' × ' + h + 'px';
    outState.textContent = h > 120 ? 'yes' : 'no';
  }

  function onMove(e) {
    if (!dragging) return;
    var x = e.touches ? e.touches[0].clientX : e.clientX;
    var y = e.touches ? e.touches[0].clientY : e.clientY;
    var nextW = Math.max(200, Math.min(460, startWidth + (x - startX)));
    var nextH = Math.max(70, Math.min(260, startHeight + (y - startY)));
    box.style.width = nextW + 'px';
    box.style.height = nextH + 'px';
    report();
  }
  function onUp() {
    dragging = false;
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
  }
  handle.addEventListener('pointerdown', function (e) {
    dragging = true;
    startX = e.clientX;
    startY = e.clientY;
    var rect = box.getBoundingClientRect();
    startWidth = rect.width;
    startHeight = rect.height;
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    e.preventDefault();
  });

  report();
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
