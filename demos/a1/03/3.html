<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Product Grid With Per-Card Layout">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Product Grid With Per-Card Layout</h1>
    <p class="hint">Drag the grid wider. Watch closely: sometimes a WIDER grid makes each card layout flip back to stacked, because more columns fit and each one gets less room — a per-card reaction a page-level media query has no way to see.</p>
  </header>
  <main class="stageWrap">
    <div class="resizeBox" id="rzBox" style="width:340px">
      <div class="prodGrid">
        <div class="prodItem"><div class="prodCard"><div class="prodImg"></div><div class="prodInfo"><strong>Desk Lamp</strong><span>$34</span></div></div></div>
        <div class="prodItem"><div class="prodCard"><div class="prodImg"></div><div class="prodInfo"><strong>Ceramic Mug</strong><span>$12</span></div></div></div>
        <div class="prodItem"><div class="prodCard"><div class="prodImg"></div><div class="prodInfo"><strong>Wool Throw</strong><span>$58</span></div></div></div>
        <div class="prodItem"><div class="prodCard"><div class="prodImg"></div><div class="prodInfo"><strong>Wall Clock</strong><span>$29</span></div></div></div>
      </div>
      <div class="resizeHandle" id="rzHandle" aria-hidden="true"></div>
    </div>
    <div class="readout">
      <span>Grid width: <strong id="readoutValue">340px</strong></span>
      <span>Approx. column width: <strong id="readoutCol">160px</strong></span>
    </div>
    <pre class="ruleTag">.prodItem { container-type: inline-size; }
@container (min-width: 210px) {
  .prodCard { flex-direction: row; }
}</pre>
  </main>
</script>

<script type="text/plain" id="css">
  :root {
    --ink: #14161c;
    --sub: #6b7080;
    --line: #e3e5ea;
    --accent: #6366f1;
  }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 50em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 14px 16px 26px; }
  .readout {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px 16px;
    font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--sub);
  }
  .readout strong { color: var(--accent); font-weight: 700; }
  .ruleTag {
    font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #3f4252;
    background: #eceef3;
    padding: 8px 14px;
    border-radius: 10px;
    max-width: 100%;
    overflow-x: auto;
    white-space: pre;
  }

  .resizeBox {
    position: relative;
    max-width: 100%;
    min-width: 180px;
    box-sizing: border-box;
    border: 1.5px dashed var(--line);
    border-radius: 12px;
    padding: 14px 22px 14px 14px;
    background: #fff;
  }
  .resizeHandle {
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 16px;
    cursor: ew-resize;
    background: repeating-linear-gradient(90deg, var(--line) 0 2px, transparent 2px 6px);
    border-left: 1px solid var(--line);
    touch-action: none;
  }
  .resizeHandle:hover { background-color: #eef0ff; }

  .prodGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px;
  }
  .prodCard {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
  }
  /* Each grid item is its own query container, sized by the grid column it
     landed in — not by the grid, and not by the viewport. The card inside it
     reacts; an element can't be restyled by a query against itself. */
  .prodItem { container-type: inline-size; }
  .prodImg {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 8px;
    background: linear-gradient(135deg, #a5b4fc, #6366f1);
    flex-shrink: 0;
  }
  .prodInfo { display: flex; flex-direction: column; gap: 2px; font-size: 12.5px; }
  .prodInfo span { color: var(--sub); }

  /* The rule this demo is about. */
  @container (min-width: 210px) {
    .prodCard { flex-direction: row; align-items: center; }
    .prodImg { width: 56px; height: 56px; aspect-ratio: auto; }
  }
</script>

<script type="text/plain" id="js">
  var box = document.getElementById('rzBox');
  var handle = document.getElementById('rzHandle');
  var grid = box.querySelector('.prodGrid');
  var outWidth = document.getElementById('readoutValue');
  var outCol = document.getElementById('readoutCol');
  var startX = 0, startWidth = 0, dragging = false;

  function report() {
    var w = Math.round(box.getBoundingClientRect().width);
    outWidth.textContent = w + 'px';
    var cols = getComputedStyle(grid).gridTemplateColumns.split(' ').length;
    outCol.textContent = Math.round(grid.getBoundingClientRect().width / cols) + 'px';
  }

  function onMove(e) {
    if (!dragging) return;
    var x = e.touches ? e.touches[0].clientX : e.clientX;
    var next = Math.max(180, Math.min(640, startWidth + (x - startX)));
    box.style.width = next + 'px';
    report();
  }
  function onUp() {
    dragging = false;
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
  }
  handle.addEventListener('pointerdown', function (e) {
    dragging = true;
    startX = e.clientX;
    startWidth = box.getBoundingClientRect().width;
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    e.preventDefault();
  });

  report();
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
