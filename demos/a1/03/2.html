<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Same Component, Two Different Containers">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Same Component, Two Different Containers</h1>
    <p class="hint">Identical HTML and CSS, dropped into two containers of different widths on the very same page, at the very same viewport width. A media query could never tell these two apart — a container query does, automatically.</p>
  </header>
  <main class="stageWrap">
    <div class="panelsRow">
      <div class="panel" style="width:130px">
        <span class="panelLabel">130px container</span>
        <nav class="navWidget">
          <a class="navItem" href="javascript:void(0)"><span class="navIcon">&#9737;</span><span class="navLabel">Home</span></a>
          <a class="navItem" href="javascript:void(0)"><span class="navIcon">&#9881;</span><span class="navLabel">Settings</span></a>
          <a class="navItem" href="javascript:void(0)"><span class="navIcon">&#9993;</span><span class="navLabel">Inbox</span></a>
        </nav>
      </div>
      <div class="panel" style="width:280px">
        <span class="panelLabel">280px container</span>
        <nav class="navWidget">
          <a class="navItem" href="javascript:void(0)"><span class="navIcon">&#9737;</span><span class="navLabel">Home</span></a>
          <a class="navItem" href="javascript:void(0)"><span class="navIcon">&#9881;</span><span class="navLabel">Settings</span></a>
          <a class="navItem" href="javascript:void(0)"><span class="navIcon">&#9993;</span><span class="navLabel">Inbox</span></a>
        </nav>
      </div>
    </div>
    <pre class="ruleTag">.navWidget { container-type: inline-size; }
@container (max-width: 200px) {
  .navLabel { display: none; }
}</pre>
  </main>
</script>

<script type="text/plain" id="css">
  :root {
    --ink: #14161c;
    --sub: #6b7080;
    --line: #e3e5ea;
    --accent: #6366f1;
  }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 48em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 14px 16px 26px; }
  .ruleTag {
    font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #3f4252;
    background: #eceef3;
    padding: 8px 14px;
    border-radius: 10px;
    max-width: 100%;
    overflow-x: auto;
    white-space: pre;
  }

  .panelsRow {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-start;
  }
  .panel {
    display: flex;
    flex-direction: column;
    gap: 8px;
    box-sizing: border-box;
    max-width: 100%;
  }
  .panelLabel {
    font: 700 10.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--sub);
    text-align: center;
  }

  .navWidget {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 10px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    background: #fff;

    /* Same rule, applied identically in both panels — the panel it happens
       to sit inside is what decides what happens next. */
    container-type: inline-size;
  }
  .navItem {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 8px;
    color: var(--ink);
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
  }
  .navItem:hover { background: #f2f3f7; }
  .navIcon { flex-shrink: 0; width: 18px; text-align: center; }

  /* The rule this demo is about. */
  @container (max-width: 200px) {
    .navItem { justify-content: center; }
    .navLabel { display: none; }
  }
</script>

<script type="text/plain" id="js">
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
