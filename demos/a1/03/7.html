<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Three-Tier Container Breakpoints">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Three-Tier Container Breakpoints</h1>
    <p class="hint">A settings row with three real container-query breakpoints, not just one — drag across the full range and watch the label, then the value column, appear as the panel actually has room for them.</p>
  </header>
  <main class="stageWrap">
    <div class="resizeBox" id="rzBox" style="width:110px">
      <div class="settingsPanel">
        <div class="settingsRow">
          <span class="rowIcon">&#128274;</span>
          <span class="rowLabel">Two-factor auth</span>
          <span class="rowValue">Enabled</span>
        </div>
        <div class="settingsRow">
          <span class="rowIcon">&#9993;</span>
          <span class="rowLabel">Email alerts</span>
          <span class="rowValue">Weekly</span>
        </div>
      </div>
      <div class="resizeHandle" id="rzHandle" aria-hidden="true"></div>
    </div>
    <div class="readout">
      <span>Panel width: <strong id="readoutValue">110px</strong></span>
      <span>Tier: <strong id="readoutTier">compact</strong></span>
    </div>
    <pre class="ruleTag">@container (min-width: 180px) { .rowLabel { display: inline; } }
@container (min-width: 320px) { .rowValue { display: inline; } }</pre>
  </main>
</script>

<script type="text/plain" id="css">
  :root {
    --ink: #14161c;
    --sub: #6b7080;
    --line: #e3e5ea;
    --accent: #6366f1;
  }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 52em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 14px 16px 26px; }
  .readout {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px 16px;
    font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--sub);
  }
  .readout strong { color: var(--accent); font-weight: 700; }
  .ruleTag {
    font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #3f4252;
    background: #eceef3;
    padding: 8px 14px;
    border-radius: 10px;
    max-width: 100%;
    overflow-x: auto;
    white-space: pre;
  }

  .resizeBox {
    position: relative;
    max-width: 100%;
    min-width: 90px;
    box-sizing: border-box;
    border: 1.5px dashed var(--line);
    border-radius: 12px;
    padding: 14px 22px 14px 14px;
    background: #fff;
  }
  .resizeHandle {
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 16px;
    cursor: ew-resize;
    background: repeating-linear-gradient(90deg, var(--line) 0 2px, transparent 2px 6px);
    border-left: 1px solid var(--line);
    touch-action: none;
  }
  .resizeHandle:hover { background-color: #eef0ff; }

  .settingsPanel {
    display: flex;
    flex-direction: column;
    gap: 6px;

    container-type: inline-size;
  }
  .settingsRow {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 12.5px;
    white-space: nowrap;
  }
  .rowIcon { flex-shrink: 0; }
  .rowLabel { display: none; font-weight: 600; }
  .rowValue { display: none; margin-left: auto; color: var(--sub); }

  /* The rules this demo is about — two independent thresholds on the same
     container, revealing progressively more as there's room for it. */
  @container (min-width: 180px) {
    .rowLabel { display: inline; }
  }
  @container (min-width: 320px) {
    .rowValue { display: inline; }
  }
</script>

<script type="text/plain" id="js">
  var box = document.getElementById('rzBox');
  var handle = document.getElementById('rzHandle');
  var outWidth = document.getElementById('readoutValue');
  var outTier = document.getElementById('readoutTier');
  var startX = 0, startWidth = 0, dragging = false;

  function tierFor(w) {
    if (w >= 320) return 'full';
    if (w >= 180) return 'medium';
    return 'compact';
  }

  function report() {
    var w = Math.round(box.getBoundingClientRect().width);
    outWidth.textContent = w + 'px';
    outTier.textContent = tierFor(w);
  }

  function onMove(e) {
    if (!dragging) return;
    var x = e.touches ? e.touches[0].clientX : e.clientX;
    var next = Math.max(90, Math.min(420, startWidth + (x - startX)));
    box.style.width = next + 'px';
    report();
  }
  function onUp() {
    dragging = false;
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
  }
  handle.addEventListener('pointerdown', function (e) {
    dragging = true;
    startX = e.clientX;
    startWidth = box.getBoundingClientRect().width;
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    e.preventDefault();
  });

  report();
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
