<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Multi-layer depth scene">

<script type="text/plain" id="cdn">
https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js
https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Multi-layer depth scene</h1>
    <p class="hint">Scroll down slowly. Four layers, four speeds &mdash; the further back a layer sits, the less distance it covers.</p>
  </header>
  <div class="spacer">Scroll ↓</div>
  <div class="scene">
    <div class="layer sky" id="sky">Sky &mdash; 0.1x</div>
    <div class="layer hills" id="hills">Hills &mdash; 0.35x</div>
    <div class="layer trees" id="trees">Trees &mdash; 0.65x</div>
    <div class="layer sign" id="sign">Sign &mdash; 1x</div>
  </div>
  <div class="spacer end"></div>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #d97706; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .spacer { height: 220px; display: flex; align-items: center; justify-content: center; color: var(--sub); font: 700 12px system-ui, sans-serif; text-transform: uppercase; letter-spacing: 0.05em; }
  .spacer.end { height: 340px; }
  .scene { position: relative; height: 320px; margin: 0 20px; overflow: hidden; border-radius: 12px; }
  .layer { position: absolute; display: flex; align-items: flex-start; justify-content: center; padding-top: 8px; font: 800 11px system-ui, sans-serif; color: #fff; letter-spacing: 0.03em; }
  .sky { inset: -30px 0 60% 0; background: linear-gradient(180deg, #7dd3fc, #bae6fd); color: #0c4a6e; }
  .hills { left: -10%; right: -10%; bottom: 0; height: 55%; background: #4d7c0f; border-radius: 50% 50% 0 0 / 30px 30px 0 0; }
  .trees { left: -5%; right: -5%; bottom: 0; height: 38%; background: #166534; border-radius: 12px 12px 0 0; }
  .sign { left: 50%; bottom: 20px; width: 150px; height: 60px; margin-left: -75px; background: var(--accent); border-radius: 8px; align-items: center; padding-top: 0; box-shadow: 0 12px 26px rgba(217,119,6,0.45); }
</script>

<script type="text/plain" id="js">
  gsap.registerPlugin(ScrollTrigger);

  var tl = gsap.timeline({
    scrollTrigger: {
      trigger: '.scene',
      start: 'top bottom',
      end: 'bottom top',
      scrub: true
    }
  });

  tl.fromTo('#sky',   { yPercent: -5 },  { yPercent: 5,  ease: 'none' }, 0);
  tl.fromTo('#hills', { yPercent: -12 }, { yPercent: 12, ease: 'none' }, 0);
  tl.fromTo('#trees', { yPercent: -22 }, { yPercent: 22, ease: 'none' }, 0);
  tl.fromTo('#sign',  { yPercent: -35 }, { yPercent: 35, ease: 'none' }, 0);
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
