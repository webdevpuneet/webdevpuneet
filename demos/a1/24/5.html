<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Mouse vs scroll parallax">

<script type="text/plain" id="cdn">
https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js
https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Mouse vs scroll parallax</h1>
    <p class="hint">Move your pointer over the top box &mdash; it reacts to pointer position, not scroll. Scroll past the second box &mdash; that one reacts to scroll position, not the pointer.</p>
  </header>
  <div class="scene" id="mouseScene">
    <p class="label">Pointer-driven (quickTo)</p>
    <div class="layer m1" id="m1"></div>
    <div class="layer m2" id="m2"></div>
  </div>
  <div class="spacer">Scroll ↓</div>
  <div class="scene" id="scrollScene">
    <p class="label">Scroll-driven (ScrollTrigger)</p>
    <div class="layer s1" id="s1"></div>
    <div class="layer s2" id="s2"></div>
  </div>
  <div class="spacer end"></div>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #0891b2; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .spacer { height: 160px; display: flex; align-items: center; justify-content: center; color: var(--sub); font: 700 12px system-ui, sans-serif; text-transform: uppercase; letter-spacing: 0.05em; }
  .spacer.end { height: 200px; }
  .scene { position: relative; height: 190px; margin: 10px 20px; overflow: hidden; border-radius: 12px; background: #eef2f7; }
  .label { position: absolute; top: 8px; left: 12px; margin: 0; font: 700 10.5px system-ui, sans-serif; color: var(--sub); text-transform: uppercase; letter-spacing: 0.05em; z-index: 2; }
  .layer { position: absolute; top: 50%; left: 50%; border-radius: 50%; }
  .m1 { width: 140px; height: 140px; margin: -70px 0 0 -70px; background: #a5f3fc; }
  .m2 { width: 60px; height: 60px; margin: -30px 0 0 -30px; background: var(--accent); box-shadow: 0 10px 20px rgba(8,145,178,0.4); }
  .s1 { width: 140px; height: 140px; margin: -70px 0 0 -70px; background: #c7d2fe; }
  .s2 { width: 60px; height: 60px; margin: -30px 0 0 -30px; background: #4f46e5; box-shadow: 0 10px 20px rgba(79,70,229,0.4); }
</script>

<script type="text/plain" id="js">
  gsap.registerPlugin(ScrollTrigger);

  // --- Pointer-driven parallax: quickTo reacts to mousemove, no scroll involved ---
  var mouseScene = document.getElementById('mouseScene');
  var moveM1 = gsap.quickTo('#m1', 'x', { duration: 0.6, ease: 'power3' });
  var moveM1y = gsap.quickTo('#m1', 'y', { duration: 0.6, ease: 'power3' });
  var moveM2 = gsap.quickTo('#m2', 'x', { duration: 0.35, ease: 'power3' });
  var moveM2y = gsap.quickTo('#m2', 'y', { duration: 0.35, ease: 'power3' });

  mouseScene.addEventListener('mousemove', function (e) {
    var rect = mouseScene.getBoundingClientRect();
    var relX = (e.clientX - rect.left) / rect.width - 0.5;
    var relY = (e.clientY - rect.top) / rect.height - 0.5;
    moveM1(relX * 20);
    moveM1y(relY * 20);
    moveM2(relX * 50);
    moveM2y(relY * 50);
  });

  mouseScene.addEventListener('mouseleave', function () {
    moveM1(0); moveM1y(0); moveM2(0); moveM2y(0);
  });

  // --- Scroll-driven parallax: same visual idea, driven by ScrollTrigger's scrub ---
  var tl = gsap.timeline({
    scrollTrigger: {
      trigger: '#scrollScene',
      start: 'top bottom',
      end: 'bottom top',
      scrub: true
    }
  });
  tl.fromTo('#s1', { yPercent: -12 }, { yPercent: 12, ease: 'none' }, 0);
  tl.fromTo('#s2', { yPercent: -30 }, { yPercent: 30, ease: 'none' }, 0);
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
