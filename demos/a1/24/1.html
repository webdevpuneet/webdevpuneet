<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Two-layer parallax">

<script type="text/plain" id="cdn">
https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js
https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Two-layer parallax</h1>
    <p class="hint">Scroll down inside the preview. The background layer drifts slower than the foreground card &mdash; that speed gap is the entire effect.</p>
  </header>
  <div class="spacer">Scroll ↓</div>
  <div class="scene">
    <div class="layer bg" id="bg">Background &mdash; 0.3x</div>
    <div class="layer fg" id="fg">Foreground &mdash; 1x</div>
  </div>
  <div class="spacer end"></div>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #16a34a; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .spacer { height: 220px; display: flex; align-items: center; justify-content: center; color: var(--sub); font: 700 12px system-ui, sans-serif; text-transform: uppercase; letter-spacing: 0.05em; }
  .spacer.end { height: 320px; }
  .scene { position: relative; height: 320px; margin: 0 20px; overflow: hidden; border-radius: 12px; }
  .layer { position: absolute; display: flex; align-items: center; justify-content: center; font: 800 13px system-ui, sans-serif; color: #fff; letter-spacing: 0.03em; }
  .bg { inset: -40px 0; background: linear-gradient(135deg, #0f172a, #1e293b); }
  .fg { left: 50%; top: 50%; width: 200px; height: 120px; margin: -60px 0 0 -100px; background: var(--accent); border-radius: 12px; box-shadow: 0 18px 36px rgba(22,163,74,0.4); }
</script>

<script type="text/plain" id="js">
  gsap.registerPlugin(ScrollTrigger);

  var tl = gsap.timeline({
    scrollTrigger: {
      trigger: '.scene',
      start: 'top bottom',
      end: 'bottom top',
      scrub: true
    }
  });

  tl.fromTo('#bg', { yPercent: -15 }, { yPercent: 15, ease: 'none' }, 0);
  tl.fromTo('#fg', { yPercent: -50 }, { yPercent: 50, ease: 'none' }, 0);
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
