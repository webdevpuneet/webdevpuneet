<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Dynamically Added and Removed Tabs">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Dynamically added and removed tabs</h1>
    <p class="hint">Click "Add tab" twice, then "Remove active tab" once. Watch the log for how many tabs currently have tabindex="0" -- it should always be exactly one.</p>
  </header>
  <main class="stageWrap">
    <div class="cols">
      <div class="col">
        <h2 class="colTitle bad">Broken (tabindex not recalculated)</h2>
        <div class="tablist" id="badTablist" role="tablist" aria-label="Open items"></div>
        <div class="panel" id="badPanel"></div>
        <div class="btnRow">
          <button type="button" class="miniBtn" id="badAdd">+ Add tab</button>
          <button type="button" class="miniBtn" id="badRemove">- Remove active tab</button>
        </div>
        <p class="stat">tabindex="0" count: <span id="badZeroCount">1</span></p>
        <div class="log" id="badLog"></div>
      </div>
      <div class="col">
        <h2 class="colTitle good">Fixed (roving tabindex recalculated)</h2>
        <div class="tablist" id="goodTablist" role="tablist" aria-label="Open items"></div>
        <div class="panel" id="goodPanel"></div>
        <div class="btnRow">
          <button type="button" class="miniBtn" id="goodAdd">+ Add tab</button>
          <button type="button" class="miniBtn" id="goodRemove">- Remove active tab</button>
        </div>
        <p class="stat">tabindex="0" count: <span id="goodZeroCount">1</span></p>
        <div class="log" id="goodLog"></div>
      </div>
    </div>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; --green: #16a34a; --red: #dc2626; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 52em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px 16px 28px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%; max-width: 640px; }
  .col { background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 14px; }
  .colTitle { margin: 0 0 10px; font: 700 12px ui-monospace, monospace; padding: 5px 8px; border-radius: 6px; display: inline-block; }
  .colTitle.bad { color: var(--red); background: #fdeaea; }
  .colTitle.good { color: var(--green); background: #e8f7ee; }
  .tablist { display: flex; gap: 3px; border-bottom: 2px solid var(--line); flex-wrap: wrap; min-height: 30px; }
  .tab { padding: 7px 9px; border: none; background: transparent; font: 700 11.5px system-ui, sans-serif; color: var(--sub); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; border-radius: 6px 6px 0 0; }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
  .panel { padding: 8px 4px; font-size: 12px; color: var(--ink); min-height: 20px; }
  .btnRow { display: flex; gap: 6px; margin-top: 4px; }
  .miniBtn { padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); background: #fff; font: 700 11px system-ui, sans-serif; cursor: pointer; }
  .miniBtn:hover { border-color: var(--accent); }
  .stat { margin: 8px 0 0; font: 800 13px ui-monospace, monospace; }
  .log { margin-top: 6px; background: #0f1117; color: #c9d1d9; border-radius: 8px; padding: 8px 10px; font: 11px ui-monospace, monospace; max-height: 90px; overflow-y: auto; }
  .log div { padding: 1px 0; }
  .log .ok { color: #4ade80; }
  .log .err { color: #f87171; }
</script>

<script type="text/plain" id="js">
  function logLine(logEl, text, cls) {
    var line = document.createElement('div');
    if (cls) line.className = cls;
    line.textContent = text;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
    while (logEl.children.length > 6) logEl.removeChild(logEl.firstChild);
  }

  function makeWidget(tablistEl, panelEl, addBtn, removeBtn, zeroCountEl, log, fixMode) {
    var names = ['Item 1', 'Item 2'];
    var activeIdx = 0;
    var nextNum = 3;

    function render() {
      tablistEl.innerHTML = '';
      for (var i = 0; i < names.length; i++) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'tab' + (i === activeIdx ? ' active' : '');
        btn.setAttribute('role', 'tab');
        btn.setAttribute('aria-selected', i === activeIdx ? 'true' : 'false');
        // BROKEN mode: every newly created tab defaults to tabindex 0 and
        // old tabs are never revisited, so multiple tabs end up tabbable.
        // FIXED mode: tabindex is recalculated for ALL tabs on every render.
        if (fixMode) {
          btn.tabIndex = (i === activeIdx) ? 0 : -1;
        } else {
          btn.tabIndex = 0;
        }
        btn.textContent = names[i];
        (function (idx) {
          btn.addEventListener('click', function () { activeIdx = idx; render(); });
        })(i);
        tablistEl.appendChild(btn);
      }
      panelEl.textContent = 'Panel: ' + names[activeIdx];
      var zeroCount = 0;
      var kids = tablistEl.children;
      for (var k = 0; k < kids.length; k++) { if (kids[k].tabIndex === 0) zeroCount++; }
      zeroCountEl.textContent = zeroCount;
      if (zeroCount !== 1) {
        logLine(log, zeroCount + ' tabs have tabindex="0" right now -- Tab key entry is ambiguous or broken.', 'err');
      } else {
        logLine(log, 'exactly 1 tab has tabindex="0" ("' + names[activeIdx] + '").', 'ok');
      }
    }

    addBtn.addEventListener('click', function () {
      names.push('Item ' + nextNum);
      nextNum += 1;
      if (!fixMode) {
        // BROKEN: newly added tab is NOT made the active one, and its
        // default tabindex of 0 just sits alongside the old active tab's 0.
      } else {
        activeIdx = names.length - 1;
      }
      render();
    });

    removeBtn.addEventListener('click', function () {
      if (names.length <= 1) return;
      names.splice(activeIdx, 1);
      if (activeIdx >= names.length) {
        if (fixMode) activeIdx = names.length - 1;
        else activeIdx = names.length; // BROKEN: leaves an out-of-range/undefined active index
      }
      render();
    });

    render();
  }

  makeWidget(
    document.getElementById('badTablist'), document.getElementById('badPanel'),
    document.getElementById('badAdd'), document.getElementById('badRemove'),
    document.getElementById('badZeroCount'), document.getElementById('badLog'), false
  );

  makeWidget(
    document.getElementById('goodTablist'), document.getElementById('goodPanel'),
    document.getElementById('goodAdd'), document.getElementById('goodRemove'),
    document.getElementById('goodZeroCount'), document.getElementById('goodLog'), true
  );
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
