<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Roving Tabindex: Only the Active Tab Should Be Tabbable">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Roving tabindex: only the active tab should be tabbable</h1>
    <p class="hint">Click the first tab to focus it, then press Tab repeatedly and count how many presses it takes to reach the "Continue" link below the panel.</p>
  </header>
  <main class="stageWrap">
    <div class="cols">
      <div class="col">
        <h2 class="colTitle bad">Broken (all tabs are tabbable)</h2>
        <div class="tablist" id="badTablist" role="tablist" aria-label="Checkout steps">
          <button type="button" class="tab active" id="badTab0" role="tab" aria-selected="true" data-idx="0">Cart</button>
          <button type="button" class="tab" id="badTab1" role="tab" aria-selected="false" data-idx="1">Shipping</button>
          <button type="button" class="tab" id="badTab2" role="tab" aria-selected="false" data-idx="2">Payment</button>
        </div>
        <div class="panel" id="badPanel">Step content for the active tab.</div>
        <a href="#" class="afterLink" id="badLink">Continue &rarr;</a>
        <p class="stat">Tab presses to escape tablist: <span id="badCount">0</span></p>
        <div class="log" id="badLog"></div>
      </div>
      <div class="col">
        <h2 class="colTitle good">Fixed (roving tabindex)</h2>
        <div class="tablist" id="goodTablist" role="tablist" aria-label="Checkout steps">
          <button type="button" class="tab active" id="goodTab0" role="tab" aria-selected="true" tabindex="0" data-idx="0">Cart</button>
          <button type="button" class="tab" id="goodTab1" role="tab" aria-selected="false" tabindex="-1" data-idx="1">Shipping</button>
          <button type="button" class="tab" id="goodTab2" role="tab" aria-selected="false" tabindex="-1" data-idx="2">Payment</button>
        </div>
        <div class="panel" id="goodPanel">Step content for the active tab.</div>
        <a href="#" class="afterLink" id="goodLink">Continue &rarr;</a>
        <p class="stat">Tab presses to escape tablist: <span id="goodCount">0</span></p>
        <div class="log" id="goodLog"></div>
      </div>
    </div>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; --green: #16a34a; --red: #dc2626; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 52em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px 16px 28px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%; max-width: 640px; }
  .col { background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 14px; }
  .colTitle { margin: 0 0 10px; font: 700 12px ui-monospace, monospace; padding: 5px 8px; border-radius: 6px; display: inline-block; }
  .colTitle.bad { color: var(--red); background: #fdeaea; }
  .colTitle.good { color: var(--green); background: #e8f7ee; }
  .tablist { display: flex; gap: 4px; border-bottom: 2px solid var(--line); }
  .tab { padding: 8px 10px; border: none; background: transparent; font: 700 12px system-ui, sans-serif; color: var(--sub); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; border-radius: 6px 6px 0 0; }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
  .panel { padding: 10px 4px; font-size: 12.5px; color: var(--ink); line-height: 1.5; min-height: 30px; }
  .afterLink { display: inline-block; font: 700 12px system-ui, sans-serif; color: var(--accent); text-decoration: none; padding: 4px 2px; }
  .afterLink:focus { outline: 2px solid var(--accent); }
  .stat { margin: 8px 0 0; font: 800 13px ui-monospace, monospace; }
  .log { margin-top: 6px; background: #0f1117; color: #c9d1d9; border-radius: 8px; padding: 8px 10px; font: 11px ui-monospace, monospace; max-height: 90px; overflow-y: auto; }
  .log div { padding: 1px 0; }
  .log .ok { color: #4ade80; }
  .log .warn { color: #fbbf24; }
</script>

<script type="text/plain" id="js">
  function logLine(logEl, text, cls) {
    var line = document.createElement('div');
    if (cls) line.className = cls;
    line.textContent = text;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
    while (logEl.children.length > 6) logEl.removeChild(logEl.firstChild);
  }

  function setupBad() {
    var tabs = [document.getElementById('badTab0'), document.getElementById('badTab1'), document.getElementById('badTab2')];
    var link = document.getElementById('badLink');
    var countEl = document.getElementById('badCount');
    var log = document.getElementById('badLog');
    var count = 0;
    var armed = false;

    logLine(log, 'every tab button uses the native default tabindex (0).', 'warn');

    for (var i = 0; i < tabs.length; i++) {
      tabs[i].addEventListener('focus', function (e) {
        if (!armed) { armed = true; count = 0; }
        else { count += 1; countEl.textContent = count; logLine(log, 'Tab landed on "' + e.target.textContent + '" (still inside tablist)', 'warn'); }
      });
    }
    link.addEventListener('focus', function () {
      if (armed) { logLine(log, 'Reached "Continue" after ' + count + ' extra Tab press(es).', 'warn'); armed = false; }
    });
    link.addEventListener('click', function (e) { e.preventDefault(); });
  }

  function setupGood() {
    var tabs = [document.getElementById('goodTab0'), document.getElementById('goodTab1'), document.getElementById('goodTab2')];
    var link = document.getElementById('goodLink');
    var countEl = document.getElementById('goodCount');
    var log = document.getElementById('goodLog');
    var count = 0;
    var armed = false;

    logLine(log, 'only the active tab has tabindex="0"; the rest are -1.', 'ok');

    function activate(idx) {
      for (var j = 0; j < tabs.length; j++) {
        tabs[j].classList.remove('active');
        tabs[j].setAttribute('aria-selected', 'false');
        tabs[j].tabIndex = -1;
      }
      tabs[idx].classList.add('active');
      tabs[idx].setAttribute('aria-selected', 'true');
      tabs[idx].tabIndex = 0;
    }

    for (var i = 0; i < tabs.length; i++) {
      (function (idx) {
        tabs[idx].addEventListener('click', function () { activate(idx); tabs[idx].focus(); });
        tabs[idx].addEventListener('focus', function (e) {
          if (!armed) { armed = true; count = 0; }
        });
      })(i);
    }
    link.addEventListener('focus', function () {
      if (armed) { logLine(log, 'Reached "Continue" in a single Tab press -- roving tabindex skipped the other two tabs.', 'ok'); armed = false; countEl.textContent = '1'; }
    });
    link.addEventListener('click', function (e) { e.preventDefault(); });
  }

  setupBad();
  setupGood();
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
