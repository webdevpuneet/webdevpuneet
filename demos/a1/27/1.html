<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Plain Divs vs the WAI-ARIA Tabs Pattern">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Plain divs vs. the WAI-ARIA tabs pattern</h1>
    <p class="hint">Click each tab, then check the accessibility log below it. The broken version is built from clickable divs with no ARIA roles at all; the fixed version wires up role="tablist"/"tab"/"tabpanel" and aria-selected.</p>
  </header>
  <main class="stageWrap">
    <div class="cols">
      <div class="col">
        <h2 class="colTitle bad">Broken (plain divs)</h2>
        <div class="tablist" id="badTablist">
          <div class="tab active" id="badTab0" data-idx="0">Profile</div>
          <div class="tab" id="badTab1" data-idx="1">Billing</div>
          <div class="tab" id="badTab2" data-idx="2">Security</div>
        </div>
        <div class="panel" id="badPanel0">Your profile details go here.</div>
        <div class="panel" id="badPanel1" style="display:none;">Billing history and invoices go here.</div>
        <div class="panel" id="badPanel2" style="display:none;">Password and two-factor settings go here.</div>
        <div class="log" id="badLog"></div>
      </div>
      <div class="col">
        <h2 class="colTitle good">Fixed (ARIA tabs)</h2>
        <div class="tablist" id="goodTablist" role="tablist" aria-label="Account settings">
          <button type="button" class="tab active" id="goodTab0" role="tab" aria-selected="true" aria-controls="goodPanel0" data-idx="0">Profile</button>
          <button type="button" class="tab" id="goodTab1" role="tab" aria-selected="false" aria-controls="goodPanel1" data-idx="1">Billing</button>
          <button type="button" class="tab" id="goodTab2" role="tab" aria-selected="false" aria-controls="goodPanel2" data-idx="2">Security</button>
        </div>
        <div class="panel" id="goodPanel0" role="tabpanel" aria-labelledby="goodTab0">Your profile details go here.</div>
        <div class="panel" id="goodPanel1" role="tabpanel" aria-labelledby="goodTab1" hidden>Billing history and invoices go here.</div>
        <div class="panel" id="goodPanel2" role="tabpanel" aria-labelledby="goodTab2" hidden>Password and two-factor settings go here.</div>
        <div class="log" id="goodLog"></div>
      </div>
    </div>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; --green: #16a34a; --red: #dc2626; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 52em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px 16px 28px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%; max-width: 640px; }
  .col { background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 14px; }
  .colTitle { margin: 0 0 10px; font: 700 12px ui-monospace, monospace; padding: 5px 8px; border-radius: 6px; display: inline-block; }
  .colTitle.bad { color: var(--red); background: #fdeaea; }
  .colTitle.good { color: var(--green); background: #e8f7ee; }
  .tablist { display: flex; gap: 4px; border-bottom: 2px solid var(--line); }
  .tab { padding: 8px 10px; border: none; background: transparent; font: 700 12px system-ui, sans-serif; color: var(--sub); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; border-radius: 6px 6px 0 0; }
  .tab:hover { color: var(--ink); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
  .panel { padding: 12px 4px; font-size: 12.5px; color: var(--ink); line-height: 1.5; min-height: 44px; }
  .log { margin-top: 8px; background: #0f1117; color: #c9d1d9; border-radius: 8px; padding: 8px 10px; font: 11px ui-monospace, monospace; max-height: 110px; overflow-y: auto; }
  .log div { padding: 1px 0; }
  .log .ok { color: #4ade80; }
  .log .warn { color: #fbbf24; }
</script>

<script type="text/plain" id="js">
  function logLine(logEl, text, cls) {
    var line = document.createElement('div');
    if (cls) line.className = cls;
    line.textContent = text;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
    while (logEl.children.length > 8) logEl.removeChild(logEl.firstChild);
  }

  function setupBad() {
    var tabs = [document.getElementById('badTab0'), document.getElementById('badTab1'), document.getElementById('badTab2')];
    var panels = [document.getElementById('badPanel0'), document.getElementById('badPanel1'), document.getElementById('badPanel2')];
    var log = document.getElementById('badLog');
    logLine(log, 'No role/aria attributes present on any element.', 'warn');

    for (var i = 0; i < tabs.length; i++) {
      (function (idx) {
        tabs[idx].addEventListener('click', function () {
          for (var j = 0; j < tabs.length; j++) {
            tabs[j].classList.remove('active');
            panels[j].style.display = 'none';
          }
          tabs[idx].classList.add('active');
          panels[idx].style.display = 'block';
          logLine(log, 'tag=' + tabs[idx].tagName.toLowerCase() + ' role=(none) aria-selected=(none) tabindex=' + (tabs[idx].tabIndex), 'warn');
        });
      })(i);
    }
  }

  function setupGood() {
    var tabs = [document.getElementById('goodTab0'), document.getElementById('goodTab1'), document.getElementById('goodTab2')];
    var panels = [document.getElementById('goodPanel0'), document.getElementById('goodPanel1'), document.getElementById('goodPanel2')];
    var log = document.getElementById('goodLog');
    logLine(log, 'tablist/tab/tabpanel roles present, aria-selected wired up.', 'ok');

    for (var i = 0; i < tabs.length; i++) {
      (function (idx) {
        tabs[idx].addEventListener('click', function () {
          for (var j = 0; j < tabs.length; j++) {
            tabs[j].classList.remove('active');
            tabs[j].setAttribute('aria-selected', 'false');
            panels[j].hidden = true;
          }
          tabs[idx].classList.add('active');
          tabs[idx].setAttribute('aria-selected', 'true');
          panels[idx].hidden = false;
          logLine(log, 'tag=button role=tab aria-selected=true aria-controls=' + tabs[idx].getAttribute('aria-controls'), 'ok');
        });
      })(i);
    }
  }

  setupBad();
  setupGood();
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
