<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="duration and delay">

<script type="text/plain" id="cdn">
https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>duration &amp; delay</h1>
    <p class="hint">Each box has the same 0.6s <code>duration</code> but a different <code>delay</code> — watch how far apart their start times land, even though they all take the same time to finish.</p>
  </header>
  <main class="stageWrap">
    <div class="col"><div class="box" id="b0">delay: 0s</div></div>
    <div class="col"><div class="box" id="b1">delay: 0.4s</div></div>
    <div class="col"><div class="box" id="b2">delay: 0.8s</div></div>
  </main>
  <div class="btnRow">
    <button class="runBtn" id="runBtn">Run all three</button>
  </div>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #10b981; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .hint code { background: #eceef3; padding: 1px 5px; border-radius: 4px; }
  .stageWrap { display: flex; justify-content: center; gap: 16px; align-items: flex-end; height: 200px; padding: 0 20px; }
  .col { display: flex; align-items: flex-end; height: 140px; }
  .box {
    width: 90px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 4px;
    background: var(--accent);
    color: #fff;
    font: 700 11px ui-monospace, monospace;
    border-radius: 10px;
    opacity: 0.35;
  }
  .btnRow { display: flex; justify-content: center; padding: 0 20px 32px; }
  .runBtn { padding: 10px 18px; font: 700 13px system-ui, sans-serif; color: #fff; background: var(--accent); border: none; border-radius: 8px; cursor: pointer; }
  .runBtn:hover { background: #059669; }
</script>

<script type="text/plain" id="js">
  document.getElementById('runBtn').addEventListener('click', function () {
    gsap.fromTo('#b0', { y: 60, opacity: 0.35 }, { y: 0, opacity: 1, duration: 0.6, delay: 0 });
    gsap.fromTo('#b1', { y: 60, opacity: 0.35 }, { y: 0, opacity: 1, duration: 0.6, delay: 0.4 });
    gsap.fromTo('#b2', { y: 60, opacity: 0.35 }, { y: 0, opacity: 1, duration: 0.6, delay: 0.8 });
  });
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
