<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="gsap.timeline() — chaining tweens">

<script type="text/plain" id="cdn">
https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>gsap.timeline()</h1>
    <p class="hint">Four separate tweens, one after another, with zero manual delay math — a timeline plays each step only once the previous one finishes.</p>
  </header>
  <main class="stageWrap">
    <div class="box" id="box">1</div>
  </main>
  <div class="btnRow">
    <button class="runBtn" id="runBtn">Play timeline</button>
  </div>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; font-family: ui-monospace, monospace; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; justify-content: center; align-items: center; height: 220px; }
  .box {
    width: 80px;
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--accent);
    color: #fff;
    font: 800 20px system-ui, sans-serif;
    border-radius: 12px;
  }
  .btnRow { display: flex; justify-content: center; padding: 0 20px 32px; }
  .runBtn { padding: 10px 18px; font: 700 13px system-ui, sans-serif; color: #fff; background: var(--accent); border: none; border-radius: 8px; cursor: pointer; }
  .runBtn:hover { background: #4f52d9; }
</script>

<script type="text/plain" id="js">
  const box = document.getElementById('box');

  document.getElementById('runBtn').addEventListener('click', function () {
    gsap.set(box, { x: 0, y: 0, rotation: 0, scale: 1, backgroundColor: '#6366f1' });

    const tl = gsap.timeline();
    tl.to(box, { x: 120, duration: 0.6, onStart: function () { box.textContent = '2'; } })
      .to(box, { y: 60, duration: 0.6, onStart: function () { box.textContent = '3'; } })
      .to(box, { rotation: 180, backgroundColor: '#f59e0b', duration: 0.6, onStart: function () { box.textContent = '4'; } })
      .to(box, { x: 0, y: 0, rotation: 360, scale: 1.15, backgroundColor: '#16a34a', duration: 0.8, onStart: function () { box.textContent = '5'; } })
      .to(box, { scale: 1, duration: 0.3, onComplete: function () { box.textContent = '1'; } });
  });
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
