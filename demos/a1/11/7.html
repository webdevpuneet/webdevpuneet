<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="stagger — animating a group">

<script type="text/plain" id="cdn">
https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>stagger</h1>
    <p class="hint">One <code>gsap.from()</code> call, ten bars, one <code>stagger</code> value — no loop, no per-element delay math.</p>
  </header>
  <main class="bars" id="bars">
    <div class="col" style="height:70px"></div>
    <div class="col" style="height:120px"></div>
    <div class="col" style="height:50px"></div>
    <div class="col" style="height:140px"></div>
    <div class="col" style="height:90px"></div>
    <div class="col" style="height:150px"></div>
    <div class="col" style="height:60px"></div>
    <div class="col" style="height:110px"></div>
    <div class="col" style="height:80px"></div>
    <div class="col" style="height:130px"></div>
  </main>
  <div class="btnRow">
    <button class="runBtn" id="runBtn">Run with stagger</button>
  </div>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #0ea5e9; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; font-family: ui-monospace, monospace; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .hint code { background: #eceef3; padding: 1px 5px; border-radius: 4px; }
  .bars { display: flex; align-items: flex-end; justify-content: center; gap: 8px; height: 170px; padding: 0 20px; }
  .col { width: 24px; background: var(--accent); border-radius: 6px 6px 0 0; transform-origin: bottom; }
  .btnRow { display: flex; justify-content: center; padding: 24px 20px 32px; }
  .runBtn { padding: 10px 18px; font: 700 13px system-ui, sans-serif; color: #fff; background: var(--accent); border: none; border-radius: 8px; cursor: pointer; }
  .runBtn:hover { background: #0284c7; }
</script>

<script type="text/plain" id="js">
  document.getElementById('runBtn').addEventListener('click', function () {
    // gsap.from() animates FROM scaleY:0 back to each bar's real CSS height —
    // stagger spreads that same animation's start time across all ten targets.
    gsap.from('.col', {
      scaleY: 0,
      duration: 0.5,
      stagger: 0.07,
      ease: 'power2.out'
    });
  });
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
