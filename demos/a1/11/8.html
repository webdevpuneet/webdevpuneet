<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="repeat and yoyo — looping">

<script type="text/plain" id="cdn">
https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>repeat &amp; yoyo</h1>
    <p class="hint">Toggle each option and press Start — <code>repeat: -1</code> loops forever, and <code>yoyo: true</code> reverses each time instead of snapping back to the start.</p>
  </header>
  <main class="stageWrap">
    <div class="pulse" id="pulse"></div>
  </main>
  <div class="controls">
    <label><input type="checkbox" id="yoyoBox" checked> yoyo</label>
    <label>repeat: <select id="repeatSel">
      <option value="-1" selected>-1 (forever)</option>
      <option value="1">1</option>
      <option value="3">3</option>
    </select></label>
  </div>
  <div class="btnRow">
    <button class="runBtn" id="startBtn">Start</button>
    <button class="resetBtn" id="stopBtn">Stop</button>
  </div>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #ec4899; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; font-family: ui-monospace, monospace; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .hint code { background: #eceef3; padding: 1px 5px; border-radius: 4px; }
  .stageWrap { display: flex; justify-content: center; align-items: center; height: 180px; }
  .pulse { width: 70px; height: 70px; border-radius: 50%; background: var(--accent); }
  .controls { display: flex; justify-content: center; gap: 20px; padding: 4px 20px; font: 600 12.5px system-ui, sans-serif; }
  .controls select { font: inherit; padding: 2px 4px; }
  .btnRow { display: flex; justify-content: center; gap: 10px; padding: 16px 20px 32px; }
  .runBtn, .resetBtn { padding: 10px 18px; font: 700 13px system-ui, sans-serif; border: none; border-radius: 8px; cursor: pointer; }
  .runBtn { color: #fff; background: var(--accent); }
  .runBtn:hover { background: #db2777; }
  .resetBtn { color: var(--ink); background: #fff; border: 1.5px solid var(--line); }
</script>

<script type="text/plain" id="js">
  const pulse = document.getElementById('pulse');
  let tween = null;

  document.getElementById('startBtn').addEventListener('click', function () {
    if (tween) tween.kill();
    gsap.set(pulse, { scale: 1 });
    tween = gsap.to(pulse, {
      scale: 1.5,
      duration: 0.6,
      ease: 'power1.inOut',
      yoyo: document.getElementById('yoyoBox').checked,
      repeat: parseInt(document.getElementById('repeatSel').value, 10)
    });
  });

  document.getElementById('stopBtn').addEventListener('click', function () {
    if (tween) tween.kill();
    gsap.to(pulse, { scale: 1, duration: 0.3 });
  });
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
