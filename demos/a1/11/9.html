<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Hover-triggered animation">

<script type="text/plain" id="cdn">
https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Animating on a real event</h1>
    <p class="hint">Hover the card — no autoplay, no click. This is how most GSAP animations actually ship in real interfaces: tied to a genuine user interaction.</p>
  </header>
  <main class="stageWrap">
    <div class="card" id="card">
      <div class="icon">🚀</div>
      <h3>Hover me</h3>
      <p>Two tweens run on mouseenter, and reverse themselves on mouseleave.</p>
    </div>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; justify-content: center; align-items: center; height: 260px; }
  .card {
    width: 220px;
    padding: 26px 22px;
    text-align: center;
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 16px;
    box-shadow: 0 10px 26px rgba(15,23,42,0.06);
    cursor: pointer;
  }
  .icon { font-size: 30px; margin-bottom: 8px; display: inline-block; }
  .card h3 { margin: 0 0 6px; font-size: 15px; }
  .card p { margin: 0; font-size: 12px; line-height: 1.5; color: var(--sub); }
</script>

<script type="text/plain" id="js">
  const card = document.getElementById('card');
  const icon = card.querySelector('.icon');

  card.addEventListener('mouseenter', function () {
    gsap.to(card, { y: -8, boxShadow: '0 20px 40px rgba(99,102,241,0.25)', duration: 0.3, ease: 'power2.out' });
    gsap.to(icon, { rotation: 15, scale: 1.2, duration: 0.3, ease: 'back.out(2)' });
  });

  card.addEventListener('mouseleave', function () {
    gsap.to(card, { y: 0, boxShadow: '0 10px 26px rgba(15,23,42,0.06)', duration: 0.3 });
    gsap.to(icon, { rotation: 0, scale: 1, duration: 0.3 });
  });
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
