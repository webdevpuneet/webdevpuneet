<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="gsap.from() — animate from a state">

<script type="text/plain" id="cdn">
https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>gsap.from()</h1>
    <p class="hint"><code>gsap.from()</code> is the mirror image of <code>gsap.to()</code> — it animates <em>from</em> the values you give it back to wherever the element already was (its normal CSS position).</p>
  </header>
  <main class="stageWrap">
    <div class="box" id="box">Card content</div>
  </main>
  <div class="btnRow">
    <button class="runBtn" id="runBtn">Run gsap.from()</button>
  </div>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #0ea5e9; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; font-family: ui-monospace, monospace; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .hint code { background: #eceef3; padding: 1px 5px; border-radius: 4px; }
  .stageWrap { display: flex; justify-content: center; align-items: center; height: 200px; }
  .box {
    width: 220px;
    padding: 24px;
    text-align: center;
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    font: 700 14px system-ui, sans-serif;
    box-shadow: 0 10px 26px rgba(15,23,42,0.08);
  }
  .btnRow { display: flex; justify-content: center; padding: 0 20px 32px; }
  .runBtn { padding: 10px 18px; font: 700 13px system-ui, sans-serif; color: #fff; background: var(--accent); border: none; border-radius: 8px; cursor: pointer; }
  .runBtn:hover { background: #0284c7; }
</script>

<script type="text/plain" id="js">
  const box = document.getElementById('box');

  document.getElementById('runBtn').addEventListener('click', function () {
    // The card is already sitting in its normal spot. gsap.from() rewinds it
    // to the values given here (invisible, shifted up, scaled down) and then
    // plays forward automatically to its real CSS state — nothing about the
    // card's actual layout position ever changes.
    gsap.from(box, {
      opacity: 0,
      y: -40,
      scale: 0.8,
      duration: 0.8,
      ease: 'back.out(1.7)'
    });
  });
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
