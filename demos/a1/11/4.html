<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Easing — same move, different feel">

<script type="text/plain" id="cdn">
https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Easing changes everything</h1>
    <p class="hint">Same distance, same duration, four different <code>ease</code> values. Click Run and watch how differently each one feels.</p>
  </header>
  <main class="lanes" id="lanes">
    <div class="lane"><span class="label">linear</span><div class="track"><div class="dot" data-ease="none"></div></div></div>
    <div class="lane"><span class="label">power2.out</span><div class="track"><div class="dot" data-ease="power2.out"></div></div></div>
    <div class="lane"><span class="label">back.out(2)</span><div class="track"><div class="dot" data-ease="back.out(2)"></div></div></div>
    <div class="lane"><span class="label">bounce.out</span><div class="track"><div class="dot" data-ease="bounce.out"></div></div></div>
  </main>
  <div class="btnRow">
    <button class="runBtn" id="runBtn">Run</button>
  </div>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #ec4899; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .hint code { background: #eceef3; padding: 1px 5px; border-radius: 4px; }
  .lanes { max-width: 420px; margin: 0 auto; padding: 10px 20px; display: flex; flex-direction: column; gap: 18px; }
  .lane { display: flex; align-items: center; gap: 12px; }
  .label { width: 92px; flex-shrink: 0; font: 700 11.5px ui-monospace, monospace; color: var(--sub); text-align: right; }
  .track { position: relative; flex: 1; height: 26px; background: #eceef3; border-radius: 13px; }
  .dot { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); }
  .btnRow { display: flex; justify-content: center; padding: 24px 20px 32px; }
  .runBtn { padding: 10px 18px; font: 700 13px system-ui, sans-serif; color: #fff; background: var(--accent); border: none; border-radius: 8px; cursor: pointer; }
  .runBtn:hover { background: #db2777; }
</script>

<script type="text/plain" id="js">
  document.getElementById('runBtn').addEventListener('click', function () {
    document.querySelectorAll('.dot').forEach(function (dot) {
      const track = dot.parentElement;
      const travel = track.clientWidth - dot.clientWidth - 6;
      gsap.fromTo(dot, { x: 0 }, { x: travel, duration: 1.4, ease: dot.dataset.ease });
    });
  });
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
