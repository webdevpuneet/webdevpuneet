<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Nesting Container Queries Inline">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Nesting container queries inline</h1>
    <p class="hint">Drag the panel's bottom-right corner to resize it. A <code>@container</code> query is written directly inside the <code>.card</code> rule&mdash;no separate block wrapping the selector from the outside.</p>
  </header>
  <main class="stageWrap">
    <div class="panel" id="panel">
      <div class="card">
        <h3>Container-aware card</h3>
        <p>Resize the dashed panel around me.</p>
      </div>
    </div>
    <p class="note" id="note">Panel width: <strong id="widthOut">320px</strong> &mdash; narrow layout</p>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 48em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 20px 18px 30px; }

  .panel {
    container-type: inline-size;
    container-name: cardPanel;
    width: 320px;
    min-width: 200px;
    max-width: 100%;
    resize: horizontal;
    overflow: auto;
    border: 2px dashed var(--line);
    border-radius: 10px;
    padding: 14px;
  }

  /* This is the demo: the container query lives INSIDE the rule it affects */
  .card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px;
    transition: padding .15s;

    h3 {
      margin: 0 0 6px;
      font-size: 14px;
    }

    p {
      margin: 0;
      font-size: 12px;
      color: var(--sub);
    }

    @container cardPanel (min-width: 380px) {
      padding: 26px;

      h3 { font-size: 19px; }
      p { font-size: 14px; }
    }
  }

  .note { margin: 0; font-size: 12px; color: var(--sub); }
</script>

<script type="text/plain" id="js">
  var panel = document.getElementById('panel');
  var widthOut = document.getElementById('widthOut');
  var note = document.getElementById('note');

  function update() {
    var w = Math.round(panel.getBoundingClientRect().width);
    widthOut.textContent = w + 'px';
    note.innerHTML = 'Panel width: <strong>' + w + 'px</strong> &mdash; ' +
      (w >= 380 ? 'wide layout (@container query matched)' : 'narrow layout');
  }

  new ResizeObserver(update).observe(panel);
  update();
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
