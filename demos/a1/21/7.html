<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Descendant Combinator vs &">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Descendant combinator vs &amp;</h1>
    <p class="hint">Both boxes have class "card" AND contain a child with class "title". Only ONE box also has "title" on the card itself. Compare which element turns purple under each nested rule.</p>
  </header>
  <main class="stageWrap">
    <div class="row">
      <div class="card">
        <p class="cap">Card A (no title class on card)</p>
        <div class="title">child .title</div>
      </div>
      <div class="card title">
        <p class="cap">Card B (title class ALSO on card)</p>
        <div class="title">child .title</div>
      </div>
    </div>
    <p class="note">Rule 1: <code>.card { .title { } }</code> compiles to <code>.card .title</code> &mdash; a descendant combinator, so it colors the CHILD in both cards. Rule 2: <code>.card { &.title { } }</code> compiles to <code>.card.title</code> &mdash; a compound selector on the SAME element, so it only outlines Card B itself.</p>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 50em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 24px 18px 30px; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .cap { margin: 0 0 8px; font-size: 11.5px; color: var(--sub); }

  .card {
    width: 190px;
    background: #fff;
    border: 3px solid var(--line);
    border-radius: 10px;
    padding: 14px;

    /* Rule 1: no &, bare class -> compiles to ".card .title" (descendant) */
    .title {
      margin-top: 8px;
      padding: 10px;
      border-radius: 7px;
      background: #ede9fe;
      color: #6d28d9;
      font: 700 12px system-ui, sans-serif;
      text-align: center;
    }

    /* Rule 2: explicit & -> compiles to ".card.title" (compound, same element) */
    &.title {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99,102,241,.18);
    }
  }

  .note { margin: 0; max-width: 50em; font-size: 12px; color: var(--sub); text-align: center; line-height: 1.6; }
</script>

<script type="text/plain" id="js">
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
