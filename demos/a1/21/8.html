<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="BEM Blocks with Native Nesting">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>BEM, shortened by native nesting</h1>
    <p class="hint">Click "Feature it" to add the <code>card--featured</code> modifier. The block, its elements (<code>card__title</code>, <code>card__price</code>) and its modifier are all written inside one <code>.card { }</code> rule using <code>&amp;__</code> and <code>&amp;--</code> concatenation.</p>
  </header>
  <main class="stageWrap">
    <article class="card" id="card">
      <h3 class="card__title">Pro plan</h3>
      <p class="card__price">$19<span>/mo</span></p>
      <button class="card__btn" id="featureBtn">Feature it</button>
    </article>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 50em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; justify-content: center; padding: 34px 18px 40px; }

  /* This is the demo: the whole BEM block/element/modifier group in ONE rule */
  .card {
    width: 220px;
    padding: 20px;
    background: #fff;
    border: 2px solid var(--line);
    border-radius: 12px;
    text-align: center;
    transition: border-color .2s, transform .2s;

    &__title {
      margin: 0 0 6px;
      font-size: 15px;
      color: var(--ink);
    }

    &__price {
      margin: 0 0 14px;
      font-size: 24px;
      font-weight: 800;
      color: var(--accent);

      span {
        font-size: 12px;
        font-weight: 500;
        color: var(--sub);
      }
    }

    &__btn {
      padding: 9px 16px;
      font: 700 12.5px system-ui, sans-serif;
      background: #f1f2f6;
      color: var(--ink);
      border: none;
      border-radius: 7px;
      cursor: pointer;
    }

    &--featured {
      border-color: var(--accent);
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(99,102,241,.18);

      .card__btn {
        background: var(--accent);
        color: #fff;
      }
    }
  }
</script>

<script type="text/plain" id="js">
  var card = document.getElementById('card');
  var btn = document.getElementById('featureBtn');

  btn.addEventListener('click', function () {
    var on = card.classList.toggle('card--featured');
    btn.textContent = on ? 'Un-feature it' : 'Feature it';
  });
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
