<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Basic Native CSS Nesting Syntax">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Basic native nesting syntax</h1>
    <p class="hint">This card's title, body text and link are all styled by selectors written directly inside the parent <code>.card</code> rule &mdash; no <code>&amp;</code>, no preprocessor. Open the CSS tab to see the nested block.</p>
  </header>
  <main class="stageWrap">
    <article class="card">
      <h3>Nested rules, real CSS</h3>
      <p>Every selector below is written inside <code>.card { }</code> and the browser expands it to a full descendant selector on its own.</p>
      <a href="#">Learn more &rarr;</a>
    </article>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; justify-content: center; padding: 20px 18px 32px; }

  /* This is the demo: real native CSS nesting, no & needed for these selectors */
  .card {
    max-width: 360px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 1px 2px rgba(20,22,28,.04);

    h3 {
      margin: 0 0 8px;
      font-size: 16px;
      color: var(--ink);
    }

    p {
      margin: 0 0 12px;
      font-size: 13px;
      line-height: 1.6;
      color: var(--sub);
    }

    a {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  }
</script>

<script type="text/plain" id="js">
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
