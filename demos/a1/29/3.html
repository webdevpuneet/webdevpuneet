<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Position Parameters Choreograph the Timeline">

<script type="text/plain" id="cdn">
https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Position parameters</h1>
    <p class="hint">Click Play. B starts before A finishes; C starts exactly when B does &mdash; that overlap lives entirely inside the timeline.</p>
  </header>
  <main class="stageWrap">
    <div class="row"><span class="lbl">A</span><div class="track"><div class="box boxA" id="boxA"></div></div></div>
    <div class="row"><span class="lbl">B</span><div class="track"><div class="box boxB" id="boxB"></div></div></div>
    <div class="row"><span class="lbl">C</span><div class="track"><div class="box boxC" id="boxC"></div></div></div>
  </main>
  <div class="btnRow">
    <button class="runBtn" id="playBtn">Play Sequence</button>
  </div>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --a: #6366f1; --b: #d97706; --c: #16a34a; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { max-width: 340px; margin: 10px auto 0; padding: 0 24px; }
  .row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .lbl { width: 14px; font: 800 12px ui-monospace, monospace; color: var(--sub); }
  .track { position: relative; flex: 1; height: 28px; background: var(--line); border-radius: 6px; }
  .box { position: absolute; top: 0; left: 0; width: 28px; height: 28px; border-radius: 6px; }
  .boxA { background: var(--a); }
  .boxB { background: var(--b); }
  .boxC { background: var(--c); }
  .btnRow { display: flex; justify-content: center; padding: 16px 20px 32px; }
  .runBtn {
    padding: 10px 20px;
    font: 700 13px system-ui, sans-serif;
    color: #fff;
    background: var(--a);
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  .runBtn:hover { background: #4f52d9; }
</script>

<script type="text/plain" id="js">
  var trackWidth = document.querySelector('.track').clientWidth - 28;

  var tl = gsap.timeline({ paused: true });

  tl.to('#boxA', { x: trackWidth, duration: 0.7 }, 'go')
    .to('#boxB', { x: trackWidth, duration: 0.7 }, 'go+=0.25')
    .to('#boxC', { x: trackWidth, duration: 0.7 }, '<');

  document.getElementById('playBtn').addEventListener('click', function () {
    tl.restart();
  });
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
