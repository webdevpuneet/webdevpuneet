<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="The Same Timeline, Now Scrubbed by ScrollTrigger">

<script type="text/plain" id="cdn">
https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js
https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Timeline + scrub: true</h1>
    <p class="hint">Scroll slowly, then scroll back up. Same three-step sequence as demo #1 &mdash; only the playhead's source changed.</p>
  </header>
  <div class="spacer">Scroll ↓</div>
  <div class="stage">
    <div class="track"><div class="box" id="box"></div></div>
  </div>
  <div class="readout" id="readout">progress: 0.00</div>
  <div class="spacer end"></div>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .spacer { height: 220px; display: flex; align-items: center; justify-content: center; color: var(--sub); font: 700 12px system-ui, sans-serif; text-transform: uppercase; letter-spacing: 0.05em; }
  .spacer.end { height: 240px; }
  .stage { display: flex; justify-content: center; align-items: center; height: 130px; padding: 0 24px; }
  .track { position: relative; width: 100%; max-width: 300px; height: 90px; }
  .box {
    position: absolute;
    top: 0; left: 0;
    width: 64px;
    height: 64px;
    border-radius: 12px;
    background: var(--accent);
    box-shadow: 0 10px 20px rgba(99,102,241,0.35);
  }
  .readout { text-align: center; margin-top: 6px; font: 700 12px ui-monospace, monospace; color: var(--accent); }
</script>

<script type="text/plain" id="js">
  gsap.registerPlugin(ScrollTrigger);

  var box = document.getElementById('box');
  var readout = document.getElementById('readout');

  var tl = gsap.timeline({
    scrollTrigger: {
      trigger: '.stage',
      start: 'top 80%',
      end: 'bottom 30%',
      scrub: true,
      onUpdate: function (self) {
        readout.textContent = 'progress: ' + self.progress.toFixed(2);
      }
    }
  });

  tl.to(box, { x: 160, duration: 0.6 })
    .to(box, { y: 70, duration: 0.5 })
    .to(box, { rotation: 180, backgroundColor: '#16a34a', duration: 0.5 });
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
