<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="A Nested Component on the Page Grid">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>A nested component that knows the page grid</h1>
    <p class="hint">The purple panel is a child of the layout, not a sibling of the columns. Subgrid lets its own children snap to the page's 12 columns anyway.</p>
  </header>
  <main class="stageWrap">
    <button type="button" class="toggleBtn" id="toggleBtn">Turn subgrid OFF</button>
    <div class="page on" id="page">
      <div class="ruler" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
      <header class="siteHead">Page header — columns 1 / 13</header>
      <section class="panel">
        <div class="panelA">Nested A<br><small>columns 1 – 8</small></div>
        <div class="panelB">Nested B<br><small>columns 9 – 13</small></div>
      </section>
      <footer class="siteFoot">Page footer — columns 1 / 13</footer>
    </div>
    <p class="note" id="note">Subgrid ON — the panel's children line up with the ruler above, because the panel passes the page's column tracks straight through.</p>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink:#14161c; --sub:#6b7080; --line:#e3e5ea; --accent:#6366f1; }
  body { background:#f6f7f9; color:var(--ink); }
  .bar { padding:18px 20px 8px; text-align:center; }
  .bar h1 { margin:0 0 4px; font-size:19px; letter-spacing:-0.01em; }
  .hint { margin:0 auto; max-width:48em; font-size:12.5px; color:var(--sub); }
  .stageWrap { display:flex; flex-direction:column; align-items:center; gap:14px; padding:16px 18px 28px; }

  .toggleBtn {
    font:700 12.5px system-ui, sans-serif; padding:8px 16px;
    border:1px solid var(--line); border-radius:7px;
    background:#fff; color:var(--accent); cursor:pointer;
  }
  .toggleBtn:hover { background:#eef0ff; }

  /* A classic 12-column page grid. */
  .page {
    display:grid;
    grid-template-columns:repeat(12, 1fr);
    gap:8px;
    width:100%; max-width:600px;
  }

  .ruler { grid-column:1 / 13; display:grid; grid-template-columns:repeat(12,1fr); gap:8px; }
  .ruler span { height:8px; border-radius:3px; background:#dfe2ef; }

  .siteHead, .siteFoot {
    grid-column:1 / 13;
    background:#fff; border:1px solid var(--line); border-radius:8px;
    padding:10px 12px; font:600 12px system-ui, sans-serif; color:var(--sub);
  }

  .panel {
    grid-column:1 / 13;
    background:#efeeff; border:1px solid #cfcbff; border-radius:10px; padding:10px;
  }

  /* Subgrid ON: the panel spans all 12 columns and hands those same tracks
     to its own children — so "columns 9 – 13" means the real page columns. */
  .page.on .panel {
    display:grid;
    grid-template-columns:subgrid;
    gap:8px;
  }
  .page.on .panelA { grid-column:1 / 9; }
  .page.on .panelB { grid-column:9 / 13; }

  /* Subgrid OFF: the panel starts a brand-new grid, so its children divide
     the panel's own width and no longer relate to the page columns at all. */
  .page.off .panel { display:grid; grid-template-columns:2fr 1fr; gap:8px; }

  .panelA, .panelB {
    background:#fff; border:1px solid #cfcbff; border-radius:7px;
    padding:12px 10px; font:700 12px system-ui, sans-serif; text-align:center;
  }
  .panelA small, .panelB small { font-weight:500; color:var(--sub); font-size:10.5px; }
  .note { margin:0; font-size:12px; color:var(--sub); text-align:center; max-width:44em; }
</script>

<script type="text/plain" id="js">
  var page = document.getElementById('page');
  var btn = document.getElementById('toggleBtn');
  var note = document.getElementById('note');
  var on = true;

  btn.addEventListener('click', function () {
    on = !on;
    page.classList.toggle('on', on);
    page.classList.toggle('off', !on);
    btn.textContent = on ? 'Turn subgrid OFF' : 'Turn subgrid ON';
    note.textContent = on
      ? 'Subgrid ON — the panel’s children line up with the ruler above, because the panel passes the page’s column tracks straight through.'
      : 'Subgrid OFF — the panel starts its own grid, so its children split the panel’s width and drift off the page columns.';
  });
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
