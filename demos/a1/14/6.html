<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Table Alignment Without a Table">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Column alignment without a &lt;table&gt;</h1>
    <p class="hint">Each row is an independent component — its own card, its own border, its own hover state. Subgrid keeps their columns aligned as if they were one table.</p>
  </header>
  <main class="stageWrap">
    <button type="button" class="toggleBtn" id="toggleBtn">Turn subgrid OFF</button>
    <div class="list on" id="list">
      <div class="head">
        <span>Service</span><span>Region</span><span>Latency</span><span>Status</span>
      </div>
      <div class="row">
        <span class="name">auth-api</span><span>eu-west-1</span><span class="num">42 ms</span><span class="pill ok">Healthy</span>
      </div>
      <div class="row">
        <span class="name">payments-worker-scheduler</span><span>us-east-1</span><span class="num">128 ms</span><span class="pill warn">Degraded</span>
      </div>
      <div class="row">
        <span class="name">cdn-edge</span><span>global</span><span class="num">9 ms</span><span class="pill ok">Healthy</span>
      </div>
      <div class="row">
        <span class="name">search-index</span><span>ap-south-1</span><span class="num">311 ms</span><span class="pill bad">Down</span>
      </div>
    </div>
    <p class="note" id="note">Subgrid ON — every row reuses the list's four columns, so the header and all rows agree even though each row is its own bordered card.</p>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink:#14161c; --sub:#6b7080; --line:#e3e5ea; --accent:#6366f1; --green:#16a34a; --amber:#d97706; --red:#dc2626; }
  body { background:#f6f7f9; color:var(--ink); }
  .bar { padding:18px 20px 8px; text-align:center; }
  .bar h1 { margin:0 0 4px; font-size:19px; letter-spacing:-0.01em; }
  .hint { margin:0 auto; max-width:48em; font-size:12.5px; color:var(--sub); }
  .stageWrap { display:flex; flex-direction:column; align-items:center; gap:14px; padding:16px 18px 28px; }

  .toggleBtn {
    font:700 12.5px system-ui, sans-serif; padding:8px 16px;
    border:1px solid var(--line); border-radius:7px;
    background:#fff; color:var(--accent); cursor:pointer;
  }
  .toggleBtn:hover { background:#eef0ff; }

  /* Four columns declared once, on the list. */
  .list {
    display:grid;
    grid-template-columns:2fr 1fr max-content max-content;
    gap:8px 14px;
    width:100%; max-width:600px;
  }

  .head, .row { grid-column:1 / -1; }

  /* Subgrid ON: each row hands the list's four columns to its own spans. */
  .list.on .head, .list.on .row {
    display:grid;
    grid-template-columns:subgrid;
    align-items:center;
  }

  /* Subgrid OFF: each row re-declares the same template — but each one now
     measures its OWN content, so the widest cell differs row by row. */
  .list.off .head, .list.off .row {
    display:grid;
    grid-template-columns:2fr 1fr max-content max-content;
    gap:14px;
    align-items:center;
  }

  .head {
    font:700 10.5px system-ui, sans-serif; text-transform:uppercase;
    letter-spacing:.06em; color:var(--sub); padding:0 12px;
  }

  .row {
    background:#fff; border:1px solid var(--line); border-radius:9px;
    padding:10px 12px; font:500 12.5px system-ui, sans-serif;
    transition:border-color .15s;
  }
  .row:hover { border-color:var(--accent); }

  .name { font-weight:700; }
  .num { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12px; }
  .pill {
    justify-self:start; padding:2px 8px; border-radius:99px;
    font:700 10px system-ui, sans-serif;
  }
  .pill.ok { color:var(--green); background:#e8f7ee; }
  .pill.warn { color:var(--amber); background:#fdf3e3; }
  .pill.bad { color:var(--red); background:#fdeaea; }
  .note { margin:0; font-size:12px; color:var(--sub); text-align:center; max-width:44em; }
</script>

<script type="text/plain" id="js">
  var list = document.getElementById('list');
  var btn = document.getElementById('toggleBtn');
  var note = document.getElementById('note');
  var on = true;

  btn.addEventListener('click', function () {
    on = !on;
    list.classList.toggle('on', on);
    list.classList.toggle('off', !on);
    btn.textContent = on ? 'Turn subgrid OFF' : 'Turn subgrid ON';
    note.textContent = on
      ? 'Subgrid ON — every row reuses the list’s four columns, so the header and all rows agree even though each row is its own bordered card.'
      : 'Subgrid OFF — each row sizes its own columns from its own content, so nothing lines up with the header or with the other rows.';
  });
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
