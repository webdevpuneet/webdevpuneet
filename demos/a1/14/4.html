<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Stat Tiles With Aligned Bands">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Stat tiles whose bands agree</h1>
    <p class="hint">Four KPI tiles: label, number, delta note. One label wraps to two lines and one delta note is missing entirely — exactly the cases that break a flexbox row.</p>
  </header>
  <main class="stageWrap">
    <button type="button" class="toggleBtn" id="toggleBtn">Turn subgrid OFF</button>
    <div class="tiles on" id="tiles">
      <div class="tile">
        <span class="label">Revenue</span>
        <span class="value">$48.2k</span>
        <span class="delta up">+12.4% vs last month</span>
      </div>
      <div class="tile">
        <span class="label">Monthly recurring subscriptions</span>
        <span class="value">1,284</span>
        <span class="delta up">+3.1%</span>
      </div>
      <div class="tile">
        <span class="label">Churn</span>
        <span class="value">2.1%</span>
        <span class="delta down">&minus;0.4%</span>
      </div>
      <div class="tile">
        <span class="label">Open tickets</span>
        <span class="value">37</span>
      </div>
    </div>
    <p class="note" id="note">Subgrid ON — labels, numbers and deltas each occupy one shared band, so the big numbers sit on a single line even though one label wraps.</p>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink:#14161c; --sub:#6b7080; --line:#e3e5ea; --accent:#6366f1; --green:#16a34a; --red:#dc2626; }
  body { background:#f6f7f9; color:var(--ink); }
  .bar { padding:18px 20px 8px; text-align:center; }
  .bar h1 { margin:0 0 4px; font-size:19px; letter-spacing:-0.01em; }
  .hint { margin:0 auto; max-width:48em; font-size:12.5px; color:var(--sub); }
  .stageWrap { display:flex; flex-direction:column; align-items:center; gap:14px; padding:16px 18px 28px; }

  .toggleBtn {
    font:700 12.5px system-ui, sans-serif; padding:8px 16px;
    border:1px solid var(--line); border-radius:7px;
    background:#fff; color:var(--accent); cursor:pointer;
  }
  .toggleBtn:hover { background:#eef0ff; }

  .tiles {
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    grid-template-rows:auto auto auto;
    gap:10px;
    width:100%; max-width:600px;
  }

  .tile {
    background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px;
  }

  .tiles.on .tile {
    grid-row:span 3;
    display:grid;
    grid-template-rows:subgrid;
    gap:6px;
  }
  .tiles.off .tile { display:flex; flex-direction:column; gap:6px; }

  .label { font:600 11px system-ui, sans-serif; color:var(--sub); line-height:1.3; }
  .value { font:800 22px ui-monospace, SFMono-Regular, Menlo, monospace; color:var(--ink); align-self:center; }
  .delta { font:700 10.5px system-ui, sans-serif; align-self:end; }
  .delta.up { color:var(--green); }
  .delta.down { color:var(--red); }
  .note { margin:0; font-size:12px; color:var(--sub); text-align:center; max-width:44em; }
</script>

<script type="text/plain" id="js">
  var tiles = document.getElementById('tiles');
  var btn = document.getElementById('toggleBtn');
  var note = document.getElementById('note');
  var on = true;

  btn.addEventListener('click', function () {
    on = !on;
    tiles.classList.toggle('on', on);
    tiles.classList.toggle('off', !on);
    btn.textContent = on ? 'Turn subgrid OFF' : 'Turn subgrid ON';
    note.textContent = on
      ? 'Subgrid ON — labels, numbers and deltas each occupy one shared band, so the big numbers sit on a single line even though one label wraps.'
      : 'Subgrid OFF — the wrapped label pushes its own number down, and the tile with no delta ends short.';
  });
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
