<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Measuring scrollHeight and Cleaning Up to auto">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Measure scrollHeight, animate to it, then clean up to auto</h1>
    <p class="hint">Open each panel, then click "Add a sentence" while it's open. The broken panel's max-height was frozen at the OLD scrollHeight when it opened, so the new line gets clipped. The fixed panel resets itself to auto after the animation ends, so it re-measures correctly.</p>
  </header>
  <main class="stageWrap">
    <div class="cols">
      <div class="col">
        <h2 class="colTitle bad">Broken (max-height never reset)</h2>
        <div class="acc-item">
          <button type="button" class="acc-trigger" id="badTrigger" aria-expanded="false" aria-controls="badPanel">
            FAQ answer <span class="chev">&#9662;</span>
          </button>
          <div class="acc-panel bad-panel" id="badPanel">
            <div class="acc-panel-inner" id="badInner">
              <p>Standard shipping takes 3-5 business days.</p>
            </div>
          </div>
        </div>
        <button type="button" class="addBtn" id="badAdd">Add a sentence</button>
        <p class="note" id="badNote">Open the panel first, then add a sentence.</p>
      </div>
      <div class="col">
        <h2 class="colTitle good">Fixed (resets to auto after opening)</h2>
        <div class="acc-item">
          <button type="button" class="acc-trigger" id="goodTrigger" aria-expanded="false" aria-controls="goodPanel">
            FAQ answer <span class="chev">&#9662;</span>
          </button>
          <div class="acc-panel good-panel" id="goodPanel">
            <div class="acc-panel-inner" id="goodInner">
              <p>Standard shipping takes 3-5 business days.</p>
            </div>
          </div>
        </div>
        <button type="button" class="addBtn" id="goodAdd">Add a sentence</button>
        <p class="note" id="goodNote">Open the panel first, then add a sentence.</p>
      </div>
    </div>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; --green: #16a34a; --red: #dc2626; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 16px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 58em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px 16px 28px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%; max-width: 580px; }
  .col { background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 14px; }
  .colTitle { margin: 0 0 10px; font: 700 11px ui-monospace, monospace; padding: 5px 8px; border-radius: 6px; display: inline-block; text-align: center; }
  .colTitle.bad { color: var(--red); background: #fdeaea; }
  .colTitle.good { color: var(--green); background: #e8f7ee; }
  .acc-item { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .acc-trigger { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border: none; background: #fafafc; color: var(--ink); font: 700 12px system-ui, sans-serif; cursor: pointer; text-align: left; }
  .acc-trigger:hover { background: #f0f1f5; }
  .chev { transition: transform .25s ease; color: var(--sub); }
  .acc-trigger[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .acc-panel-inner { padding: 10px 12px; font-size: 12px; line-height: 1.55; color: var(--sub); }
  .acc-panel-inner p { margin: 0 0 6px; }
  .acc-panel-inner p:last-child { margin-bottom: 0; }
  .bad-panel, .good-panel { max-height: 0; overflow: hidden; transition: max-height .3s ease; }
  .addBtn { margin-top: 8px; padding: 7px 12px; border-radius: 7px; border: 1px solid var(--line); background: #fff; font: 700 11.5px system-ui, sans-serif; cursor: pointer; }
  .addBtn:hover { border-color: var(--accent); }
  .note { margin: 8px 2px 0; font-size: 11.5px; color: var(--sub); line-height: 1.5; min-height: 2.6em; }
</script>

<script type="text/plain" id="js">
  function setupBad() {
    var trigger = document.getElementById('badTrigger');
    var panel = document.getElementById('badPanel');
    var inner = document.getElementById('badInner');
    var addBtn = document.getElementById('badAdd');
    var note = document.getElementById('badNote');
    var lines = 0;

    trigger.addEventListener('click', function () {
      var isOpen = trigger.getAttribute('aria-expanded') === 'true';
      trigger.setAttribute('aria-expanded', String(!isOpen));
      if (!isOpen) {
        // Measure once, on open, and never touch it again.
        panel.style.maxHeight = panel.scrollHeight + 'px';
        note.textContent = 'Opened. max-height is now frozen at ' + panel.scrollHeight + 'px.';
      } else {
        panel.style.maxHeight = '0px';
      }
    });

    // BROKEN: adding content changes scrollHeight, but nothing ever
    // re-measures or removes the earlier fixed max-height, so the panel's
    // ceiling stays exactly where it was when it was first opened.
    addBtn.addEventListener('click', function () {
      lines += 1;
      var p = document.createElement('p');
      p.textContent = 'Extra sentence #' + lines + ' added after opening.';
      inner.appendChild(p);
      if (trigger.getAttribute('aria-expanded') === 'true') {
        note.textContent = 'New line added, but max-height is still ' + panel.style.maxHeight + ' -- the bottom of the content is now clipped.';
      }
    });
  }

  function setupGood() {
    var trigger = document.getElementById('goodTrigger');
    var panel = document.getElementById('goodPanel');
    var inner = document.getElementById('goodInner');
    var addBtn = document.getElementById('goodAdd');
    var note = document.getElementById('goodNote');
    var lines = 0;

    panel.addEventListener('transitionend', function (e) {
      if (e.propertyName !== 'max-height') return;
      // FIXED: once the OPEN transition finishes, swap the fixed pixel
      // ceiling for 'none' so the panel behaves like ordinary auto-height
      // content again. Any future reflow (new content, a resize, a font
      // load) is picked up automatically instead of being clipped by a
      // number measured at one point in time.
      if (trigger.getAttribute('aria-expanded') === 'true') {
        panel.style.maxHeight = 'none';
      }
    });

    trigger.addEventListener('click', function () {
      var isOpen = trigger.getAttribute('aria-expanded') === 'true';
      trigger.setAttribute('aria-expanded', String(!isOpen));
      if (!isOpen) {
        panel.style.maxHeight = panel.scrollHeight + 'px';
        note.textContent = 'Opened. max-height will reset to none once the transition ends.';
      } else {
        // Coming from 'none', re-pin to the current pixel height first so
        // there's something concrete to transition FROM back to 0.
        panel.style.maxHeight = panel.scrollHeight + 'px';
        requestAnimationFrame(function () {
          panel.style.maxHeight = '0px';
        });
      }
    });

    addBtn.addEventListener('click', function () {
      lines += 1;
      var p = document.createElement('p');
      p.textContent = 'Extra sentence #' + lines + ' added after opening.';
      inner.appendChild(p);
      if (trigger.getAttribute('aria-expanded') === 'true') {
        note.textContent = 'New line added -- since max-height is "none" while open, the panel just grows to fit it.';
      }
    });
  }

  setupBad();
  setupGood();
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
