<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="grid-template-rows: 0fr to 1fr, No JS Measurement Needed">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>grid-template-rows: 0fr to 1fr animates to true auto height</h1>
    <p class="hint">Resize your browser or just compare: open both panels. The left one is a rigid fixed max-height that either clips tall content or wastes time animating past short content. The right one uses grid-template-rows and always lands exactly at the content's real height, with zero JavaScript measuring anything.</p>
  </header>
  <main class="stageWrap">
    <div class="cols">
      <div class="col">
        <h2 class="colTitle bad">Fixed max-height (rigid)</h2>
        <div class="acc-item">
          <button type="button" class="acc-trigger" id="badTrigger" aria-expanded="false" aria-controls="badPanel">
            Return policy <span class="chev">&#9662;</span>
          </button>
          <div class="acc-panel bad-panel" id="badPanel">
            <div class="acc-panel-inner">
              <p>Items can be returned within 30 days of delivery for a full refund, provided tags are still attached and the item hasn't been worn, washed, or altered. Final sale items, gift cards, and made-to-order pieces are not eligible for return under any circumstances.</p>
            </div>
          </div>
        </div>
        <p class="note" id="badNote">This panel needs a guess at a "big enough" number.</p>
      </div>
      <div class="col">
        <h2 class="colTitle good">grid-template-rows (adaptive)</h2>
        <div class="acc-item grid-item">
          <button type="button" class="acc-trigger" id="goodTrigger" aria-expanded="false" aria-controls="goodPanel">
            Return policy <span class="chev">&#9662;</span>
          </button>
          <div class="acc-panel good-panel" id="goodPanel">
            <div class="acc-panel-inner">
              <p>Items can be returned within 30 days of delivery for a full refund, provided tags are still attached and the item hasn't been worn, washed, or altered. Final sale items, gift cards, and made-to-order pieces are not eligible for return under any circumstances.</p>
            </div>
          </div>
        </div>
        <p class="note" id="goodNote">No number guessed anywhere -- this always fits exactly.</p>
      </div>
    </div>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; --green: #16a34a; --red: #dc2626; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 16px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 58em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px 16px 28px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%; max-width: 580px; }
  .col { background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 14px; }
  .colTitle { margin: 0 0 10px; font: 700 11px ui-monospace, monospace; padding: 5px 8px; border-radius: 6px; display: inline-block; text-align: center; }
  .colTitle.bad { color: var(--red); background: #fdeaea; }
  .colTitle.good { color: var(--green); background: #e8f7ee; }
  .acc-item { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .acc-trigger { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border: none; background: #fafafc; color: var(--ink); font: 700 12px system-ui, sans-serif; cursor: pointer; text-align: left; }
  .acc-trigger:hover { background: #f0f1f5; }
  .chev { transition: transform .25s ease; color: var(--sub); }
  .acc-trigger[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .acc-panel-inner { padding: 10px 12px; font-size: 12px; line-height: 1.55; color: var(--sub); }
  .bad-panel { max-height: 0; overflow: hidden; transition: max-height .35s ease; }
  .bad-panel.open { max-height: 260px; }
  .grid-item .good-panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .35s ease; }
  .grid-item .good-panel.open { grid-template-rows: 1fr; }
  .grid-item .good-panel .acc-panel-inner { overflow: hidden; min-height: 0; }
  .note { margin: 8px 2px 0; font-size: 11.5px; color: var(--sub); line-height: 1.5; min-height: 2.6em; }
</script>

<script type="text/plain" id="js">
  function setupBad() {
    var trigger = document.getElementById('badTrigger');
    var panel = document.getElementById('badPanel');
    var note = document.getElementById('badNote');

    // A fixed max-height "hack" -- works, but the 260px ceiling here was
    // hand-picked to fit THIS paragraph. Add one more sentence to the
    // content later and it silently clips, with no error anywhere.
    trigger.addEventListener('click', function () {
      var isOpen = trigger.getAttribute('aria-expanded') === 'true';
      trigger.setAttribute('aria-expanded', String(!isOpen));
      panel.classList.toggle('open');
    });
  }

  function setupGood() {
    var trigger = document.getElementById('goodTrigger');
    var panel = document.getElementById('goodPanel');
    var note = document.getElementById('goodNote');

    // FIXED: the panel is a single-row CSS grid whose row-track animates
    // from 0fr (zero fraction of available space) to 1fr (its full,
    // intrinsic content size). Because a fr unit resolves against the
    // content's OWN natural size -- not a number picked by hand -- this
    // is a genuine transition to auto height, with no JS measuring
    // anything and no ceiling to outgrow later.
    trigger.addEventListener('click', function () {
      var isOpen = trigger.getAttribute('aria-expanded') === 'true';
      trigger.setAttribute('aria-expanded', String(!isOpen));
      panel.classList.toggle('open');
    });
  }

  setupBad();
  setupGood();
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
