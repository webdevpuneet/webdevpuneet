<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="height: auto Can't Be Transitioned">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>height: auto can't be transitioned -- it just snaps</h1>
    <p class="hint">Click each "Details" trigger. The broken panel appears/disappears instantly with no animation, because it's transitioning to and from height: auto. The fixed panel slides smoothly.</p>
  </header>
  <main class="stageWrap">
    <div class="cols">
      <div class="col">
        <h2 class="colTitle bad">Broken (height: auto)</h2>
        <div class="acc-item">
          <button type="button" class="acc-trigger" id="badTrigger" aria-expanded="false" aria-controls="badPanel">
            Shipping details <span class="chev">&#9662;</span>
          </button>
          <div class="acc-panel bad-panel" id="badPanel">
            <div class="acc-panel-inner">
              <p>Orders ship within 2 business days. Tracking numbers are emailed automatically once a label is printed, and delivery usually takes 3-5 days domestically.</p>
            </div>
          </div>
        </div>
        <p class="note" id="badNote">Watch it snap instead of sliding.</p>
      </div>
      <div class="col">
        <h2 class="colTitle good">Fixed (max-height)</h2>
        <div class="acc-item">
          <button type="button" class="acc-trigger" id="goodTrigger" aria-expanded="false" aria-controls="goodPanel">
            Shipping details <span class="chev">&#9662;</span>
          </button>
          <div class="acc-panel good-panel" id="goodPanel">
            <div class="acc-panel-inner">
              <p>Orders ship within 2 business days. Tracking numbers are emailed automatically once a label is printed, and delivery usually takes 3-5 days domestically.</p>
            </div>
          </div>
        </div>
        <p class="note" id="goodNote">Watch it slide open and closed.</p>
      </div>
    </div>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; --green: #16a34a; --red: #dc2626; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 17px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 52em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px 16px 28px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%; max-width: 560px; }
  .col { background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 14px; }
  .colTitle { margin: 0 0 10px; font: 700 11.5px ui-monospace, monospace; padding: 5px 8px; border-radius: 6px; display: inline-block; text-align: center; }
  .colTitle.bad { color: var(--red); background: #fdeaea; }
  .colTitle.good { color: var(--green); background: #e8f7ee; }
  .acc-item { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .acc-trigger { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 11px 13px; border: none; background: #fafafc; color: var(--ink); font: 700 12.5px system-ui, sans-serif; cursor: pointer; text-align: left; }
  .acc-trigger:hover { background: #f0f1f5; }
  .chev { transition: transform .25s ease; color: var(--sub); }
  .acc-trigger[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .acc-panel-inner { padding: 12px 13px; font-size: 12px; line-height: 1.55; color: var(--sub); }
  .bad-panel { height: 0; overflow: hidden; transition: height .3s ease; }
  .bad-panel.open { height: auto; }
  .good-panel { max-height: 0; overflow: hidden; transition: max-height .3s ease; }
  .good-panel.open { max-height: 200px; }
  .note { margin: 8px 2px 0; font-size: 11.5px; color: var(--sub); line-height: 1.5; min-height: 2.6em; }
</script>

<script type="text/plain" id="js">
  function setupBad() {
    var trigger = document.getElementById('badTrigger');
    var panel = document.getElementById('badPanel');
    var note = document.getElementById('badNote');

    // BROKEN: toggling between height: 0 and height: auto. The browser has
    // no way to interpolate "auto" -- there is no pixel value to animate
    // toward -- so the transition is simply skipped and the panel snaps.
    trigger.addEventListener('click', function () {
      var isOpen = trigger.getAttribute('aria-expanded') === 'true';
      trigger.setAttribute('aria-expanded', String(!isOpen));
      panel.classList.toggle('open');
      note.textContent = !isOpen
        ? 'Opened instantly -- height: auto cannot be transitioned.'
        : 'Closed instantly -- same problem in reverse.';
    });
  }

  function setupGood() {
    var trigger = document.getElementById('goodTrigger');
    var panel = document.getElementById('goodPanel');
    var note = document.getElementById('goodNote');

    // FIXED: transitioning max-height between two real pixel values (0 and
    // a number large enough to fit the content) DOES interpolate, because
    // both ends of the transition are concrete lengths, not "auto".
    trigger.addEventListener('click', function () {
      var isOpen = trigger.getAttribute('aria-expanded') === 'true';
      trigger.setAttribute('aria-expanded', String(!isOpen));
      panel.classList.toggle('open');
      note.textContent = !isOpen
        ? 'Opened smoothly -- max-height animates between two real numbers.'
        : 'Closed smoothly.';
    });
  }

  setupBad();
  setupGood();
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
