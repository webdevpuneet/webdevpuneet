<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="scroll(root) vs scroll(nearest)">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>scroll(root) vs scroll(nearest)</h1>
    <p class="hint">Scroll this whole frame first, then scroll <em>inside</em> the gray box below. Watch which bar reacts to which scroll.</p>
  </header>
  <div class="spacer">Scroll the frame ↓</div>
  <div class="labels">
    <div class="labelRow">scroll(root) &mdash; outer frame scroll</div>
    <div class="track"><div class="fill fillRoot"></div></div>
  </div>
  <div class="inner" id="inner">
    <div class="innerHeader">
      <div class="labelRow">scroll(nearest) &mdash; this box's own scroll</div>
      <div class="track"><div class="fill fillNearest"></div></div>
    </div>
    <div class="innerSpacer">Scroll inside this box ↓</div>
    <p class="innerContent">This bar only exists to give the gray box its own scroll range, independent of the outer frame.</p>
    <div class="innerSpacer">More inner content</div>
  </div>
  <div class="spacer end">Keep scrolling the frame</div>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .spacer { height: 200px; display: flex; align-items: center; justify-content: center; color: var(--sub); font: 700 12px system-ui, sans-serif; text-transform: uppercase; letter-spacing: 0.05em; }
  .spacer.end { height: 260px; }

  .labels { max-width: 380px; margin: 0 auto 20px; }
  .labelRow { font: 700 11px system-ui, sans-serif; color: var(--sub); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em; }
  .track { height: 12px; background: var(--line); border-radius: 7px; overflow: hidden; }

  .fill {
    height: 100%;
    width: 100%;
    transform-origin: left center;
    animation: grow linear;
  }

  .fillRoot {
    background: linear-gradient(90deg, #6366f1, #a855f7);
    animation-timeline: scroll(root);
  }

  .fillNearest {
    background: linear-gradient(90deg, #16a34a, #4ade80);
    animation-timeline: scroll(nearest);
  }

  @keyframes grow {
    from { transform: scaleX(0); }
    to   { transform: scaleX(1); }
  }

  .inner { max-width: 380px; margin: 0 auto; height: 200px; overflow-y: auto; border: 2px solid var(--line); border-radius: 10px; background: #fff; }
  .innerHeader { position: sticky; top: 0; background: #fff; padding: 10px 14px 8px; border-bottom: 1px solid var(--line); z-index: 1; }
  .innerSpacer { height: 150px; display: flex; align-items: center; justify-content: center; color: var(--sub); font-size: 12px; }
  .innerContent { padding: 0 14px; font-size: 12px; color: var(--sub); }
</script>

<script type="text/plain" id="js">
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
