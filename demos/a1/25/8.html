<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Permission-Denied Empty State">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Permission-denied empty state</h1>
    <p class="hint">This role has no access to billing. Click "Request access," then "Switch to Admin" to see the unlocked view.</p>
  </header>
  <main class="stageWrap">
    <div class="roleRow">
      <span class="roleLabel" id="roleLabel">Role: Viewer</span>
    </div>
    <div class="panel" id="panel"></div>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; --amber: #b45309; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 20px 16px 28px; }

  .roleRow { }
  .roleLabel {
    display: inline-block; padding: 5px 12px; border-radius: 999px;
    background: #fff7ed; color: var(--amber); font: 700 11.5px system-ui, sans-serif;
    border: 1px solid #fde3c8;
  }

  .panel { width: 100%; max-width: 360px; }

  .emptyState { text-align: center; padding: 30px 16px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
  .emptyIcon {
    width: 48px; height: 48px; margin: 0 auto 12px; border-radius: 50%;
    background: #fff7ed; color: var(--amber); display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }
  .emptyTitle { margin: 0 0 4px; font-size: 14.5px; font-weight: 700; }
  .emptyDesc { margin: 0 0 16px; font-size: 12.5px; color: var(--sub); line-height: 1.5; }
  .requestBtn {
    padding: 9px 18px; border-radius: 9px; border: none;
    background: var(--accent); color: #fff; font: 700 12.5px system-ui, sans-serif; cursor: pointer;
  }
  .requestBtn:hover { background: #4f52d6; }
  .requestBtn:disabled { background: #a7a9d6; cursor: default; }

  .billingCard { border: 1px solid var(--line); border-radius: 12px; background: #fff; padding: 16px; animation: pop 0.3s ease; }
  @keyframes pop { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .billingRow { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  .billingRow:last-child { border-bottom: none; }
</script>

<script type="text/plain" id="js">
  var panel = document.getElementById('panel');
  var roleLabel = document.getElementById('roleLabel');
  var requested = false;

  function renderDenied() {
    roleLabel.textContent = 'Role: Viewer';
    panel.innerHTML =
      '<div class="emptyState">' +
        '<div class="emptyIcon">&#128274;</div>' +
        '<p class="emptyTitle">You don&rsquo;t have access to Billing</p>' +
        '<p class="emptyDesc">Billing details are visible to workspace admins only. Ask an admin to grant you access.</p>' +
        '<button type="button" class="requestBtn" id="reqBtn">' + (requested ? 'Switch to Admin' : 'Request access') + '</button>' +
      '</div>';
    document.getElementById('reqBtn').addEventListener('click', function () {
      if (!requested) {
        requested = true;
        this.textContent = 'Switch to Admin';
      } else {
        renderAllowed();
      }
    });
  }

  function renderAllowed() {
    roleLabel.textContent = 'Role: Admin';
    panel.innerHTML =
      '<div class="billingCard">' +
        '<div class="billingRow"><span>Plan</span><strong>Team — $49/mo</strong></div>' +
        '<div class="billingRow"><span>Next invoice</span><strong>Oct 1, 2026</strong></div>' +
        '<div class="billingRow"><span>Payment method</span><strong>Visa &bull;&bull;&bull;&bull; 4242</strong></div>' +
      '</div>';
  }

  renderDenied();
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
