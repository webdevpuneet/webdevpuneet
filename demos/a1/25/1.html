<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Empty Search Results">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Empty search results</h1>
    <p class="hint">Type into the search box. Try "shoes" for real matches, then try something like "zzz" to see the empty state.</p>
  </header>
  <main class="stageWrap">
    <input type="text" class="searchInput" id="searchInput" placeholder="Search products…" autocomplete="off">
    <div class="results" id="results"></div>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 24px 16px 28px; min-height: 220px; }

  .searchInput {
    width: 100%; max-width: 360px; padding: 10px 14px; border-radius: 9px;
    border: 1.5px solid var(--line); font: 500 13.5px system-ui, sans-serif; color: var(--ink);
    outline: none; transition: border-color 0.15s ease;
  }
  .searchInput:focus { border-color: var(--accent); }

  .results { width: 100%; max-width: 360px; }

  .resultRow {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 9px; background: #fff;
    margin-bottom: 8px; font-size: 13px; font-weight: 600;
  }
  .resultDot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }

  .emptyState { text-align: center; padding: 26px 14px 10px; }
  .emptyIcon {
    width: 46px; height: 46px; margin: 0 auto 12px; border-radius: 50%;
    background: #eef0ff; color: var(--accent); display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .emptyTitle { margin: 0 0 4px; font-size: 14px; font-weight: 700; }
  .emptyDesc { margin: 0 0 12px; font-size: 12.5px; color: var(--sub); line-height: 1.5; }
  .suggestRow { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .suggestChip {
    padding: 6px 12px; border-radius: 999px; border: 1.5px solid var(--line);
    background: #fff; color: var(--ink); font: 600 12px system-ui, sans-serif; cursor: pointer;
  }
  .suggestChip:hover { border-color: var(--accent); color: var(--accent); }
</script>

<script type="text/plain" id="js">
  var PRODUCTS = ['Running shoes', 'Trail shoes', 'Leather boots', 'Canvas sneakers', 'Wool socks', 'Rain jacket'];
  var searchInput = document.getElementById('searchInput');
  var results = document.getElementById('results');

  function render(query) {
    var q = query.trim().toLowerCase();
    if (!q) { results.innerHTML = ''; return; }

    var matches = PRODUCTS.filter(function (p) {
      return p.toLowerCase().indexOf(q) !== -1;
    });

    if (matches.length > 0) {
      results.innerHTML = matches.map(function (m) {
        return '<div class="resultRow"><span class="resultDot"></span>' + m + '</div>';
      }).join('');
      return;
    }

    results.innerHTML =
      '<div class="emptyState">' +
        '<div class="emptyIcon">&#128269;</div>' +
        '<p class="emptyTitle">No results for &ldquo;' + escapeHtml(query) + '&rdquo;</p>' +
        '<p class="emptyDesc">Try different keywords or check for typos.</p>' +
        '<div class="suggestRow">' +
          '<button type="button" class="suggestChip" data-term="shoes">shoes</button>' +
          '<button type="button" class="suggestChip" data-term="boots">boots</button>' +
          '<button type="button" class="suggestChip" data-term="jacket">jacket</button>' +
        '</div>' +
      '</div>';

    var chips = results.querySelectorAll('.suggestChip');
    for (var i = 0; i < chips.length; i++) {
      chips[i].addEventListener('click', function () {
        searchInput.value = this.getAttribute('data-term');
        render(searchInput.value);
        searchInput.focus();
      });
    }
  }

  function escapeHtml(s) {
    var div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  searchInput.addEventListener('input', function () { render(searchInput.value); });
  searchInput.value = 'zzz';
  render('zzz');
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
