<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Failed-to-Load Empty State">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Failed-to-load empty state</h1>
    <p class="hint">Click "Load activity" — the first attempt fails on purpose. Click "Retry" and it succeeds, showing real data.</p>
  </header>
  <main class="stageWrap">
    <div class="panel" id="panel"></div>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; --red: #dc2626; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 24px 16px 28px; min-height: 220px; justify-content: center; }

  .panel { width: 100%; max-width: 360px; }

  .startBtn, .retryBtn {
    display: block; margin: 0 auto; padding: 11px 22px; border-radius: 9px; border: none;
    background: var(--accent); color: #fff; font: 700 13.5px system-ui, sans-serif; cursor: pointer;
  }
  .startBtn:hover, .retryBtn:hover { background: #4f52d6; }

  .spinner {
    width: 36px; height: 36px; margin: 0 auto;
    border: 4px solid var(--line); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .emptyState { text-align: center; padding: 10px 14px; }
  .emptyIcon {
    width: 46px; height: 46px; margin: 0 auto 12px; border-radius: 50%;
    background: #fef2f2; color: var(--red); display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 800;
  }
  .emptyTitle { margin: 0 0 4px; font-size: 14.5px; font-weight: 700; }
  .emptyDesc { margin: 0 0 14px; font-size: 12.5px; color: var(--sub); line-height: 1.5; }

  .listRow {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 9px; background: #fff;
    margin-bottom: 8px; font-size: 13px; font-weight: 600;
  }
  .listDot { width: 8px; height: 8px; border-radius: 50%; background: #16a34a; flex-shrink: 0; }
</script>

<script type="text/plain" id="js">
  var panel = document.getElementById('panel');
  var attempt = 0;

  function renderStart() {
    panel.innerHTML = '<button type="button" class="startBtn" id="startBtn">Load activity</button>';
    document.getElementById('startBtn').addEventListener('click', load);
  }

  function load() {
    panel.innerHTML = '<div class="spinner"></div>';
    attempt++;
    setTimeout(function () {
      if (attempt === 1) {
        renderError();
      } else {
        renderData();
      }
    }, 1100);
  }

  function renderError() {
    panel.innerHTML =
      '<div class="emptyState">' +
        '<div class="emptyIcon">!</div>' +
        '<p class="emptyTitle">Something went wrong</p>' +
        '<p class="emptyDesc">We couldn&rsquo;t load your activity. Check your connection and try again.</p>' +
        '<button type="button" class="retryBtn" id="retryBtn">Retry</button>' +
      '</div>';
    document.getElementById('retryBtn').addEventListener('click', load);
  }

  function renderData() {
    panel.innerHTML =
      '<div class="listRow"><span class="listDot"></span>Signed in from a new device</div>' +
      '<div class="listRow"><span class="listDot"></span>Payment method updated</div>' +
      '<div class="listRow"><span class="listDot"></span>Profile photo changed</div>';
  }

  renderStart();
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
