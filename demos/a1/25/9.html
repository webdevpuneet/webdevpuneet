<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Illustrated vs Text-Only Empty State">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Illustrated vs text-only empty state</h1>
    <p class="hint">Toggle between the two treatments of the exact same message to compare how much visual weight the illustration adds.</p>
  </header>
  <main class="stageWrap">
    <div class="toggleRow">
      <button type="button" class="toggleBtn active" id="illBtn">With illustration</button>
      <button type="button" class="toggleBtn" id="textBtn">Text only</button>
    </div>
    <div class="panel" id="panel"></div>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 20px 16px 28px; }

  .toggleRow { display: flex; gap: 6px; border: 1px solid var(--line); border-radius: 9px; padding: 3px; background: #fff; }
  .toggleBtn {
    padding: 7px 14px; border-radius: 7px; border: none; background: transparent;
    color: var(--sub); font: 700 12px system-ui, sans-serif; cursor: pointer;
  }
  .toggleBtn.active { background: var(--accent); color: #fff; }

  .panel { width: 100%; max-width: 360px; min-height: 200px; }

  .emptyState { text-align: center; padding: 30px 16px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }

  .illoWrap { margin: 0 auto 14px; width: 90px; height: 70px; }
  .illoWrap svg { width: 100%; height: 100%; }

  .emptyTitle { margin: 0 0 4px; font-size: 14.5px; font-weight: 700; }
  .emptyDesc { margin: 0; font-size: 12.5px; color: var(--sub); line-height: 1.5; max-width: 26em; margin-left: auto; margin-right: auto; }

  .textOnlyState { padding: 20px 16px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
</script>

<script type="text/plain" id="js">
  var panel = document.getElementById('panel');
  var illBtn = document.getElementById('illBtn');
  var textBtn = document.getElementById('textBtn');

  var ILLUSTRATION =
    '<svg viewBox="0 0 90 70" fill="none" xmlns="http://www.w3.org/2000/svg">' +
      '<rect x="10" y="20" width="70" height="42" rx="6" fill="#eef0ff" stroke="#6366f1" stroke-width="2"/>' +
      '<line x1="20" y1="34" x2="60" y2="34" stroke="#c7c9f5" stroke-width="3" stroke-linecap="round"/>' +
      '<line x1="20" y1="44" x2="46" y2="44" stroke="#c7c9f5" stroke-width="3" stroke-linecap="round"/>' +
      '<circle cx="66" cy="16" r="14" fill="#fff" stroke="#6366f1" stroke-width="2"/>' +
      '<line x1="61" y1="16" x2="71" y2="16" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round"/>' +
      '<line x1="66" y1="11" x2="66" y2="21" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round"/>' +
    '</svg>';

  function renderIllustrated() {
    illBtn.className = 'toggleBtn active';
    textBtn.className = 'toggleBtn';
    panel.innerHTML =
      '<div class="emptyState">' +
        '<div class="illoWrap">' + ILLUSTRATION + '</div>' +
        '<p class="emptyTitle">No documents yet</p>' +
        '<p class="emptyDesc">Create a document to start collecting notes, drafts and files in one place.</p>' +
      '</div>';
  }

  function renderTextOnly() {
    illBtn.className = 'toggleBtn';
    textBtn.className = 'toggleBtn active';
    panel.innerHTML =
      '<div class="textOnlyState">' +
        '<p class="emptyTitle">No documents yet</p>' +
        '<p class="emptyDesc">Create a document to start collecting notes, drafts and files in one place.</p>' +
      '</div>';
  }

  illBtn.addEventListener('click', renderIllustrated);
  textBtn.addEventListener('click', renderTextOnly);

  renderIllustrated();
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
