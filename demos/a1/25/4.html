<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body data-title="Filtered-to-Empty State">

<script type="text/plain" id="cdn">
</script>

<script type="text/plain" id="html">
  <header class="bar">
    <h1>Filtered-to-empty state</h1>
    <p class="hint">These filters are already too narrow to match anything. Click a filter chip to remove it, or "Clear all filters" to reset.</p>
  </header>
  <main class="stageWrap">
    <div class="filterRow" id="filterRow"></div>
    <div class="results" id="results"></div>
  </main>
</script>

<script type="text/plain" id="css">
  :root { --ink: #14161c; --sub: #6b7080; --line: #e3e5ea; --accent: #6366f1; }
  body { background: #f6f7f9; color: var(--ink); }
  .bar { padding: 18px 20px 8px; text-align: center; }
  .bar h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.01em; }
  .hint { margin: 0 auto; max-width: 46em; font-size: 12.5px; color: var(--sub); }
  .stageWrap { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 20px 16px 28px; }

  .filterRow { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 380px; }
  .filterChip {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px;
    border-radius: 999px; background: #eef0ff; color: var(--accent);
    font: 700 11.5px system-ui, sans-serif; border: none; cursor: pointer;
  }
  .filterChip:hover { background: #dfe1ff; }
  .filterChip .x { font-weight: 900; }

  .results { width: 100%; max-width: 380px; }

  .resultRow {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 9px; background: #fff;
    margin-bottom: 8px; font-size: 13px; font-weight: 600;
  }
  .resultDot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }

  .emptyState { text-align: center; padding: 26px 14px 10px; }
  .emptyIcon {
    width: 46px; height: 46px; margin: 0 auto 12px; border-radius: 50%;
    background: #f4f0ff; color: #7c3aed; display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .emptyTitle { margin: 0 0 4px; font-size: 14px; font-weight: 700; }
  .emptyDesc { margin: 0 0 14px; font-size: 12.5px; color: var(--sub); line-height: 1.5; }
  .clearBtn {
    padding: 9px 18px; border-radius: 9px; border: none;
    background: var(--accent); color: #fff; font: 700 12.5px system-ui, sans-serif; cursor: pointer;
  }
  .clearBtn:hover { background: #4f52d6; }
</script>

<script type="text/plain" id="js">
  var ALL_FILTERS = [
    { key: 'cat', label: 'Category: Shoes' },
    { key: 'price', label: 'Price: $200+' },
    { key: 'color', label: 'Color: Neon green' }
  ];

  var PRODUCTS = ['Trail shoes', 'Running shoes', 'Leather boots'];

  var activeFilters = ALL_FILTERS.slice();

  var filterRow = document.getElementById('filterRow');
  var results = document.getElementById('results');

  function render() {
    filterRow.innerHTML = activeFilters.map(function (f) {
      return '<button type="button" class="filterChip" data-key="' + f.key + '">' + f.label + ' <span class="x">&times;</span></button>';
    }).join('');

    var chips = filterRow.querySelectorAll('.filterChip');
    for (var i = 0; i < chips.length; i++) {
      chips[i].addEventListener('click', function () {
        removeFilter(this.getAttribute('data-key'));
      });
    }

    // The three filters combined never match a real product -- that's the point.
    var matches = activeFilters.length === 0 ? PRODUCTS : [];

    if (matches.length > 0 || activeFilters.length === 0) {
      if (matches.length === 0) {
        results.innerHTML = matches.length ? '' : PRODUCTS.map(function (p) {
          return '<div class="resultRow"><span class="resultDot"></span>' + p + '</div>';
        }).join('');
      } else {
        results.innerHTML = matches.map(function (p) {
          return '<div class="resultRow"><span class="resultDot"></span>' + p + '</div>';
        }).join('');
      }
      return;
    }

    results.innerHTML =
      '<div class="emptyState">' +
        '<div class="emptyIcon">&#128269;</div>' +
        '<p class="emptyTitle">No items match your filters</p>' +
        '<p class="emptyDesc">Try removing a filter above, or clear them all to see everything in stock.</p>' +
        '<button type="button" class="clearBtn" id="clearBtn">Clear all filters</button>' +
      '</div>';
    document.getElementById('clearBtn').addEventListener('click', clearAll);
  }

  function removeFilter(key) {
    activeFilters = activeFilters.filter(function (f) { return f.key !== key; });
    render();
  }

  function clearAll() {
    activeFilters = [];
    render();
  }

  render();
</script>

<script src="../../assets/demo.js"></script>
</body>
</html>
