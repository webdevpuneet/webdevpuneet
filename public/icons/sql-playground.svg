  <rect x="6" y="9" width="20" height="10" fill="#336791" opacity="0.75"/>
  <ellipse cx="16" cy="19" rx="10" ry="3.5" fill="#336791"/>
  <!-- Highlight stripe -->
  <ellipse cx="16" cy="9" rx="10" ry="3.5" fill="none" stroke="#fff" stroke-width="0.7" opacity="0.35"/>
