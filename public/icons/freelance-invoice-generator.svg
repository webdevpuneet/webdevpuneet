<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="7" fill="#6366f1"/>
  <!-- Document -->
  <rect x="7" y="5" width="16" height="22" rx="2" fill="#fff" opacity="0.15"/>
  <rect x="7" y="5" width="16" height="22" rx="2" fill="none" stroke="#fff" stroke-width="1.5"/>
  <!-- Header accent bar -->
  <rect x="7" y="5" width="16" height="5" rx="2" fill="#fff" opacity="0.9"/>
  <!-- Lines -->
  <line x1="10" y1="14" x2="22" y2="14" stroke="#fff" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <line x1="10" y1="17" x2="22" y2="17" stroke="#fff" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <line x1="10" y1="20" x2="18" y2="20" stroke="#fff" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
  <!-- Dollar sign -->
  <text x="15" y="11" font-size="5" font-weight="900" font-family="Arial" fill="#6366f1" text-anchor="middle">$</text>
</svg>
