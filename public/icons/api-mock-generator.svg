<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#071a12"/>
  <!-- GET badge -->
  <rect x="3" y="4" width="12" height="6" rx="2" fill="#10b981" opacity="0.9"/>
  <text x="9" y="9" font-family="monospace" font-size="5" font-weight="900" text-anchor="middle" fill="#fff">GET</text>
  <!-- POST badge -->
  <rect x="17" y="4" width="12" height="6" rx="2" fill="#3b82f6" opacity="0.9"/>
  <text x="23" y="9" font-family="monospace" font-size="5" font-weight="900" text-anchor="middle" fill="#fff">POST</text>
  <!-- path line -->
  <rect x="3" y="13" width="26" height="1.5" rx="1" fill="#10b981" opacity="0.4"/>
  <!-- JSON braces -->
  <text x="5" y="24" font-family="monospace" font-size="10" font-weight="900" fill="#10b981">{ }</text>
