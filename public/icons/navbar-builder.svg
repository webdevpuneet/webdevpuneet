<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Navbar bar -->
  <rect x="4" y="10" width="40" height="12" rx="3" stroke="#f97316" stroke-width="2.5" fill="none"/>
  <!-- Logo dot -->
  <circle cx="12" cy="16" r="3" fill="#f97316"/>
  <!-- Nav links (3 horizontal bars inside navbar) -->
  <line x1="22" y1="14" x2="30" y2="14" stroke="#f97316" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="18" x2="30" y2="18" stroke="#f97316" stroke-width="2" stroke-linecap="round"/>
  <!-- CTA button -->
  <rect x="33" y="12" width="8" height="8" rx="2" fill="#f97316" opacity="0.85"/>
  <!-- Page content lines below navbar -->
  <line x1="8" y1="28" x2="36" y2="28" stroke="#f97316" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <line x1="8" y1="34" x2="28" y2="34" stroke="#f97316" stroke-width="2" stroke-linecap="round" opacity="0.25"/>
</svg>
