<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">SVG Playground</title>
  <rect width="64" height="64" rx="14" fill="#ff9800"/>
  <!-- Bézier path curve -->
  <path d="M14 46 C14 26 32 44 50 22" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>
  <!-- vector anchor nodes -->
  <rect x="10" y="42" width="8" height="8" rx="1.5" fill="#fff"/>
  <rect x="46" y="18" width="8" height="8" rx="1.5" fill="#fff"/>
  <!-- control-point handle -->
  <circle cx="32" cy="34" r="4" fill="#111827"/>
  <line x1="32" y1="34" x2="14" y2="46" stroke="#111827" stroke-width="1.6"/>
</svg>
