<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">SEO Playground social preview</title>
  <desc id="desc">Preview Google snippets, Open Graph cards, audits, links, images, and metadata output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ecfdf5"/>
      <stop offset="0.52" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="72" y="70" width="1056" height="490" rx="28" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="72" y="70" width="1056" height="74" rx="28" fill="#0f766e"/>
  <rect x="72" y="116" width="1056" height="28" fill="#0f766e"/>
  <text x="116" y="119" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="800">SEO Playground</text>
  <text x="116" y="206" fill="#0f172a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="850">Preview, audit, and export metadata</text>
  <text x="116" y="258" fill="#475569" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25">SERP snippets, Open Graph cards, schema, links, images, and technical SEO checks.</text>
  <g transform="translate(116 318)">
    <rect width="420" height="150" rx="16" fill="#f8fafc" stroke="#d7dde8"/>
    <text x="24" y="38" fill="#166534" font-family="Arial,sans-serif" font-size="17">https://fwdtools.com/seo-playground/</text>
    <text x="24" y="78" fill="#1a0dab" font-family="Arial,sans-serif" font-size="24">SEO Playground - Preview SERP...</text>
    <text x="24" y="112" fill="#475569" font-family="Arial,sans-serif" font-size="17">Test metadata before publishing...</text>
  </g>
  <g transform="translate(574 318)">
    <rect width="230" height="150" rx="16" fill="#ecfdf5" stroke="#bbf7d0"/>
    <text x="24" y="50" fill="#047857" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800">Audit Score</text>
    <text x="24" y="111" fill="#065f46" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="900">100%</text>
  </g>
  <g transform="translate(836 318)">
    <rect width="220" height="150" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
    <circle cx="44" cy="48" r="13" fill="#0f766e"/>
    <circle cx="44" cy="84" r="13" fill="#0f766e"/>
    <circle cx="44" cy="120" r="13" fill="#0f766e"/>
    <text x="72" y="55" fill="#0f172a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">SERP</text>
    <text x="72" y="91" fill="#0f172a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">Social</text>
    <text x="72" y="127" fill="#0f172a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">Schema</text>
  </g>
</svg>
