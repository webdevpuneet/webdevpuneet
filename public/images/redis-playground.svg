<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Redis Playground social preview</title>
  <desc id="desc">Visual Redis playground with key-value, TTL, cache, and Pub/Sub panels.</desc>
  <rect width="1200" height="630" fill="#fff1f2"/>
  <rect x="72" y="70" width="1056" height="490" rx="28" fill="#ffffff" stroke="#fecaca" stroke-width="2"/>
  <rect x="72" y="70" width="1056" height="86" rx="28" fill="#dc2626"/>
  <text x="116" y="124" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="38" font-weight="800">Redis Playground</text>
  <text x="116" y="198" fill="#991b1b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="58" font-weight="900">Learn Redis visually</text>
  <text x="118" y="244" fill="#475569" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">Key-value demos, caching simulator, TTL visualizer, and Pub/Sub examples.</text>
  <g transform="translate(118 300)">
    <rect width="260" height="150" rx="16" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="24" y="44" fill="#9a3412" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="800">SET user:42</text>
    <text x="24" y="82" fill="#334155" font-family="Consolas,monospace" font-size="24">"Puneet"</text>
    <text x="24" y="122" fill="#dc2626" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">persistent key</text>
  </g>
  <g transform="translate(418 300)">
    <rect width="260" height="150" rx="16" fill="#fef2f2" stroke="#fecaca"/>
    <text x="24" y="44" fill="#991b1b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="800">TTL otp:login</text>
    <rect x="24" y="76" width="210" height="12" rx="6" fill="#fecaca"/>
    <rect x="24" y="76" width="138" height="12" rx="6" fill="#dc2626"/>
    <text x="24" y="122" fill="#334155" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">18 seconds left</text>
  </g>
  <g transform="translate(718 300)">
    <rect width="260" height="150" rx="16" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="24" y="44" fill="#166534" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="800">Cache hit</text>
    <text x="24" y="82" fill="#334155" font-family="Consolas,monospace" font-size="22">page:/pricing</text>
    <text x="24" y="122" fill="#15803d" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">served from Redis</text>
  </g>
</svg>
